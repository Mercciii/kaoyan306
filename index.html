        item.error = e.message || "解析失败";
        item.text = "";
        log("❌ [" + item.name + "] " + item.error);
      }
      renderQueue();
    }
  }

  fileBtn.addEventListener("click", () => fileIn.click());
  clearFilesBtn.addEventListener("click", () => {
    if (!fileQueue.length) return;
    confirmPopup("清空文件列表？", () => {
      fileQueue.length = 0;
      fileInfo.textContent = "未选择";
      renderQueue();
    });
  });
  fileIn.addEventListener("change", () => {
    const files = Array.from(fileIn.files || []);
    if (!files.length) return;
    for (const f of files) {
      fileQueue.push({
        id: genId(),
        file: f,
        name: f.name,
        status: "pending",
        text: "",
        jsonItems: null,
        jsonText: "",
        error: "",
      });
    }
    fileInfo.textContent = "共 " + fileQueue.length + " 个文件";
    renderQueue();
    fileIn.value = "";
  });

  body.appendChild(form);
  pop.appendChild(body);

  const footer = el("div", "popup-footer");
  const closeBtn = el("button", "btn", "关闭");
  const copyPrompt = el("button", "btn", "复制 Prompt");
  const saveCfgBtn = el("button", "btn", "保存配置");
  const genBtn = el("button", "btn", "开始生成");
  const importBtn = el("button", "btn", "导入结果");
  const importAllBtn = el("button", "btn", "全部导入");

  function readCfg() {
    return {
      provider: provSel.value,
      base_url: baseIn.value.trim(),
      model: modelIn.style.display === "none" ? modelSel.value : modelIn.value.trim(),
      api_key: keyIn.value.trim(),
      temperature: parseFloat(tempIn.value) || 0.2,
      max_tokens: parseInt(maxIn.value, 10) || 8000,
      chunk_size: parseInt(chunkIn.value, 10) || 5000,
      chunk_overlap: parseInt(overlapIn.value, 10) || 300,
    };
  }
  closeBtn.addEventListener("click", () => ov.remove());
  saveCfgBtn.addEventListener("click", () => { saveAiConfig(readCfg()); log("✅ 配置已保存"); });

  copyPrompt.addEventListener("click", async () => {
    copyPrompt.disabled = true;
    try {
      await ensureQueueText();
      const queueText = fileQueue.filter(f => f.text).map(f => f.text).join("\n\n");
      const text = [queueText, casePoolText, ta.value.trim()].filter(Boolean).join("\n\n");
      if (!text) { confirmPopup("请先添加文件、选择病例库或粘贴文本"); return; }
      const full = (isQ ? buildQuestionPrompt(subjSel.value) : buildCasePrompt(subjSel.value)) + "\n\n=====\n以下是医学资料：\n\n" + text;
      await copyText(full);
      logEl.textContent = "";
      log("📋 已复制 Prompt（含 " + text.length + " 字资料）");
      log("请到以下任一网页版粘贴：");
      log("  · https://chat.deepseek.com");
      log("  · https://chat.openai.com");
      log("  · https://kimi.moonshot.cn");
      log("  · https://chatglm.cn");
      log("");
      log("拿到返回 JSON 后，粘贴到下方「生成结果」框，再点「导入结果」即可。");
    } catch (e) { confirmPopup("复制失败：" + e.message); }
    finally { copyPrompt.disabled = false; }
  });

  genBtn.addEventListener("click", async () => {
    const provider = provSel.value;
    const preset = AI_PRESETS[provider];

    if (preset.manual) {
      genBtn.disabled = true;
      try {
        await ensureQueueText();
        const queueText = fileQueue.filter(f => f.text).map(f => f.text).join("\n\n");
        const text = [queueText, casePoolText, ta.value.trim()].filter(Boolean).join("\n\n");
        if (!text) { confirmPopup("请先添加文件、选择病例库或粘贴文本"); return; }
        const full = (isQ ? buildQuestionPrompt(subjSel.value) : buildCasePrompt(subjSel.value)) + "\n\n=====\n以下是医学资料：\n\n" + text;
        await copyText(full);
        logEl.textContent = "";
        log("📋 已复制 Prompt（含 " + text.length + " 字资料）");
        log("请到任意网页版 AI 粘贴，再把返回 JSON 贴到下方框。");
      } catch (e) { confirmPopup("复制失败：" + e.message); }
      finally { genBtn.disabled = false; }
      return;
    }

    const c = readCfg();
    if (!c.base_url) { confirmPopup("请填写 Base URL"); return; }
    if (!c.model) { confirmPopup("请选择或填写模型名"); return; }
    if (!c.api_key && !preset.no_key) { confirmPopup("请填写 API Key，或切换到「手动模式」"); return; }
    if (preset.cors === false) {
      confirmPopup("⚠ 该服务不支持浏览器直连（CORS）。\n\n建议：\n  1. 切换到 OpenRouter（含 DeepSeek 免费版）\n  2. 或自建代理后改填代理地址\n  3. 或改用「手动模式」");
      return;
    }

    saveAiConfig(c);
    logEl.textContent = ""; outTa.value = ""; setCount();
    genBtn.disabled = true; importBtn.disabled = true; importAllBtn.disabled = true; copyPrompt.disabled = true;

    try {
      for (let i = 0; i < fileQueue.length; i++) {
        const item = fileQueue[i];
        if (item.status === "success") continue;

        if (!item.text) {
          item.status = "parsing";
          item.error = "";
          renderQueue();
          try {
            item.text = await extractTextFromFile(item.file, (pg, total) => log("[" + item.name + "] 解析第 " + pg + "/" + total + " 页"));
            item.status = "parsed";
            log("[" + item.name + "] 解析完成，共 " + item.text.length + " 字");
          } catch (e) {
            item.status = "error";
            item.error = e.message || "解析失败";
            log("❌ [" + item.name + "] " + item.error);
            renderQueue();
            continue;
          }
          renderQueue();
        }

        item.status = "generating";
        renderQueue();
        log("[" + (i + 1) + "/" + fileQueue.length + "] " + item.name + " 调用 AI 中…");
        try {
          const items = await aiGenerate(
            { cfg: c, subject: subjSel.value, text: item.text },
            msg => { if (/完成|失败|解析出|合并去重|共切分/.test(msg)) log("[" + item.name + "] " + msg); },
            isQ
          );
          item.jsonItems = items;
          item.jsonText = JSON.stringify(items, null, 2);
          item.status = "success";
          log("✅ " + item.name + " 完成，共 " + items.length + " 条");
        } catch (e) {
          item.status = "error";
          item.error = e.message;
          log("❌ " + item.name + " 失败：" + e.message);
        }
        renderQueue();

        if (i < fileQueue.length - 1) await new Promise(r => setTimeout(r, 1500));
      }

      // 手动粘贴 + 病例库资料（合并处理）
      const manualSources = [];
      const taText = ta.value.trim();
      if (taText)           manualSources.push({ label: "手动粘贴", text: taText });
      if (casePoolText)     manualSources.push({ label: casePoolLabel || "病例库", text: casePoolText });

      const manualResults = [];
      for (let i = 0; i < manualSources.length; i++) {
        const m = manualSources[i];
        log("处理 " + m.label + "（约 " + Math.round(m.text.length / 1024) + " KB）…");
        try {
          const items = await aiGenerate(
            { cfg: c, subject: subjSel.value, text: m.text },
            msg => { if (/完成|失败|解析出|合并去重|共切分/.test(msg)) log("[" + m.label + "] " + msg); },
            isQ
          );
          manualResults.push(...items);
          log("✅ " + m.label + " 完成，共 " + items.length + " 条");
        } catch (e) {
          log("❌ " + m.label + " 失败：" + e.message);
        }
        if (i < manualSources.length - 1) await new Promise(r => setTimeout(r, 1200));
      }
      if (manualResults.length) {
        const seen = {};
        const merged = [];
        for (const it of manualResults) {
          const k = isQ ? String(it.stem || "").trim() : String(it.title || "").trim();
          if (!k || seen[k]) continue;
          seen[k] = true;
          merged.push(it);
        }
        outTa.value = JSON.stringify(merged, null, 2);
        setCount();
        log("🎉 手动来源共 " + merged.length + " 条（去重后）");
      }

      if (!fileQueue.length && !manualSources.length) {
        log("⚠ 没有可处理的内容（请在 ③ 选病例库，或上传文件 / 粘贴文本）");
      }
    } catch (e) {
      log("❌ " + e.message);
    } finally {
      genBtn.disabled = false; importBtn.disabled = false; importAllBtn.disabled = false; copyPrompt.disabled = false;
    }
  });

  importAllBtn.addEventListener("click", () => {
    const successful = fileQueue.filter(f => f.status === "success" && f.jsonItems && f.jsonItems.length);
    if (!successful.length) { confirmPopup("没有可导入的成功结果"); return; }

    const seen = {};
    const allItems = [];
    for (const item of successful) {
      for (const it of item.jsonItems) {
        const key = isQ ? String(it.stem || "").trim() : String(it.title || "").trim();
        if (!key || seen[key]) continue;
        seen[key] = true;
        allItems.push(it);
      }
    }
    if (!allItems.length) { confirmPopup("去重后没有有效条目"); return; }

    stripAiIds(allItems);
    const jsonText = JSON.stringify(allItems, null, 2);
    const p = isQ ? parseQuestionList(jsonText) : parseJsonList(jsonText);
    if (p.err) { confirmPopup("合并后的 JSON 不合法：" + p.err); return; }

    if (isQ) {
      const r = questionStore.importFromText(jsonText, "append");
      if (!r.ok) { confirmPopup(r.msg); return; }
      renderQuizListOnly(); rebuildQSubjectValues();
      confirmPopup("已导入 " + allItems.length + " 条（去重后）\n" + r.msg);
    } else {
      const r = store.importFromText(jsonText, "append", null);
      if (!r.ok) { confirmPopup(r.msg); return; }
      render();
      let msg = "已导入 " + allItems.length + " 条（去重后）\n" + r.msg;
      if (r.warnings.length) msg += "\n\n注意：\n" + r.warnings.slice(0, 5).join("\n");
      confirmPopup(msg);
    }
  });

  importBtn.addEventListener("click", () => {
    const t = outTa.value.trim();
    if (!t) { confirmPopup("还没有生成结果"); return; }
    const cleanText = stripIdsFromJsonText(t);
    const p = isQ ? parseQuestionList(cleanText) : parseJsonList(cleanText);
    if (p.err) { confirmPopup("结果不是合法 JSON：" + p.err); return; }
    ov.remove();
    if (isQ) {
      const result = questionStore.importFromText(cleanText, "append");
      if (!result.ok) { confirmPopup(result.msg); return; }
      renderQuizListOnly(); rebuildQSubjectValues();
      confirmPopup(result.msg);
    } else {
      const result = store.importFromText(cleanText, "append", null);
      if (!result.ok) { confirmPopup(result.msg); return; }
      render();
      let msg = result.msg;
      if (result.warnings.length) {
        msg += "\n\n注意：\n" + result.warnings.slice(0, 8).join("\n");
        if (result.warnings.length > 8) msg += "\n…… 共 " + result.warnings.length + " 条";
      }
      confirmPopup(msg);
    }
  });

  footer.appendChild(closeBtn); footer.appendChild(copyPrompt);
  footer.appendChild(saveCfgBtn); footer.appendChild(genBtn);
  footer.appendChild(importAllBtn); footer.appendChild(importBtn);
  pop.appendChild(footer);
  ov.appendChild(pop);
  document.body.appendChild(ov);
}

/* =========================================================
   刷题主面板（支持 single / multiple / judge / B / A3）
   ========================================================= */
function openQuiz(pool, opts) {
  opts = opts || {};
  const mode = opts.mode || state.quizMode || "practice";
  const examTimer = opts.timer || 0;
  let base = pool && pool.length ? pool.slice() : questionStore.data.slice();

  const scope = opts.scope || state.quizScope || "all";
  if (scope === "wrong") base = base.filter(q => { const r = answerLog.data[q.id]; return r && !r.correct; });
  else if (scope === "unanswered") base = base.filter(q => !answerLog.data[q.id]);
  if (!base.length) { confirmPopup("该范围下没有题目"); return; }

  base.sort((a, b) => quizPriority(b) - quizPriority(a));

  const cnt = opts.count !== undefined ? opts.count : 0;
  if (cnt > 0 && base.length > cnt) base = base.slice(0, cnt);

  const shuffled = base;

  let idx = opts.startIdx || 0;
  let userAnswers = opts.userAnswers || {};
  let subIdx = 0;

  const ov = el("div", "overlay");
  const pop = el("div", "popup popup-lg");
  const titleEl = el("div", "popup-title", "刷题");
  pop.appendChild(titleEl);
  const body = el("div", "popup-body");

  const topBar = el("div", "");
  topBar.style.cssText = "display:flex;flex-direction:column;gap:4px;flex:none";
  const progressWrap = el("div", "quiz-progress-wrap");
  const progressFill = el("div", "quiz-progress-fill");
  progressWrap.appendChild(progressFill);
  const metaEl = el("div", "detail-meta", "");
  const timerEl = el("div", "quiz-timer", "");
  topBar.appendChild(progressWrap); topBar.appendChild(metaEl); topBar.appendChild(timerEl);
  body.appendChild(topBar);

  const scroll = el("div", "detail-scroll");
  body.appendChild(scroll);

  const footer = el("div", "popup-footer");
  const starBtn = el("button", "btn", "☆");
  const doubtBtn = el("button", "btn", "❓");
  const skipBtn = el("button", "btn", "跳过");
  const submitBtn = el("button", "btn", "提交");
  const nextBtn = el("button", "btn", "下一题 →");
  const closeBtn = el("button", "btn", "退出");
  footer.appendChild(starBtn); footer.appendChild(doubtBtn); footer.appendChild(skipBtn);
  footer.appendChild(submitBtn); footer.appendChild(nextBtn); footer.appendChild(closeBtn);
  pop.appendChild(body);
  pop.appendChild(footer);

  let answered = false;
  let timerHandle = null;
  let startTs = Date.now();
  let sessionId = genId();

  function saveProgress() {
    quizProgress.save({
      sessionId: sessionId,
      poolIds: base.map(q => q.id),
      idx: idx,
      userAnswers: userAnswers,
      startedAt: Date.now(),
      mode: mode,
      scope: scope,
    });
  }
  function currentQ() { return shuffled[idx]; }
  function getOpts(q) {
    if (q.type === "B") return q.sharedOptions || [];
    if (q.type === "A3") return (q.questions[subIdx] && q.questions[subIdx].options) || [];
    return q.options || [];
  }
  function getStem(q) {
    if (q.type === "B") return (q.subQuestions[subIdx] && q.subQuestions[subIdx].stem) || "";
    if (q.type === "A3") return (q.questions[subIdx] && q.questions[subIdx].stem) || "";
    return q.stem;
  }
  function getAnswer(q) {
    if (q.type === "B") return (q.subQuestions[subIdx] && q.subQuestions[subIdx].answer) || [];
    if (q.type === "A3") return (q.questions[subIdx] && q.questions[subIdx].answer) || [];
    return q.answer;
  }
  function getExplanation(q) {
    if (q.type === "B") return (q.subQuestions[subIdx] && q.subQuestions[subIdx].explanation) || "";
    if (q.type === "A3") return (q.questions[subIdx] && q.questions[subIdx].explanation) || "";
    return q.explanation;
  }
  function subCount(q) {
    if (q.type === "B") return q.subQuestions.length;
    if (q.type === "A3") return q.questions.length;
    return 1;
  }
  function answerKey(q) { return q.id + (subCount(q) > 1 ? "#" + subIdx : ""); }
  function isMultiQ(q) {
    return q.type === "multiple" || q.type === "B" || q.type === "A3";
  }
  function updateProgress() {
    progressFill.style.width = ((idx + 1) / shuffled.length * 100) + "%";
  }

  function render() {
    const q = currentQ();
    answered = false;
    const key = answerKey(q);
    if (!userAnswers[key]) userAnswers[key] = [];
    const ansArr = userAnswers[key];

    titleEl.textContent = (mode === "review" ? "背题 · " : mode === "exam" ? "考试 · " : "练习 · ") +
      (q.subject || "") + (q.chapter ? " · " + q.chapter : "");
    const totalSub = subCount(q);
    metaEl.textContent = (idx + 1) + " / " + shuffled.length +
      "    题型：" + (QUIZ_TYPES[q.type] || q.type) +
      (totalSub > 1 ? "  (" + (subIdx + 1) + "/" + totalSub + ")" : "") +
      (q.frequency ? "    " + q.frequency : "") +
      (q.difficulty ? "    难度 " + "★".repeat(q.difficulty) : "");
    starBtn.textContent = q.starred ? "★" : "☆";
    doubtBtn.textContent = q.doubt ? "❓✓" : "❓";
    updateProgress();

    scroll.innerHTML = "";
    if (q.type === "A3" && q.caseStem) {
      const s = el("div", "quiz-stem");
      s.innerHTML = renderRich(q.caseStem, "");
      scroll.appendChild(s);
    }
    const stem = getStem(q);
    if (stem) {
      const s = el("div", "quiz-stem");
      s.innerHTML = renderRich(stem, "");
      if (q.type === "A3" && q.caseStem) s.style.marginTop = "10px";
      scroll.appendChild(s);
    }
    if (mode === "practice" && isMultiQ(q) && getAnswer(q).length > 1) {
      scroll.appendChild(el("div", "multi-hint", "💡 本题为多选题，正确选项可能不止 1 个。"));
    }

    const optWrap = el("div", "quiz-opts");
    optWrap.style.marginTop = "10px";
    getOpts(q).forEach(o => {
      const btn = el("button", "quiz-opt", "");
      btn.dataset.key = o.key || "";
      btn.innerHTML = "<strong>" + escapeHtml(o.key || "") + ".</strong> " + renderRich(o.text || "", "");
      if (ansArr.indexOf(o.key) !== -1) btn.classList.add("chosen");
      btn.addEventListener("click", () => {
        if (answered && mode !== "review") return;
        const k = o.key;
        if (isMultiQ(q)) {
          const p = ansArr.indexOf(k);
          if (p === -1) ansArr.push(k); else ansArr.splice(p, 1);
        } else {
          ansArr.length = 0; ansArr.push(k);
        }
        Array.from(optWrap.children).forEach(b => b.classList.toggle("chosen", ansArr.indexOf(b.dataset.key) !== -1));
      });
      optWrap.appendChild(btn);
    });
    scroll.appendChild(optWrap);

    const ansBox = el("div", "");
    ansBox.id = "__quiz_result";
    scroll.appendChild(ansBox);

    if (mode === "review") {
      answered = true;
      showResult(q, ansArr, true);
      submitBtn.style.display = "none";
      nextBtn.style.display = "";
    } else if (mode === "exam") {
      submitBtn.style.display = "none";
      nextBtn.style.display = "";
    } else {
      submitBtn.disabled = false;
      submitBtn.style.display = "";
      nextBtn.style.display = "";
    }
    nextBtn.disabled = idx >= shuffled.length - 1 && subIdx >= subCount(q) - 1;
    startTs = Date.now();
  }

  function showResult(q, ansArr, isReview) {
    const correct = judgeMulti(q, subIdx, ansArr);
    const correctAns = getAnswer(q);
    const optWrap = scroll.querySelector(".quiz-opts");
    if (optWrap) {
      Array.from(optWrap.children).forEach(b => {
        const k = b.dataset.key;
        const isC = correctAns.indexOf(k) !== -1;
        const isCh = ansArr.indexOf(k) !== -1;
        if (isC) b.classList.add("correct");
        else if (isCh) b.classList.add("wrong");
      });
    }
    const box = scroll.querySelector("#__quiz_result");
    if (!box) return;
    box.innerHTML = "";
    const head = el("div", "merged-timeline-title",
      isReview ? "📖 背题模式" : (correct ? "✅ 回答正确" : "❌ 回答错误　正确答案：" + correctAns.join("、")));
    head.style.marginTop = "14px";
    box.appendChild(head);
    const exp = getExplanation(q);
    if (exp) {
      const e = el("div", "field-row");
      const eb = el("div", "field-content");
      eb.style.display = "block"; eb.style.padding = "10px";
      eb.innerHTML = renderRich(exp, "");
      e.appendChild(eb);
      box.appendChild(e);
    }
    if (q.relatedCase) {
      const rel = store.data.find(d => d.title === q.relatedCase);
      if (rel) {
        const jump = el("button", "btn", "📖 查看相关病例：" + q.relatedCase);
        jump.style.marginTop = "10px"; jump.style.height = "44px";
        jump.addEventListener("click", () => { ov.remove(); showDetail(rel); });
        box.appendChild(jump);
      }
    }
    const noteWrap = el("div", "");
    noteWrap.style.marginTop = "10px";
    noteWrap.appendChild(el("div", "edit-label", "我的笔记"));
    const noteTa = document.createElement("textarea");
    noteTa.className = "edit-textarea";
    noteTa.style.minHeight = "60px";
    noteTa.value = loadQNotes()[q.id] || "";
    noteTa.addEventListener("blur", () => { const n = loadQNotes(); n[q.id] = noteTa.value; saveQNotes(n); });
    noteWrap.appendChild(noteTa);
    box.appendChild(noteWrap);
    scroll.scrollTop = scroll.scrollHeight;
  }

  function submit() {
    if (answered) return;
    const q = currentQ();
    const ansArr = userAnswers[answerKey(q)];
    if (!ansArr || !ansArr.length) { confirmPopup("请先选择答案"); return; }
    if (mode === "practice" && isMultiQ(q)) {
      const correctCount = getAnswer(q).length;
      if (ansArr.length < correctCount) {
        confirmPopup("⚠ 本题正确答案可能不止 " + ansArr.length + " 个，确定提交？", () => doSubmit(q, ansArr));
        return;
      }
    }
    doSubmit(q, ansArr);
  }
  function doSubmit(q, ansArr) {
    answered = true;
    const correct = judgeMulti(q, subIdx, ansArr);
    const elapsed = Math.round((Date.now() - startTs) / 1000);
    answerLog.record(answerKey(q), ansArr.slice(), correct, elapsed);
    showResult(q, ansArr, false);
    submitBtn.disabled = true;
    saveProgress();
    updateProgress();
  }
  function nextSub() {
    const q = currentQ();
    if (subIdx < subCount(q) - 1) { subIdx++; render(); scroll.scrollTop = 0; return; }
    if (idx < shuffled.length - 1) {
      idx++; subIdx = 0;
      render(); scroll.scrollTop = 0;
      saveProgress();
    } else {
      const s = answerLog.stats();
      let msg = "🎉 全部完成！\n\n本次共 " + shuffled.length + " 题\n答对：" + s.correct + " / " + s.total;
      confirmPopup(msg, () => { quizProgress.clear(); ov.remove(); }, "关闭", "刷题完成");
    }
  }

  skipBtn.addEventListener("click", nextSub);
  submitBtn.addEventListener("click", submit);
  nextBtn.addEventListener("click", () => {
    if (mode === "exam" && !answered) {
      const q = currentQ();
      const ansArr = userAnswers[answerKey(q)] || [];
      const correct = judgeMulti(q, subIdx, ansArr);
      answerLog.record(answerKey(q), ansArr.slice(), correct, 0);
      answered = true;
    }
    nextSub();
  });
  closeBtn.addEventListener("click", () => { saveProgress(); ov.remove(); });
  starBtn.addEventListener("click", () => {
    const q = currentQ();
    q.starred = !q.starred;
    questionStore.save();
    starBtn.textContent = q.starred ? "★" : "☆";
  });
  doubtBtn.addEventListener("click", () => {
    const q = currentQ();
    q.doubt = !q.doubt;
    questionStore.save();
    doubtBtn.textContent = q.doubt ? "❓✓" : "❓";
  });

  function onKey(e) {
    if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
    const k = e.key.toUpperCase();
    const q = currentQ();
    const optWrap = scroll.querySelector(".quiz-opts");
    if (!optWrap) return;
    const opts = Array.from(optWrap.children);
    if (["A", "B", "C", "D", "E"].indexOf(k) !== -1) {
      const i = ["A", "B", "C", "D", "E"].indexOf(k);
      if (opts[i]) opts[i].click();
      e.preventDefault();
    } else if (["1", "2", "3", "4", "5"].indexOf(k) !== -1) {
      const i = parseInt(k, 10) - 1;
      if (opts[i]) opts[i].click();
      e.preventDefault();
    } else if (e.key === "Enter") {
      if (!answered && mode !== "exam" && mode !== "review") submit();
      else nextSub();
      e.preventDefault();
    } else if (e.key === " ") {
      e.preventDefault();
      nextSub();
    }
  }
  document.addEventListener("keydown", onKey);

  if (mode === "exam" && examTimer > 0) {
    let remain = examTimer * 60;
    timerEl.textContent = "⏱ " + formatDuration(remain);
    timerHandle = setInterval(() => {
      remain--;
      timerEl.textContent = "⏱ " + formatDuration(remain);
      if (remain <= 0) { clearInterval(timerHandle); confirmPopup("考试时间到！", () => ov.remove()); }
    }, 1000);
  }

  ov.appendChild(pop);
  document.body.appendChild(ov);
  render();
  const autoSave = setInterval(saveProgress, 5000);
  const origCleanup = function () {
    document.removeEventListener("keydown", onKey);
    if (timerHandle) clearInterval(timerHandle);
    clearInterval(autoSave);
  };
  const origRemove = ov.remove.bind(ov);
  ov.remove = function () {
    origCleanup();
    origRemove();
  };
}

  });
  sjSel.value = state.qSubject;

  scSel.className = "edit-select";

    const o = document.createElement("option"); o.value = v; o.textContent = t; scSel.appendChild(o);
  });
  scSel.value = state.quizScope;
  addRow("范围", scSel);

  const cntIn = document.createElement("input");
  cntIn.className = "edit-input"; cntIn.type = "text"; cntIn.value = String(state.quizCount);
  addRow("题数", cntIn);

  const mdSel = document.createElement("select");
  mdSel.className = "edit-select";
  [["practice", "练习（即时对答案）"], ["exam", "考试（全部答完才看答案）"], ["review", "背题（直接看答案）"]].forEach(([v, t]) => {
    const o = document.createElement("option"); o.value = v; o.textContent = t; mdSel.appendChild(o);
  });
  mdSel.value = state.quizMode;
  addRow("模式", mdSel);

  const examRow = el("div", "import-row");
  examRow.appendChild(el("div", "row-label", "模拟整卷"));

  examBtn.style.flex = "none"; examBtn.style.padding = "0 10px";
  examBtn.addEventListener("click", () => {
    state.quizScope = scSel.value; state.quizMode = "exam";
    saveSettings();
    ov.remove();
    const ratios = { "生理学": 0.14, "生物化学": 0.12, "病理学": 0.12, "内科学": 0.30, "外科学": 0.23, "人文精神": 0.09 };
    const total = 180;
    const pool = [];
    for (const sj in ratios) {
      const cnt = Math.round(ratios[sj] * total);
      const sub = questionStore.data.filter(q => q.subject === sj);
      sub.sort((a, b) => quizPriority(b) - quizPriority(a));
      pool.push(...sub.slice(0, cnt));
    }
    if (pool.length < 20) { confirmPopup("题库不足，无法组卷"); return; }

  const footer = el("div", "popup-footer");

  const startBtn = el("button", "btn", "开始刷题");
  cancelBtn.addEventListener("click", () => ov.remove());
  startBtn.addEventListener("click", () => {
    state.qSubject = sjSel.value;
    state.qType = tpSel.value;
    state.quizScope = scSel.value;
    state.quizMode = mdSel.value;
    state.quizCount = parseInt(cntIn.value, 10) || 20;
    saveSettings();
    document.getElementById("qSubjectSel").value = state.qSubject;
    document.getElementById("qTypeSel").value = state.qType;
    let pool = questionStore.data.slice();
    if (state.qSubject !== "全部") pool = pool.filter(q => q.subject === state.qSubject);
    if (state.qType !== "全部") pool = pool.filter(q => q.type === state.qType);
    if (state.quizScope === "wrong") pool = pool.filter(q => { const r = answerLog.data[q.id]; return r && !r.correct; });
    else if (state.quizScope === "unanswered") pool = pool.filter(q => !answerLog.data[q.id]);
    if (!pool.length) { confirmPopup("该筛选下没有题目"); return; }
    ov.remove();
    openQuiz(pool, { mode: state.quizMode, scope: state.quizScope, count: state.quizCount });
  });
  footer.appendChild(cancelBtn); footer.appendChild(startBtn);
  pop.appendChild(footer);
  ov.appendChild(pop);
  document.body.appendChild(ov);
}

/* =========================================================
   错题本
   ========================================================= */
function openWrongBook() {
  const wrongIds = answerLog.wrongIds();
  const wrongs = questionStore.data.filter(q => wrongIds.indexOf(q.id) !== -1);
  const ov = el("div", "overlay");
  const pop = el("div", "popup popup-sm");
  pop.appendChild(el("div", "popup-title", "错题本（" + wrongs.length + " 题）"));
  const body = el("div", "popup-body");

  const footer = el("div", "popup-footer");

  if (!wrongs.length) {
    body.appendChild(el("div", "empty-note", "暂无错题 🎉"));
    const closeBtn = el("button", "btn", "关闭");
    closeBtn.addEventListener("click", () => ov.remove());
    footer.appendChild(closeBtn);
  } else {
    const tabRow = el("div", "record-tabs");
    const groups = [
      { id: "subject", label: "按科目" },
      { id: "chapter", label: "按章节" },
      { id: "count", label: "按错误次数" },
      { id: "recent", label: "最近 7 天" },
    ];
    let curGroup = "subject";
    const tabs = {};
    groups.forEach(g => {
      const b = el("button", "record-tab" + (g.id === curGroup ? " active" : ""), g.label);
      tabs[g.id] = b;
      b.addEventListener("click", () => {
        curGroup = g.id;
        Object.keys(tabs).forEach(k => tabs[k].classList.toggle("active", k === curGroup));
        renderGroup();
      });
      tabRow.appendChild(b);
    });
    body.appendChild(tabRow);
    const listBox = el("div", "drug-result-list");
    body.appendChild(listBox);

    function stemOf(q) {
      if (q.type === "B") return (q.subQuestions[0] && q.subQuestions[0].stem) || "B型题";
      if (q.type === "A3") return q.caseStem || "病例串题";
      return q.stem;
    }
    function addListItem(q) {
      const item = el("div", "drug-result-item");
      const stem = stemOf(q) || "";
      item.appendChild(el("span", "dt", stem.slice(0, 40) + (stem.length > 40 ? "…" : "")));
      item.appendChild(el("span", "ds", "错 " + (answerLog.data[q.id].wrongCount || 1) + " 次"));
      item.addEventListener("click", () => { ov.remove(); openQuiz([q]); });
      listBox.appendChild(item);
    }
    function renderGroup() {
      listBox.innerHTML = "";
      if (curGroup === "subject" || curGroup === "chapter") {
        const groupsMap = {};
        const keyFn = curGroup === "subject" ? (q => q.subject) : (q => q.chapter || "（未填章节）");
        wrongs.forEach(q => { const k = keyFn(q); if (!groupsMap[k]) groupsMap[k] = []; groupsMap[k].push(q); });
        Object.keys(groupsMap).sort().forEach(k => {
          listBox.appendChild(el("div", "gh-section-title", k + "（" + groupsMap[k].length + "）"));
          groupsMap[k].forEach(addListItem);
        });
      } else if (curGroup === "count") {
        wrongs.slice().sort((a, b) => (answerLog.data[b.id].wrongCount || 0) - (answerLog.data[a.id].wrongCount || 0)).forEach(addListItem);
      } else if (curGroup === "recent") {
        const cutoff = Date.now() - 7 * 86400000;
        const recent = wrongs.filter(q => answerLog.data[q.id].lastAt > cutoff);
        if (!recent.length) { listBox.appendChild(el("div", "empty-note", "最近 7 天没有错题")); return; }
        recent.forEach(addListItem);
      }
    }
    renderGroup();

    const clearBtn = el("button", "btn", "清空记录");
    const quizBtn = el("button", "btn", "重做全部");
    const closeBtn = el("button", "btn", "关闭");
    clearBtn.addEventListener("click", () => { answerLog.reset(); ov.remove(); confirmPopup("已清空所有答题记录"); });
    quizBtn.addEventListener("click", () => { ov.remove(); openQuiz(wrongs); });
    closeBtn.addEventListener("click", () => ov.remove());
    footer.appendChild(clearBtn); footer.appendChild(quizBtn); footer.appendChild(closeBtn);
  }
  pop.appendChild(footer);
  ov.appendChild(pop);
  document.body.appendChild(ov);
}

/* =========================================================
   统计 / 热力图
   ========================================================= */
function openHeatmap() {
  const s = answerLog.stats();
  const ov = el("div", "overlay");
  const pop = el("div", "popup popup-lg");
  pop.appendChild(el("div", "popup-title", "做题统计"));
  const body = el("div", "popup-body");

  const overview = el("div", "");
  overview.style.cssText = "display:flex;gap:8px;flex-wrap:wrap;font-size:.875em";
  const cards = [
    ["题库总数", s.all, ""],
    ["已作答", s.total, ""],
    ["未作答", s.unanswered, ""],
    ["答对", s.correct, "#4dcc66"],
    ["答错", s.wrong, "#d62828"],
    ["正确率", s.total > 0 ? Math.round(s.correct / s.total * 100) + "%" : "—", ""],
  ];
  cards.forEach(([k, v, c]) => {
    const card = el("div", "");
    card.style.cssText = "flex:1;min-width:90px;padding:8px 10px;border:1px solid var(--divider);border-radius:6px;background:var(--panel)";
    card.innerHTML = '<div style="font-size:.72em;color:var(--sub)">' + k + '</div><div style="font-size:1.3em;font-weight:700;' + (c ? "color:" + c : "") + '">' + v + '</div>';
    overview.appendChild(card);
  });
  body.appendChild(overview);

  const scroll = el("div", "detail-scroll");
  scroll.appendChild(el("div", "gh-section-title", "章节正确率"));
  const chapterStats = {};
  questionStore.data.forEach(q => {
    const k = q.subject + " · " + (q.chapter || "未填章节");
    if (!chapterStats[k]) chapterStats[k] = { total: 0, correct: 0 };
    const r = answerLog.data[q.id];
    if (r && r.attempts) { chapterStats[k].total++; if (r.correct) chapterStats[k].correct++; }
  });
  const entries = Object.entries(chapterStats).filter(([, v]) => v.total > 0).sort((a, b) => b[1].total - a[1].total);
  if (!entries.length) scroll.appendChild(el("div", "empty-note", "暂无数据"));
  else {
    entries.forEach(([k, v]) => {
      const pct = Math.round(v.correct / v.total * 100);
      const row = el("div", "heat-row");
      row.appendChild(el("div", "heat-label", k));
      const bar = el("div", "heat-bar");
      const fill = el("div", "heat-fill");
      fill.style.width = pct + "%";
      fill.style.background = pct >= 80 ? "#4dcc66" : pct >= 60 ? "#f2c433" : pct >= 40 ? "#ff9933" : "#d62828";
      bar.appendChild(fill);
      row.appendChild(bar);
      row.appendChild(el("div", "heat-pct", pct + "% (" + v.correct + "/" + v.total + ")"));
      scroll.appendChild(row);
    });
  }

  if (entries.length) {
    scroll.appendChild(el("div", "gh-section-title", "最薄弱章节（≥3 题）"));
    const weak = entries.filter(([, v]) => v.total >= 3).sort((a, b) => (a[1].correct / a[1].total) - (b[1].correct / b[1].total)).slice(0, 5);
    if (!weak.length) scroll.appendChild(el("div", "empty-note", "数据不足"));
    else weak.forEach(([k, v]) => {
      const pct = Math.round(v.correct / v.total * 100);
      const row = el("div", "heat-row");
      row.appendChild(el("div", "heat-label", k));
      row.appendChild(el("div", "heat-pct", pct + "% (" + v.correct + "/" + v.total + ")"));
      scroll.appendChild(row);
    });
  }

  body.appendChild(scroll);
  pop.appendChild(body);
  const footer = el("div", "popup-footer");
  const resetBtn = el("button", "btn", "重置统计");
  const closeBtn = el("button", "btn", "关闭");
  resetBtn.addEventListener("click", () => { confirmPopup("确定重置所有答题记录？", () => { answerLog.reset(); ov.remove(); }); });
  closeBtn.addEventListener("click", () => ov.remove());
  footer.appendChild(resetBtn); footer.appendChild(closeBtn);
  pop.appendChild(footer);
  ov.appendChild(pop);
  document.body.appendChild(ov);
}

/* =========================================================
   刷题模式列表
   ========================================================= */
function makeQuestionCard(q) {
  const card = el("div", "item-card");
  card.style.background = SUBJECT_COLORS[q.subject] || "#595959";
  const r = answerLog.data[q.id];
  const bar = el("div", "status-bar");
  bar.style.background = !r ? "#999" : r.correct ? "#4dcc66" : "#ff9933";
  card.appendChild(bar);
  const main = el("div", "item-main");
  main.tabIndex = 0;
  main.setAttribute("role", "button");
  main.addEventListener("click", () => openQuiz([q]));
  main.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); openQuiz([q]); } });
  const stem = q.type === "B" ? (q.subQuestions[0] && q.subQuestions[0].stem) || "B型题" : q.type === "A3" ? q.caseStem || "病例串题" : q.stem;
  const titleSpan = el("span", "item-title", (q.starred ? "★ " : "") + (stem || "").slice(0, 30) + ((stem && stem.length > 30) ? "…" : "") + "  |  " + (QUIZ_TYPES[q.type] || q.type));
  main.appendChild(titleSpan);
  if (r) {
    const badge = el("span", "item-status", r.correct ? "✓" : "✗");
    badge.style.background = r.correct ? "rgba(77,204,102,.6)" : "rgba(214,40,40,.6)";
    main.appendChild(badge);
  }
  const starBtn = el("button", "item-star" + (q.starred ? " on" : ""), q.starred ? "★" : "☆");
  starBtn.addEventListener("click", e => { e.stopPropagation(); q.starred = !q.starred; questionStore.save(); renderQuizListOnly(); });
  main.appendChild(starBtn);
  card.appendChild(main);
  return card;
}
function getFilteredQuestions() {
  let data = questionStore.data.slice();
  if (state.qSubject !== "全部") data = data.filter(q => q.subject === state.qSubject);
  if (state.qType !== "全部") data = data.filter(q => q.type === state.qType);
  if (state.qSearch) {
    const s = state.qSearch.toLowerCase();
    data = data.filter(q => {
      const text = [q.stem, q.caseStem, q.explanation, (q.options || []).map(o => o.text).join(" "), (q.sharedOptions || []).map(o => o.text).join(" "), (q.subQuestions || []).map(sq => sq.stem).join(" ")].join(" ").toLowerCase();
      return text.indexOf(s) !== -1;
    });
  }
  return data;
}
function renderQuizListOnly() {
  const scroller = document.getElementById("listScroll");
  const list = document.getElementById("listLayout");
  const prevTop = scroller.scrollTop;
  list.innerHTML = "";
  if (!questionStore.data.length) list.appendChild(el("div", "empty-hint", EMPTY_QUIZ_HINT));
  else {
    const filtered = getFilteredQuestions();
    if (!filtered.length) list.appendChild(el("div", "empty-hint", "没有匹配的题目"));
    else for (const q of filtered) list.appendChild(makeQuestionCard(q));
  }
  const s = answerLog.stats();
  document.getElementById("statLabel").textContent = "题库 " + s.all + " · 已做 " + s.total + " · 正确率 " + (s.total > 0 ? Math.round(s.correct / s.total * 100) + "%" : "—");
  scroller.scrollTop = prevTop;
}

/* =========================================================
   模式切换
   ========================================================= */
function setMode(mode) {
  state.mode = mode;
  saveSettings();

function scopeBySubject() {

function updateSelectOptions(sel, values) {
  const cur = Array.from(sel.options).map(o => o.value).join("\u0001");

  if (cur !== nxt) {

  }
}
function rebuildSystemValues() {

  const names = Object.keys(counts).sort();

  for (const n of names) values.push({ value: n, label: withCount(n, counts[n]) });

  if (state.system !== "全部" && names.indexOf(state.system) === -1) { state.system = "全部"; saveSettings(); }

}
function rebuildChapterValues() {
  let base = scopeBySubject();
  if (state.system !== "全部") base = base.filter(d => detectSystem(d) === state.system);
  const counts = {};
  for (const d of base) { const k = String(d.chapter || "").trim() || "（未填章节）"; counts[k] = (counts[k] || 0) + 1; }
  const names = Object.keys(counts).sort();
  const values = [{ value: "全部", label: "全部" }];
  for (const n of names) values.push({ value: n, label: withCount(n, counts[n]) });
  const sel = document.getElementById("chapterSel");
  updateSelectOptions(sel, values);
  if (state.chapter !== "全部" && names.indexOf(state.chapter) === -1) { state.chapter = "全部"; saveSettings(); }
  sel.value = state.chapter;
}
function rebuildTagValues() {
  const s = {};
  for (const d of store.data) for (const t of (d.tags || [])) s[t] = true;
  const names = Object.keys(s).sort();
  const values = [{ value: "全部", label: "全部" }];
  for (const n of names) values.push({ value: n, label: n });
  const sel = document.getElementById("tagSel");
  updateSelectOptions(sel, values);
  if (state.tag !== "全部" && names.indexOf(state.tag) === -1) { state.tag = "全部"; saveSettings(); }
  sel.value = state.tag;
}
function rebuildQSubjectValues() {
  const sel = document.getElementById("qSubjectSel");
  if (!sel) return;
  const values = [{ value: "全部", label: "全部科目" }];
  const seen = {};
  for (const q of questionStore.data) seen[q.subject] = true;
  for (const sj of SUBJECTS) if (seen[sj]) values.push({ value: sj, label: sj });
  updateSelectOptions(sel, values);
  if (state.qSubject !== "全部" && !seen[state.qSubject]) { state.qSubject = "全部"; saveSettings(); }
  sel.value = state.qSubject;
}
function compareId(a, b) { return String(a == null ? "" : a).localeCompare(String(b == null ? "" : b), "en", { numeric: true, sensitivity: "base" }); }
function parseSearchQuery(raw) {
  const out = { keywords: [], subject: null, system: null, chapter: null, status: null, tag: null, frequency: null, starred: null };
  const tokens = String(raw || "").trim().split(/\s+/).filter(Boolean);
  const keyMap = { "科目": "subject", "subject": "subject", "系统": "system", "system": "system", "章节": "chapter", "chapter": "chapter", "状态": "status", "status": "status", "标签": "tag", "tag": "tag", "频率": "frequency", "frequency": "frequency", "收藏": "starred", "starred": "starred" };
  for (const t of tokens) {
    let idx = t.indexOf(":"); if (idx === -1) idx = t.indexOf("：");
    if (idx === -1) { out.keywords.push(t); continue; }
    const k = t.slice(0, idx).trim(), v = t.slice(idx + 1).trim();
    if (keyMap[k] && v) out[keyMap[k]] = v; else out.keywords.push(t);
  }
  return out;
}
function getFiltered() {
  let data = store.data.slice();
  if (state.subject !== "全部") data = data.filter(d => d.subject === state.subject);
  if (state.system !== "全部") data = data.filter(d => detectSystem(d) === state.system);
  if (state.chapter !== "全部") {
    if (state.chapter === "（未填章节）") data = data.filter(d => !String(d.chapter || "").trim());
    else data = data.filter(d => d.chapter === state.chapter);
  }
  if (state.status !== "全部") data = data.filter(d => d.status === state.status);
  if (state.tag !== "全部") data = data.filter(d => (d.tags || []).indexOf(state.tag) !== -1);
  if (state.starredOnly) data = data.filter(d => d.starred);
  if (state.search) {
    const q = parseSearchQuery(state.search);
    if (q.subject) data = data.filter(d => String(d.subject || "").indexOf(q.subject) !== -1);
    if (q.system) data = data.filter(d => detectSystem(d).indexOf(q.system) !== -1);
    if (q.chapter) data = data.filter(d => String(d.chapter || "").indexOf(q.chapter) !== -1);
    if (q.status) data = data.filter(d => String(d.status || "") === q.status);
    if (q.tag) data = data.filter(d => (d.tags || []).indexOf(q.tag) !== -1);
    if (q.frequency) {
      const t = (String(q.frequency).match(/★/g) || []).length || parseInt(q.frequency, 10) || 0;
      if (t > 0) data = data.filter(d => starCount(d) === t);
    }
    if (q.starred) {
      const y = ["是", "1", "true", "yes", "y"].indexOf(String(q.starred).toLowerCase()) !== -1;
      data = data.filter(d => !!d.starred === y);
    }
    if (q.keywords.length) {
      const kws = q.keywords.map(k => String(k).toLowerCase());
      data = data.filter(d => {
        const s = getSearchText(d);
        for (let i = 0; i < kws.length; i++) if (s.indexOf(kws[i]) === -1) return false;
        return true;
      });
    }
  }
  if (state.sort === "频率高→低") data.sort((a, b) => starCount(b) - starCount(a));
  else if (state.sort === "频率低→高") data.sort((a, b) => starCount(a) - starCount(b));
  else if (state.sort === "标题") data.sort((a, b) => String(a.title || "").localeCompare(String(b.title || ""), "zh"));
  else if (state.sort === "ID升序") data.sort((a, b) => compareId(a.id, b.id));
  else if (state.sort === "ID降序") data.sort((a, b) => compareId(b.id, a.id));
  return data;
}
function makeItemCard(item) {
  const card = el("div", "item-card");
  card.style.background = SUBJECT_COLORS[item.subject] || "#595959";
  const bar = el("div", "status-bar");
  bar.style.background = STATUS_COLORS[item.status] || "#999999";
  card.appendChild(bar);
  const main = el("div", "item-main");
  main.tabIndex = 0;
  main.setAttribute("role", "button");
  main.setAttribute("aria-label", item.title || "病例");
  main.addEventListener("click", () => showDetail(item));
  main.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); showDetail(item); }
  });
  main.appendChild(el("span", "item-title", (item.starred ? "★ " : "") + item.title + "  |  " + (item.subject || "")));
  const statusBtn = el("button", "item-status", item.status || "未看");
  statusBtn.addEventListener("click", (e) => { e.stopPropagation(); cycleItemStatus(item); });
  main.appendChild(statusBtn);
  const starBtn = el("button", "item-star" + (item.starred ? " on" : ""), item.starred ? "★" : "☆");
  starBtn.addEventListener("click", (e) => { e.stopPropagation(); toggleItemStar(item); });
  main.appendChild(starBtn);
  card.appendChild(main);
  return card;
}
function cycleItemStatus(item) {
  const cur = STATUS_OPTIONS.indexOf(item.status || "未看");
  const next = STATUS_OPTIONS[(cur + 1) % STATUS_OPTIONS.length];
  updateItemById(item.id, { status: next });
}
function toggleItemStar(item) { updateItemById(item.id, { starred: !item.starred }); }
function updateItemById(id, changes) {
  for (let i = 0; i < store.data.length; i++) {
    if (store.data[i].id === id) {
      store.data[i] = Object.assign({}, store.data[i], changes);
      store.save(); render(); return true;
    }
  }
  return false;
}
function renderList() {
  const scroller = document.getElementById("listScroll");
  const list = document.getElementById("listLayout");
  const prevTop = scroller.scrollTop;
  list.innerHTML = "";
  const filtered = getFiltered();
  if (!filtered.length) list.appendChild(el("div", "empty-hint", store.data.length ? "没有匹配的条目" : EMPTY_HINT));

  document.getElementById("statLabel").textContent = "显示 " + filtered.length + " / 共 " + total + " 条  ·  收藏 " + starred;
  scroller.scrollTop = prevTop;
  updateBackToTop();
}
function render() { rebuildSystemValues(); rebuildChapterValues(); rebuildTagValues(); renderList(); }

function saveScroll() {

  const pop = el("div", "popup popup-sm");
  pop.appendChild(el("div", "popup-title", title));
  const body = el("div", "popup-body");
  body.appendChild(el("div", "confirm-msg", text));
  pop.appendChild(body);
  const footer = el("div", "popup-footer");
  if (typeof onYes === "function") {
    const no = el("button", "btn", "取消");
    const yes = el("button", "btn", yesText);
    no.addEventListener("click", () => ov.remove());
    yes.addEventListener("click", () => { ov.remove(); onYes(); });
    footer.appendChild(no); footer.appendChild(yes);
  } else {
    const ok = el("button", "btn", "知道了");
    ok.addEventListener("click", () => ov.remove());
    footer.appendChild(ok);
  }
  pop.appendChild(footer);
  ov.appendChild(pop);
  document.body.appendChild(ov);
  return ov;
}

/* Esc 关闭最上层弹窗 */
document.addEventListener("keydown", function (e) {
  if (e.key !== "Escape") return;
  const all = document.querySelectorAll(".overlay");
  if (!all.length) return;
  e.preventDefault();
  all[all.length - 1].remove();
});

/* =========================================================
   事件绑定
   ========================================================= */
function bindEvents() {
  document.getElementById("modeCasesBtn").addEventListener("click", () => setMode("cases"));
  document.getElementById("modeQuizBtn").addEventListener("click", () => setMode("quiz"));

  document.getElementById("subjectSel").addEventListener("change", function (e) {
    state.subject = e.target.value; state.system = "全部"; state.chapter = "全部";
    saveSettings(); render();
  });
  document.getElementById("systemSel").addEventListener("change", function (e) {
    state.system = e.target.value; state.chapter = "全部"; saveSettings(); render();
  });
  document.getElementById("chapterSel").addEventListener("change", function (e) {
    state.chapter = e.target.value; saveSettings(); render();
  });
  document.getElementById("statusSel").addEventListener("change", function (e) {
    state.status = e.target.value; saveSettings(); render();
  });
  document.getElementById("tagSel").addEventListener("change", function (e) {
    state.tag = e.target.value; saveSettings(); render();
  });
  document.getElementById("sortSel").addEventListener("change", function (e) {
    state.sort = e.target.value; saveSettings(); render();
  });

  let __st = null;
  document.getElementById("searchInput").addEventListener("input", function (e) {
    const v = e.target.value.trim();
    if (__st) clearTimeout(__st);
    __st = setTimeout(() => { state.search = v; render(); }, 180);
  });

  document.getElementById("addBtn").addEventListener("click", function () { openEdit(null); });
  document.getElementById("randomBtn").addEventListener("click", randomPick);
  document.getElementById("recordBtn").addEventListener("click", openBigRecord);
  document.getElementById("starBtn").addEventListener("click", function () {
    state.starredOnly = !state.starredOnly; saveSettings();
    this.textContent = state.starredOnly ? "★ 收藏" : "☆ 收藏";
    render();
  });
  document.getElementById("importBtn").addEventListener("click", openImport);
  document.getElementById("exportBtn").addEventListener("click", openExport);
  document.getElementById("pdfBtn").addEventListener("click", openPdfExport);
  document.getElementById("uploadBtn").addEventListener("click", () => openUpload("cases"));
  document.getElementById("clearBtn").addEventListener("click", confirmClear);
  document.getElementById("settingsBtn").addEventListener("click", openSettings);

  document.getElementById("qSubjectSel").addEventListener("change", function (e) {
    state.qSubject = e.target.value; saveSettings(); renderQuizListOnly();
  });
  document.getElementById("qTypeSel").addEventListener("change", function (e) {
    state.qType = e.target.value; saveSettings(); renderQuizListOnly();
  });
  let __qt = null;
  document.getElementById("qSearchInput").addEventListener("input", function (e) {
    const v = e.target.value.trim();
    if (__qt) clearTimeout(__qt);
    __qt = setTimeout(() => { state.qSearch = v; renderQuizListOnly(); }, 180);
  });
  document.getElementById("startQuizBtn").addEventListener("click", openQuizPicker);
  document.getElementById("continueQuizBtn").addEventListener("click", function () {
    const saved = quizProgress.load();
    if (!saved) { confirmPopup("没有上次的进度"); return; }
    const idSet = {}; questionStore.data.forEach(q => idSet[q.id] = q);
    const pool = saved.poolIds.map(id => idSet[id]).filter(Boolean);
    if (!pool.length) { confirmPopup("进度已失效"); return; }
    openQuiz(pool, { mode: saved.mode, scope: saved.scope, startIdx: saved.idx, userAnswers: saved.userAnswers });
  });
  document.getElementById("wrongBookBtn").addEventListener("click", openWrongBook);
  document.getElementById("heatmapBtn").addEventListener("click", openHeatmap);
  document.getElementById("qImportBtn").addEventListener("click", openQuestionImport);
  document.getElementById("qAiBtn").addEventListener("click", () => openAiImport("questions"));
  document.getElementById("qUploadBtn").addEventListener("click", () => openUpload("questions"));
  document.getElementById("qExportBtn").addEventListener("click", openQuestionExport);
  document.getElementById("qClearBtn").addEventListener("click", confirmClearQ);
  document.getElementById("settingsBtn2").addEventListener("click", openSettings);

  let scrollTimer = null;
  document.getElementById("listScroll").addEventListener("scroll", function () {
    updateBackToTop();
    if (scrollTimer) clearTimeout(scrollTimer);
    scrollTimer = setTimeout(saveScroll, 350);
  }, { passive: true });
  window.addEventListener("beforeunload", saveScroll);
  window.addEventListener("pagehide", saveScroll);

  document.getElementById("backToTop").addEventListener("click", function () {
    const s = document.getElementById("listScroll");
    try { s.scrollTo({ top: 0, behavior: "smooth" }); }
    catch (e) { s.scrollTop = 0; }
  });
}

/* =========================================================
   初始化
   ========================================================= */
async function init() {
  loadSettings();
  applyTheme();
  answerLog.load();
  try {
    await Promise.race([
      Promise.all([store.load(), questionStore.load()]),
      new Promise((_, reject) => setTimeout(() => reject(new Error("数据加载超时")), 5000))
    ]);
  } catch (e) { if (!Array.isArray(store.data)) store.data = []; if (!Array.isArray(questionStore.data)) questionStore.data = []; }
  bindEvents();
  document.getElementById("starBtn").textContent = state.starredOnly ? "★ 收藏" : "☆ 收藏";
  document.getElementById("sortSel").value = state.sort;
  document.getElementById("statusSel").value = state.status;
  document.getElementById("subjectSel").value = state.subject;
  rebuildQSubjectValues();
  document.getElementById("qTypeSel").value = state.qType;
  document.getElementById("qSubjectSel").value = state.qSubject;
  setMode(state.mode || "cases");
  requestAnimationFrame(() => { restoreScroll(); setTimeout(restoreScroll, 120); });
}

if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register("sw.js").catch(function () {});
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
else init();
</script>
