function makeFieldRow(name, content, keyword, rawHtml) {
  const row = el("div", "field-row");
  const header = el("div", "field-header");
  const toggle = el("button", "field-toggle", "显示");
  const labelEl = el("div", "field-label", name);
  header.appendChild(toggle); header.appendChild(labelEl);
  row.appendChild(header);
  const bodyEl = el("div", "field-content");
  if (rawHtml) bodyEl.innerHTML = rawHtml;
  else bodyEl.innerHTML = renderRich(content, keyword);
  bodyEl.style.display = "none";
  row.appendChild(bodyEl);

  bodyEl.addEventListener("click", (e) => {
    const img = e.target.closest(".rich-img");
    if (img) { e.stopPropagation(); openImgPreview(img.src, img.alt); return; }
    const drug = e.target.closest(".rich-drug");
    if (drug) { e.stopPropagation(); openDrugPanel(drug.getAttribute("data-drug"), ov); return; }
    const link = e.target.closest(".rich-link");
    if (!link) return;
    e.stopPropagation();
    const targetName = link.getAttribute("data-target");
    const targetItem = store.data.find(d => d.title === targetName);
    if (targetItem) { ov.remove(); showDetail(targetItem); }
    else confirmPopup("未找到病例：「" + targetName + "」");
  });

  let visible = false;
  function apply(v) {
    visible = !!v;
    toggle.textContent = visible ? "隐藏" : "显示";
    bodyEl.style.display = visible ? "block" : "none";
  }
  toggle.addEventListener("click", () => apply(!visible));
  row._setVisible = apply;
  return row;
}

function itemToPlainText(item) {
  const lines = [item.title || ""];
  let meta = "科目：" + (item.subject || "");
  if (item.chapter) meta += "  章节：" + item.chapter;
  meta += "  系统：" + detectSystem(item);
  if (item.frequency) meta += "  " + item.frequency;
  lines.push(meta);
  lines.push("ID：" + (item.id || "") + "  状态：" + (item.status || "未看") + "  收藏：" + (item.starred ? "是" : "否"));
  if (item.tags && item.tags.length) lines.push("标签：" + item.tags.join("、"));
  lines.push("");
  const fields = getFieldsForSubject(item.subject);
  for (let i = 0; i < fields.length; i++) {
    const key = fields[i][0], name = fields[i][1];
    const val = String(item[key] == null ? "" : item[key]).trim();
    if (val) { lines.push("【" + name + "】"); lines.push(val); lines.push(""); }
  }
  const tl = collectTimelineEntries(item);
  if (tl.length) {
    lines.push("【病程时间轴】");
    for (let i = 0; i < tl.length; i++) {
      lines.push("  " + tl[i].node + "（" + tl[i].field + "）：" + tl[i].text);
    }
    lines.push("");
  }
  return lines.join("\n");
}

function collectTimelineEntries(item) {
  const entries = [];
  for (let i = 0; i < ALL_FIELDS.length; i++) {
    const key = ALL_FIELDS[i];
    const val = String(item[key] == null ? "" : item[key]).trim();
    if (!val || val.indexOf("@") === -1) continue;
    const label = FIELD_LABELS[key] || key;
    const lines = val.split("\n");
    for (let j = 0; j < lines.length; j++) {
      const m = lines[j].match(/^@([^|]+)\|\s*(.*)$/);
      if (m) entries.push({ field: label, node: m[1].trim(), text: m[2] });
    }
  }
  return entries;
}

function buildMergedTimelineSection(entries, overlayRef) {
  const section = el("div", "merged-timeline-section");

  const title = el("div", "merged-timeline-title");
  title.appendChild(el("span", "", "⏱ 病程时间轴"));
  title.appendChild(el("span", "merged-timeline-count", "共 " + entries.length + " 个节点"));
  section.appendChild(title);

  const tl = el("div", "merged-timeline");
  entries.forEach((entry) => {
    const item = el("div", "mt-item");
    const header = el("div", "mt-header");
    header.appendChild(el("span", "mt-node", entry.node));
    header.appendChild(el("span", "mt-field-label", entry.field));
    item.appendChild(header);

    const txt = el("div", "mt-text");
    txt.innerHTML = applyInline(escapeHtml(entry.text), state.search);
    txt.addEventListener("click", (e) => {
      const img = e.target.closest(".rich-img");
      if (img) { e.stopPropagation(); openImgPreview(img.src, img.alt); return; }
      const drug = e.target.closest(".rich-drug");
      if (drug) { e.stopPropagation(); openDrugPanel(drug.getAttribute("data-drug"), overlayRef); return; }
      const link = e.target.closest(".rich-link");
      if (!link) return;
      e.stopPropagation();
      const targetName = link.getAttribute("data-target");
      const targetItem = store.data.find(d => d.title === targetName);
      if (targetItem) { if (overlayRef) overlayRef.remove(); showDetail(targetItem); }
      else confirmPopup("未找到病例：「" + targetName + "」");
    });
    item.appendChild(txt);
    tl.appendChild(item);
  });
  section.appendChild(tl);
  return section;
}

function showDetail(item) {
  const ov = el("div", "overlay");
  const pop = el("div", "popup popup-lg");
  pop.appendChild(el("div", "popup-title", item.title || "病例详情"));
  const body = el("div", "popup-body");

  const metaLines = ["科目：" + (item.subject || "")];
  if (item.chapter) metaLines.push("章节：" + item.chapter);
  metaLines.push("系统：" + detectSystem(item));
  if (item.frequency) metaLines.push(item.frequency);
  metaLines.push("ID：" + (item.id || ""));

  const meta = el("div", "detail-meta");
  meta.appendChild(document.createTextNode(metaLines.join("  |  ") + "  "));
  const statusVal = item.status || "未看";
  meta.appendChild(el("span", "status-badge status-" + statusVal, statusVal));
  meta.appendChild(document.createTextNode("  "));
  meta.appendChild(el("span", "star-badge" + (item.starred ? "" : " off"), item.starred ? "★ 已收藏" : "☆ 未收藏"));
  body.appendChild(meta);

  const ctrl = el("div", "detail-ctrl");
  const showAll = el("button", "btn", "全部展开");
  const hideAll = el("button", "btn", "全部收起");
  ctrl.appendChild(showAll); ctrl.appendChild(hideAll);
  body.appendChild(ctrl);

  const scroll = el("div", "detail-scroll");
  const rows = [];

  const statusHtml = '<span class="status-badge status-' + statusVal + '">' + statusVal + "</span>";
  const starHtml = item.starred ? '<span class="star-badge">★ 已收藏</span>' : '<span class="star-badge off">☆ 未收藏</span>';
  const statusRow = makeFieldRow("复习状态", "", "", statusHtml);
  const starRow = makeFieldRow("收藏", "", "", starHtml);
  rows.push(statusRow, starRow);
  scroll.appendChild(statusRow); scroll.appendChild(starRow);

  const fields = getFieldsForSubject(item.subject);
  const thisKeys = {};
  let hasContent = false;
  for (let i = 0; i < fields.length; i++) {
    const key = fields[i][0], name = fields[i][1];
    thisKeys[key] = true;
    const val = String(item[key] == null ? "" : item[key]).trim();
    if (!val) continue;
    hasContent = true;
    const row = makeFieldRow(name, val, state.search, null);
    rows.push(row);
    scroll.appendChild(row);
  }
  if (!hasContent) scroll.appendChild(el("div", "empty-note", "该条目尚未填写具体内容"));

  const others = [];
  for (let i = 0; i < ALL_FIELDS.length; i++) {
    const key = ALL_FIELDS[i];
    if (thisKeys[key]) continue;
    const val = String(item[key] == null ? "" : item[key]).trim();
    if (val) others.push([key, val]);
  }
  if (others.length) {
    const otherHeader = el("div", "field-other-header",
      "其他信息（来自其他科目模板，共 " + others.length + " 项）");
    scroll.appendChild(otherHeader);
    for (let i = 0; i < others.length; i++) {
      const key = others[i][0], val = others[i][1];
      const name = FIELD_LABELS[key] || key;
      const row = makeFieldRow(name, val, state.search, null);
      rows.push(row);
      scroll.appendChild(row);
    }
  }

  const timelineEntries = collectTimelineEntries(item);
  if (timelineEntries.length) {
    scroll.appendChild(buildMergedTimelineSection(timelineEntries, ov));
  }

  showAll.addEventListener("click", () => rows.forEach(r => r._setVisible(true)));
  hideAll.addEventListener("click", () => rows.forEach(r => r._setVisible(false)));
  body.appendChild(scroll);
  pop.appendChild(body);

  const navList = getFiltered();
  let curIdx = navList.findIndex(d => d.id === item.id);
  const navRow = el("div", "popup-footer");
  navRow.style.borderTop = "1px solid var(--divider)";
  const prevBtn = el("button", "btn", "← 上一题");
  const nextBtn = el("button", "btn", "下一题 →");
  prevBtn.disabled = curIdx <= 0;
  nextBtn.disabled = curIdx === -1 || curIdx >= navList.length - 1;
  prevBtn.addEventListener("click", () => { if (curIdx > 0) { ov.remove(); showDetail(navList[curIdx - 1]); } });
  nextBtn.addEventListener("click", () => { if (curIdx >= 0 && curIdx < navList.length - 1) { ov.remove(); showDetail(navList[curIdx + 1]); } });
  navRow.appendChild(prevBtn);
  const posLabel = el("div", "row-label", curIdx >= 0 ? (curIdx + 1) + " / " + navList.length : "— / —");
  posLabel.style.flex = "0 0 auto";
  posLabel.style.width = "auto";
  posLabel.style.padding = "0 8px";
  posLabel.style.textAlign = "center";
  navRow.appendChild(posLabel);
  navRow.appendChild(nextBtn);
  pop.appendChild(navRow);

  const footer = el("div", "popup-footer");
  const closeBtn = el("button", "btn", "关闭");
  const copyBtn = el("button", "btn", "复制");
  const editBtn = el("button", "btn", "编辑");
  const delBtn = el("button", "btn", "删除");
  closeBtn.addEventListener("click", () => ov.remove());
  copyBtn.addEventListener("click", () => {
    copyText(itemToPlainText(item))
      .then(() => confirmPopup("已复制本条到剪贴板"))
      .catch(err => confirmPopup("复制失败：" + err.message));
  });
  editBtn.addEventListener("click", () => { ov.remove(); openEdit(item); });
  delBtn.addEventListener("click", () => { ov.remove(); confirmDelete(item); });
  footer.appendChild(closeBtn); footer.appendChild(copyBtn); footer.appendChild(editBtn); footer.appendChild(delBtn);
  pop.appendChild(footer);
  ov.appendChild(pop);
  document.body.appendChild(ov);
}

/* ===== 编辑 ===== */
function openEdit(item) {
  const isNew = !item;
  const src = item ? JSON.parse(JSON.stringify(item)) : {};
  const originalId = src.id || null;

  const draftValues = {};
  for (let i = 0; i < ALL_FIELDS.length; i++) {
    const key = ALL_FIELDS[i];
    draftValues[key] = String(src[key] || "");
  }

  const ov = el("div", "overlay");
  const pop = el("div", "popup popup-lg");
  pop.appendChild(el("div", "popup-title", isNew ? "新增病例" : "编辑病例"));
  const body = el("div", "popup-body");
  const form = el("div", "edit-form");

  function addLabel(text) { form.appendChild(el("div", "edit-label", text)); }
  function addText(value, placeholder) {
    const inp = document.createElement("input");
    inp.className = "edit-input"; inp.type = "text"; inp.value = value || "";
    if (placeholder) inp.placeholder = placeholder;
    form.appendChild(inp);
    return inp;
  }
  function addSelect(values, current, labeler) {
    const sel = document.createElement("select");
    sel.className = "edit-select";
    for (let i = 0; i < values.length; i++) {
      const v = values[i];
      const o = document.createElement("option");
      o.value = v; o.textContent = labeler ? labeler(v) : v;
      sel.appendChild(o);
    }
    sel.value = current;
    form.appendChild(sel);
    return sel;
  }

  addLabel("标题 *");
  const titleInput = addText(src.title || "");
  addLabel("ID（唯一标识；留空自动生成）");
  const idInput = addText(src.id || "", "留空自动生成");

  addLabel("科目（决定下方字段模板）");
  const subjValues = SUBJECTS.slice();
  const curSubj = src.subject || SUBJECTS[0];
  if (subjValues.indexOf(curSubj) === -1) subjValues.push(curSubj);
  const subjectSel = addSelect(subjValues, curSubj);

  addLabel("章节（用于系统自动归类）");
  const chapterInput = addText(src.chapter || "");
  addLabel("出现频率");
  const freqValues = FREQ_OPTIONS.slice();
  const curFreq = src.frequency || "";
  if (curFreq && freqValues.indexOf(curFreq) === -1) freqValues.push(curFreq);
  const freqSel = addSelect(freqValues, curFreq, v => (v === "" ? "（未设置）" : v));
  addLabel("复习状态");
  const statusSel = addSelect(STATUS_OPTIONS, src.status || "未看");
  addLabel("标签（逗号分隔）");
  const tagsInput = addText((src.tags || []).join("，"));
  addLabel("收藏（1=收藏，0=不收藏）");
  const starredInput = addText(src.starred ? "1" : "0");

  const fieldsTitle = el("div", "edit-label", "内容字段（按科目自动切换）");
  form.appendChild(fieldsTitle);

  const fieldsContainer = el("div", "");
  fieldsContainer.style.display = "flex";
  fieldsContainer.style.flexDirection = "column";
  fieldsContainer.style.gap = "5px";
  form.appendChild(fieldsContainer);

  let fieldInputs = {};

  function syncCurrentToDraft() {
    for (const k in fieldInputs) draftValues[k] = fieldInputs[k].value;
  }

  function buildFields(subject) {
    syncCurrentToDraft();
    fieldsContainer.innerHTML = "";
    fieldInputs = {};
    const fields = getFieldsForSubject(subject);
    const hint = el("div", "subject-hint",
      "当前科目：" + subject + "，共 " + fields.length + " 个字段。" +
      (subject === "内科学" || subject === "外科学" ? "（含分类 / 分型 / 分期）" : "（切换科目不会丢失其他科字段已填内容）"));
    fieldsContainer.appendChild(hint);
    for (let i = 0; i < fields.length; i++) {
      const key = fields[i][0], name = fields[i][1];
      const label = el("div", "edit-label", name);
      fieldsContainer.appendChild(label);

      const ta = document.createElement("textarea");
      ta.className = "edit-textarea";
      ta.value = draftValues[key] || "";
      fieldsContainer.appendChild(makeRichToolbar(ta));
      attachPasteImage(ta);
      attachDropImage(ta);
      fieldsContainer.appendChild(ta);
      fieldInputs[key] = ta;
    }
  }

  subjectSel.addEventListener("change", () => {
    buildFields(subjectSel.value);
  });

  buildFields(curSubj);

  body.appendChild(form);
  pop.appendChild(body);

  const footer = el("div", "popup-footer");
  const cancelBtn = el("button", "btn", "取消");
  const saveBtn = el("button", "btn", "保存");
  cancelBtn.addEventListener("click", () => ov.remove());
  saveBtn.addEventListener("click", () => {
    const title = titleInput.value.trim();
    if (!title) { confirmPopup("标题不能为空"); return; }
    let newId = idInput.value.trim();
    if (!newId) newId = originalId || genId();
    if (newId !== originalId) {
      for (let i = 0; i < store.data.length; i++) {
        if (store.data[i].id === newId) { confirmPopup("ID「" + newId + "」已被占用，请换一个"); return; }
      }
    }
    syncCurrentToDraft();
    const starredText = starredInput.value.trim();
    const data = {
      id: newId, title: title,
      subject: subjectSel.value.trim() || SUBJECTS[0],
      chapter: chapterInput.value.trim(),
      frequency: freqSel.value, status: statusSel.value,
      starred: ["1", "true", "True", "是", "y", "Y"].indexOf(starredText) !== -1,
      tags: tagsInput.value.split(/[,，;；]/).map(t => t.trim()).filter(Boolean),
    };
    for (let i = 0; i < ALL_FIELDS.length; i++) {
      const key = ALL_FIELDS[i];
      data[key] = String(draftValues[key] || "").trim();
    }
    saveItem(data, originalId);
    ov.remove();
  });
  footer.appendChild(cancelBtn); footer.appendChild(saveBtn);
  pop.appendChild(footer);
  ov.appendChild(pop);
  document.body.appendChild(ov);
  setTimeout(() => titleInput.focus(), 60);
}

  row.appendChild(el("div", "row-label", "统一指定科目"));
  const overrideSel = document.createElement("select");
  overrideSel.className = "edit-select";
  ["保持原值"].concat(SUBJECTS).forEach(v => {
    const o = document.createElement("option"); o.value = v; o.textContent = v; overrideSel.appendChild(o);
  });
  row.appendChild(overrideSel);
  body.appendChild(row);
  pop.appendChild(body);

  const footer = el("div", "popup-footer");
  const cancelBtn = el("button", "btn", "取消");
  const aiBtn = el("button", "btn", "🤖 AI 生成");
  const appendBtn = el("button", "btn", "追加");
  const replaceBtn = el("button", "btn", "替换全部");
  cancelBtn.addEventListener("click", () => ov.remove());
  aiBtn.addEventListener("click", () => { ov.remove(); openAiImport(); });
  function doImport(mode) {
    const text = ta.value.trim();
    if (!text) { confirmPopup("请先粘贴 JSON 内容"); return; }
    const override = overrideSel.value === "保持原值" ? null : overrideSel.value;
    const result = store.importFromText(text, mode, override);
    if (!result.ok) { confirmPopup(result.msg); return; }
    ov.remove(); render();
    if (result.warnings.length) {
      const shown = result.warnings.slice(0, 8).join("\n");
      const extra = result.warnings.length > 8 ? "\n…… 共 " + result.warnings.length + " 条提示" : "";
      confirmPopup(result.msg + "\n\n注意：\n" + shown + extra);
    } else confirmPopup(result.msg);
  }
  appendBtn.addEventListener("click", () => doImport("append"));
  replaceBtn.addEventListener("click", () => doImport("replace"));
  footer.appendChild(cancelBtn); footer.appendChild(aiBtn);
  footer.appendChild(appendBtn); footer.appendChild(replaceBtn);
  pop.appendChild(footer);
  ov.appendChild(pop);
  document.body.appendChild(ov);
  setTimeout(() => ta.focus(), 60);
}

      link.href = p.key_url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      infoCard.appendChild(link);
    }
  }

  /* ===== ② 参数配置 ===== */
  form.appendChild(el("div", "gh-section-title", "② 参数配置"));

  function mkInput(label, value, type, ph) {
    form.appendChild(el("div", "edit-label", label));
    const i = document.createElement("input");
    i.className = "edit-input"; i.type = type || "text"; i.value = value || "";
    if (ph) i.placeholder = ph;
    i.spellcheck = false; i.autocomplete = "off";
    form.appendChild(i);
    return i;
  }

  const baseIn  = mkInput("Base URL", cfg.base_url, "text", "https://.../v1");

  const modelRow = el("div", "import-row");
  modelRow.appendChild(el("div", "row-label", "模型名"));
  const modelSel = document.createElement("select");
  modelSel.className = "edit-select";
  const modelIn  = document.createElement("input");
  modelIn.className = "edit-input"; modelIn.type = "text";
  modelIn.spellcheck = false; modelIn.autocomplete = "off";
  modelRow.appendChild(modelSel);
  modelRow.appendChild(modelIn);
  form.appendChild(modelRow);

  const keyIn = mkInput("API Key", cfg.api_key, "password", "sk-...");

  const tempRow = el("div", "import-row");
  tempRow.appendChild(el("div", "row-label", "温度 / 最大输出"));
  const tempIn = document.createElement("input");
  tempIn.className = "edit-input"; tempIn.type = "text"; tempIn.value = String(cfg.temperature);
  const maxIn = document.createElement("input");
  maxIn.className = "edit-input"; maxIn.type = "text"; maxIn.value = String(cfg.max_tokens);
  tempRow.appendChild(tempIn); tempRow.appendChild(maxIn);
  form.appendChild(tempRow);

  const chunkRow = el("div", "import-row");
  chunkRow.appendChild(el("div", "row-label", "分块大小 / 重叠"));
  const chunkIn = document.createElement("input");
  chunkIn.className = "edit-input"; chunkIn.type = "text"; chunkIn.value = String(cfg.chunk_size);
  const overlapIn = document.createElement("input");
  overlapIn.className = "edit-input"; overlapIn.type = "text"; overlapIn.value = String(cfg.chunk_overlap);
  chunkRow.appendChild(chunkIn); chunkRow.appendChild(overlapIn);
  form.appendChild(chunkRow);

  function applyPreset(key, keepUserValue) {
    const p = AI_PRESETS[key];
    refreshInfoCard();

    if (p.manual) {
      baseIn.value = "";
      modelIn.value = "";
      baseIn.disabled = true;
      modelIn.disabled = true;
      modelSel.style.display = "none";
      modelIn.style.display = "";
      modelIn.placeholder = "（手动模式无需模型）";
      keyIn.disabled = true;
      keyIn.placeholder = "（手动模式无需 Key）";
      return;
    }

    baseIn.disabled = false;
    keyIn.disabled = false;
    if (!keepUserValue) {
      baseIn.value = p.base_url;
      keyIn.placeholder = p.key_hint || "sk-...";
    }

    modelSel.innerHTML = "";
    if (p.models && p.models.length) {
      p.models.forEach(m => {
        const o = document.createElement("option");
        o.value = m; o.textContent = m;
        modelSel.appendChild(o);
      });
      const customOpt = document.createElement("option");
      customOpt.value = "__custom__";
      customOpt.textContent = "（自定义模型名）";
      modelSel.appendChild(customOpt);
      modelSel.style.display = "";
      modelIn.style.display = "none";

      const want = keepUserValue ? (cfg.model || p.model) : p.model;
      if (p.models.indexOf(want) !== -1) {
        modelSel.value = want;
      } else {
        modelSel.value = "__custom__";
        modelSel.style.display = "none";
        modelIn.style.display = "";
        modelIn.value = want || "";
        modelIn.placeholder = "输入模型名";
      }
    } else {
      modelSel.style.display = "none";
      modelIn.style.display = "";
      modelIn.value = keepUserValue ? (cfg.model || "") : "";
      modelIn.placeholder = "输入模型名";
    }
  }

  provSel.addEventListener("change", () => {
    const oldKey = keyIn.value;
    applyPreset(provSel.value, false);
    keyIn.value = oldKey;
  });

  modelSel.addEventListener("change", () => {
    if (modelSel.value === "__custom__") {
      modelSel.style.display = "none";
      modelIn.style.display = "";
      modelIn.value = "";
      modelIn.focus();
    }
  });

  applyPreset(provSel.value, true);
  keyIn.value = cfg.api_key || "";

  form.appendChild(el("div", "gh-note",
    "Key 只保存在本机浏览器，不会上传第三方。公共设备用完请到服务商后台吊销。"));

  /* ===== ③ 输入源 ===== */
  form.appendChild(el("div", "gh-section-title", "③ 输入资料"));
  const srcRow = el("div", "file-row");
  const fileBtn = el("button", "btn", "选择 PDF / TXT");
  const fileIn = document.createElement("input");
  fileIn.type = "file"; fileIn.accept = ".pdf,.txt,.md,.json,application/pdf,text/plain";
  const fileInfo = el("div", "file-name", "未选择");
  srcRow.appendChild(fileBtn); srcRow.appendChild(fileIn); srcRow.appendChild(fileInfo);
  form.appendChild(srcRow);

  form.appendChild(el("div", "edit-label", "或直接粘贴文本（可与文件叠加）"));
  const ta = document.createElement("textarea");
  ta.className = "import-textarea";
  ta.style.minHeight = "140px";
  ta.placeholder = "把 PDF 里的文字、讲义、笔记粘贴到这里…";
  ta.spellcheck = false;
  form.appendChild(ta);

  const subjRow = el("div", "import-row");
  subjRow.appendChild(el("div", "row-label", "目标科目"));
  const subjSel = document.createElement("select");
  subjSel.className = "edit-select";
  SUBJECTS.forEach(s => {
    const o = document.createElement("option"); o.value = s; o.textContent = s; subjSel.appendChild(o);
  });
  subjRow.appendChild(subjSel);
  form.appendChild(subjRow);

  /* ===== ④ 结果 ===== */
  form.appendChild(el("div", "gh-section-title", "④ 生成结果"));
  const logEl = el("div", "gh-status", "");
  logEl.style.maxHeight = "120px";
  logEl.style.overflow = "auto";
  form.appendChild(logEl);

  const outTa = document.createElement("textarea");
  outTa.className = "import-textarea";
  outTa.style.minHeight = "160px";
  outTa.placeholder = "生成结果会出现在这里，可手动编辑后再导入";
  outTa.spellcheck = false;
  form.appendChild(outTa);

  const countEl = el("div", "gh-status", "");
  form.appendChild(countEl);

  function log(msg) {
    logEl.textContent += (logEl.textContent ? "\n" : "") + msg;
    logEl.scrollTop = logEl.scrollHeight;
  }
  function setCount() {
    const t = outTa.value.trim();
    if (!t) { countEl.textContent = ""; return; }
    const p = parseJsonList(t);
    countEl.textContent = p.err ? ("⚠ " + p.err) : ("✅ " + p.items.length + " 条，约 " + Math.round(t.length / 1024) + " KB");
    countEl.className = "gh-status" + (p.err ? " err" : " ok");
  }
  outTa.addEventListener("input", setCount);

  let fileText = "";
  fileBtn.addEventListener("click", () => fileIn.click());
  fileIn.addEventListener("change", async () => {
    const f = fileIn.files && fileIn.files[0];
    if (!f) return;
    fileInfo.textContent = f.name;
    logEl.textContent = "";
    log("开始解析 " + f.name + " …");
    try {
      fileText = await extractTextFromFile(f, (i, n) => log("  解析第 " + i + "/" + n + " 页"));
      log("解析完成，共 " + fileText.length + " 字");
    } catch (e) {
      log("❌ " + e.message);
      fileText = "";
    }
  });

  body.appendChild(form);
  pop.appendChild(body);

  /* ===== footer ===== */
  const footer = el("div", "popup-footer");
  const closeBtn   = el("button", "btn", "关闭");
  const copyPrompt = el("button", "btn", "复制 Prompt");
  const saveCfgBtn = el("button", "btn", "保存配置");
  const genBtn     = el("button", "btn", "开始生成");
  const importBtn  = el("button", "btn", "导入结果");

  function readCfg() {
    return {
      provider: provSel.value,
      base_url: baseIn.value.trim(),
      model: modelIn.style.display === "none" ? modelSel.value : modelIn.value.trim(),
      api_key: keyIn.value.trim(),
      temperature: parseFloat(tempIn.value) || 0.2,
      max_tokens: parseInt(maxIn.value, 10) || 8000,
      chunk_size: parseInt(chunkIn.value, 10) || 5000,
      chunk_overlap: parseInt(overlapIn.value, 10) || 300,
    };
  }

  closeBtn.addEventListener("click", () => ov.remove());
  saveCfgBtn.addEventListener("click", () => {
    saveAiConfig(readCfg());
    log("✅ 配置已保存");
  });

  copyPrompt.addEventListener("click", async () => {
    const text = (fileText ? fileText + "\n\n" : "") + ta.value.trim();
    if (!text) { confirmPopup("请先选择文件或粘贴文本"); return; }
    const full = buildSystemPrompt(subjSel.value) + "\n\n=====\n以下是医学资料：\n\n" + text;
    try {
      await copyText(full);
      logEl.textContent = "";
      log("📋 已复制 Prompt（含 " + text.length + " 字资料）");
      log("请到以下任一网页版粘贴：");
      log("  · https://chat.deepseek.com");
      log("  · https://chat.openai.com");
      log("  · https://kimi.moonshot.cn");
      log("  · https://chatglm.cn");
      log("");
      log("拿到返回 JSON 后，粘贴到下方「生成结果」框，");
      log("再点「导入结果」即可。");
    } catch (e) {
      confirmPopup("复制失败：" + e.message);
    }
  });

  genBtn.addEventListener("click", async () => {
    const text = (fileText ? fileText + "\n\n" : "") + ta.value.trim();
    if (!text) { confirmPopup("请先选择文件或粘贴文本"); return; }

    const provider = provSel.value;
    const preset = AI_PRESETS[provider];

    if (preset.manual) {
      const full = buildSystemPrompt(subjSel.value) + "\n\n=====\n以下是医学资料：\n\n" + text;
      try {
        await copyText(full);
        logEl.textContent = "";
        log("📋 已复制 Prompt（含 " + text.length + " 字资料）");
        log("请到任意网页版 AI 粘贴，再把返回 JSON 贴到下方框。");
      } catch (e) {
        confirmPopup("复制失败：" + e.message);
      }
      return;
    }

    const c = readCfg();
    if (!c.base_url) { confirmPopup("请填写 Base URL"); return; }
    if (!c.model) { confirmPopup("请选择或填写模型名"); return; }
    if (!c.api_key && !preset.no_key) {
      confirmPopup("请填写 API Key，或切换到「手动模式」"); return;
    }
    if (preset.cors === false) {
      confirmPopup(
        "⚠ 该服务不支持浏览器直连（CORS）。\n\n" +
        "建议：\n" +
        "  1. 切换到 OpenRouter（含 DeepSeek 免费版）\n" +
        "  2. 或自建代理后改填代理地址\n" +
        "  3. 或改用「手动模式」"
      );
      return;
    }

    saveAiConfig(c);
    logEl.textContent = "";
    outTa.value = "";
    setCount();
    genBtn.disabled = true; importBtn.disabled = true; copyPrompt.disabled = true;
    try {
      const items = await aiGenerate({ cfg: c, subject: subjSel.value, text }, log);
      outTa.value = JSON.stringify(items, null, 2);
      setCount();
      log("🎉 完成，共 " + items.length + " 条");
    } catch (e) {
      log("❌ " + e.message);
      if (/网络错误|Failed to fetch|CORS/i.test(e.message)) {
        log("提示：可能是 CORS 限制，可换 OpenRouter / Gemini / 智谱，");
        log("或使用「手动模式」复制 Prompt 到网页版处理。");
      }
    } finally {
      genBtn.disabled = false; importBtn.disabled = false; copyPrompt.disabled = false;
    }
  });

  importBtn.addEventListener("click", () => {
    const t = outTa.value.trim();
    if (!t) { confirmPopup("还没有生成结果"); return; }
    const p = parseJsonList(t);
    if (p.err) { confirmPopup("结果不是合法 JSON：" + p.err); return; }
    ov.remove();
    const result = store.importFromText(t, "append", null);
    if (!result.ok) { confirmPopup(result.msg); return; }
    render();
    let msg = result.msg;
    if (result.warnings.length) {
      msg += "\n\n注意：\n" + result.warnings.slice(0, 8).join("\n");
      if (result.warnings.length > 8) msg += "\n…… 共 " + result.warnings.length + " 条";
    }
    confirmPopup(msg);
  });

  footer.appendChild(closeBtn);
  footer.appendChild(copyPrompt);
  footer.appendChild(saveCfgBtn);
  footer.appendChild(genBtn);
  footer.appendChild(importBtn);
  pop.appendChild(footer);
  ov.appendChild(pop);
  document.body.appendChild(ov);
}

  pop.appendChild(el("div", "popup-title", "导出数据"));

  subjRow.appendChild(el("div", "row-label", "导出科目"));

  subjSel.className = "edit-select";

  });
  subjRow.appendChild(subjSel);

  body.appendChild(infoLabel);
  const ta = document.createElement("textarea");
  ta.className = "export-textarea"; ta.readOnly = true; ta.spellcheck = false;

    const text = store.exportText(subjSel.value);

  const copyBtn = el("button", "btn", "复制全部");

    copyText(ta.value).then(() => confirmPopup("已复制到剪贴板")).catch(err => confirmPopup("复制失败：" + err.message));
  });
  footer.appendChild(closeBtn); footer.appendChild(copyBtn);
  pop.appendChild(footer);
  ov.appendChild(pop);
  document.body.appendChild(ov);
}

function scopeBySubject() {
  let data = store.data;
  if (state.subject !== "全部") data = data.filter(d => d.subject === state.subject);
  return data;
}
function updateSelectOptions(sel, values) {
  const cur = Array.prototype.map.call(sel.options, o => o.value).join("\u0001");
  const nxt = values.map(v => v.value).join("\u0001");
  if (cur !== nxt) {
    sel.innerHTML = "";
    for (let i = 0; i < values.length; i++) {
      const o = document.createElement("option");
      o.value = values[i].value; o.textContent = values[i].label;
      sel.appendChild(o);
    }
  }
}
function rebuildSystemValues() {
  const base = scopeBySubject();
  const counts = {};
  for (let i = 0; i < base.length; i++) { const s = detectSystem(base[i]); counts[s] = (counts[s] || 0) + 1; }
  const names = Object.keys(counts).sort();
  const values = [{ value: "全部", label: "全部" }];
  for (let i = 0; i < names.length; i++) values.push({ value: names[i], label: withCount(names[i], counts[names[i]]) });
  const sel = document.getElementById("systemSel");
  updateSelectOptions(sel, values);
  if (state.system !== "全部" && names.indexOf(state.system) === -1) { state.system = "全部"; saveSettings(); }
  sel.value = state.system;
}
function rebuildChapterValues() {
  let base = scopeBySubject();
  if (state.system !== "全部") base = base.filter(d => detectSystem(d) === state.system);
  const counts = {};
  for (let i = 0; i < base.length; i++) {
    const ch = String(base[i].chapter || "").trim();
    const key = ch || "（未填章节）";
    counts[key] = (counts[key] || 0) + 1;
  }
  const names = Object.keys(counts).sort();
  const values = [{ value: "全部", label: "全部" }];
  for (let i = 0; i < names.length; i++) values.push({ value: names[i], label: withCount(names[i], counts[names[i]]) });
  const sel = document.getElementById("chapterSel");
  updateSelectOptions(sel, values);
  if (state.chapter !== "全部" && names.indexOf(state.chapter) === -1) { state.chapter = "全部"; saveSettings(); }
  sel.value = state.chapter;
}
function rebuildTagValues() {
  const set = {};
  for (let i = 0; i < store.data.length; i++) {
    const tags = store.data[i].tags || [];
    for (let j = 0; j < tags.length; j++) set[tags[j]] = true;
  }
  const names = Object.keys(set).sort();
  const values = [{ value: "全部", label: "全部" }];
  for (let i = 0; i < names.length; i++) values.push({ value: names[i], label: names[i] });
  const sel = document.getElementById("tagSel");
  updateSelectOptions(sel, values);
  if (state.tag !== "全部" && names.indexOf(state.tag) === -1) { state.tag = "全部"; saveSettings(); }
  sel.value = state.tag;
}
function compareId(a, b) {
  return String(a == null ? "" : a).localeCompare(String(b == null ? "" : b), "en", { numeric: true, sensitivity: "base" });
}
function getFiltered() {
  let data = store.data.slice();
  if (state.subject !== "全部") data = data.filter(d => d.subject === state.subject);
  if (state.system !== "全部") data = data.filter(d => detectSystem(d) === state.system);
  if (state.chapter !== "全部") {
    if (state.chapter === "（未填章节）") data = data.filter(d => !String(d.chapter || "").trim());
    else data = data.filter(d => d.chapter === state.chapter);
  }
  if (state.status !== "全部") data = data.filter(d => d.status === state.status);
  if (state.tag !== "全部") data = data.filter(d => (d.tags || []).indexOf(state.tag) !== -1);
  if (state.starredOnly) data = data.filter(d => d.starred);
  if (state.search) {
    const q = parseSearchQuery(state.search);
    if (q.subject) data = data.filter(d => String(d.subject || "").indexOf(q.subject) !== -1);
    if (q.system) data = data.filter(d => detectSystem(d).indexOf(q.system) !== -1);
    if (q.chapter) data = data.filter(d => String(d.chapter || "").indexOf(q.chapter) !== -1);
    if (q.status) data = data.filter(d => String(d.status || "") === q.status);
    if (q.tag) data = data.filter(d => (d.tags || []).indexOf(q.tag) !== -1);
    if (q.frequency) data = data.filter(d => String(d.frequency || "").indexOf(q.frequency) !== -1);
    if (q.starred) {
      const y = ["是", "1", "true", "yes", "y"].indexOf(String(q.starred).toLowerCase()) !== -1;
      data = data.filter(d => !!d.starred === y);
    }
    if (q.keywords.length) {
      data = data.filter(d => {
        const s = JSON.stringify(d).toLowerCase();
        return q.keywords.every(k => s.indexOf(String(k).toLowerCase()) !== -1);
      });
    }
  }
  if (state.sort === "频率高→低") data.sort((a, b) => starCount(b) - starCount(a));
  else if (state.sort === "频率低→高") data.sort((a, b) => starCount(a) - starCount(b));
  else if (state.sort === "标题") data.sort((a, b) => String(a.title || "").localeCompare(String(b.title || ""), "zh"));
  else if (state.sort === "ID升序") data.sort((a, b) => compareId(a.id, b.id));
  else if (state.sort === "ID降序") data.sort((a, b) => compareId(b.id, a.id));
  return data;
}

  const scroller = document.getElementById("listScroll");

  list.innerHTML = "";

  if (!filtered.length) {
    const hint = store.data.length ? "没有匹配的条目" : EMPTY_HINT;
    list.appendChild(el("div", "empty-hint", hint));

function saveItem(data, originalId) {
  const lookupId = (originalId !== undefined && originalId !== null) ? originalId : data.id;
  let found = false;
  for (let i = 0; i < store.data.length; i++) {
    if (store.data[i].id === lookupId) { store.data[i] = data; found = true; break; }

  if (!found) store.data.push(data);

function saveScroll() {
  const s = document.getElementById("listScroll");
  if (!s) return;
  const max = s.scrollHeight - s.clientHeight;
  state.scrollY = max > 0 ? 1 - (s.scrollTop / max) : 1.0;
  saveSettings();
}
function restoreScroll() {
  const s = document.getElementById("listScroll");
  if (!s) return;
  const max = s.scrollHeight - s.clientHeight;
  if (max > 0) {
    const y = clamp(Number(state.scrollY) || 1.0, 0, 1);
    s.scrollTop = (1 - y) * max;
  }

function extractSentence(text, re) {

  for (let i = 0; i < lines.length; i++) if (re.test(lines[i])) return lines[i].trim();
  const parts = String(text).split(/[。；;]/);

function splitManifestations(text) {
  const lines = String(text).split(/\n/);
  const symptoms = [], signs = [];
  lines.forEach(function (line) {
    if (!line.trim()) return;
    const tm = line.match(/^@([^|]+)\|\s*(.*)$/);
    const prefix = tm ? "@" + tm[1].trim() + " | " : "";
    const content = tm ? tm[2] : line;
    const parts = content.split(/[。；;]/).map(function (x) { return x.trim(); }).filter(Boolean);
    parts.forEach(function (p) {
      let isSign = false;
      for (let i = 0; i < SIGN_KEYWORDS.length; i++) {
        if (p.indexOf(SIGN_KEYWORDS[i]) !== -1) { isSign = true; break; }
      }
      if (isSign) signs.push(prefix + p); else symptoms.push(prefix + p);
    });
  });
  return { symptoms: symptoms, signs: signs };
}

function buildChiefComplaint(symptoms, mf, allText) {
  const searchText = (symptoms.join(" ") + " " + (mf || "")).trim() || allText;
  const matched = [];
  for (let i = 0; i < CHIEF_WORDS.length && matched.length < 2; i++) {
    if (searchText.indexOf(CHIEF_WORDS[i]) !== -1) matched.push(CHIEF_WORDS[i]);
  }
  let mainSymptom = "";
  if (matched.length >= 2) mainSymptom = matched[0] + "伴" + matched[1];
  else if (matched.length === 1) mainSymptom = matched[0];
  if (!mainSymptom) return "（病例未记录明确主诉症状，请据实补充）";

  let prefix = "";
  if (/(反复|间断|阵发|发作性|多次)/.test(searchText)) prefix = "反复";
  else if (/(突发|急起|骤然|突然)/.test(searchText)) prefix = "突发";

  const dur = extractDuration(mf || allText);
  let chief = prefix + mainSymptom + (dur ? " " + dur : "");
  if (chief.length > 22) chief = chief.slice(0, 22);
  return chief;
}

function splitHistorySegments(symptomLines) {
  const out = { onset: [], features: [], accompany: [], treatment: [], general: [], negative: [] };
  for (let i = 0; i < symptomLines.length; i++) {
    const s = symptomLines[i].trim();
    if (!s) continue;
    if (NEGATIVE_RE.test(s) && !hasAny(s, SIGN_KEYWORDS)) { out.negative.push(s); continue; }
    if (HISTORY_RULES.treatment.test(s)) { out.treatment.push(s); continue; }
    if (HISTORY_RULES.general.test(s)) { out.general.push(s); continue; }
    if (HISTORY_RULES.accompany.test(s)) { out.accompany.push(s); continue; }
    if (HISTORY_RULES.onset.test(s)) { out.onset.push(s); continue; }
    out.features.push(s);
  }
  return out;
}

function groupSignsBySystem(signs) {
  const groups = SYSTEM_EXAM_RULES.map(r => ({ name: r.name, lines: [] }));
  const other = [];
  for (let i = 0; i < signs.length; i++) {
    const s = signs[i];
    let placed = false;
    for (let g = 0; g < SYSTEM_EXAM_RULES.length; g++) {
      if (hasAny(s, SYSTEM_EXAM_RULES[g].kws)) {
        groups[g].lines.push(s);
        placed = true;
        break;
      }
    }
    if (!placed) other.push(s);
  }
  return { groups: groups, other: other };
}

function collectMissingFields(item) {
  const missing = [];
  const groups = [
    [RECORD_FIELD_ALIASES.manifestations, "临床表现"],
    [RECORD_FIELD_ALIASES.labTests, "辅助检查"],
    [RECORD_FIELD_ALIASES.diagnosis, "诊断依据"],
    [RECORD_FIELD_ALIASES.differential, "鉴别诊断"],
    [RECORD_FIELD_ALIASES.treatment, "治疗方案"],
  ];
  for (let i = 0; i < groups.length; i++) {
    if (!pickAny(item, groups[i][0])) missing.push(groups[i][1]);
  }
  return missing;
}

function extractRecordData(item) {
  const allText = itemAllText(item);
  const mf = pickAny(item, RECORD_FIELD_ALIASES.manifestations);
  const lab = pickAny(item, RECORD_FIELD_ALIASES.labTests);
  const diag = pickAny(item, RECORD_FIELD_ALIASES.diagnosis);
  const diff = pickAny(item, RECORD_FIELD_ALIASES.differential);
  const treat = pickAny(item, RECORD_FIELD_ALIASES.treatment);
  const comp = pickAny(item, RECORD_FIELD_ALIASES.complications);
  const prev = pickAny(item, RECORD_FIELD_ALIASES.prevention);
  const prog = pickAny(item, RECORD_FIELD_ALIASES.prognosis);
  const overview = pickAny(item, RECORD_FIELD_ALIASES.overview);

  let sex = extractSex(allText);
  if (sex === null) {
    if (hasAny(allText, MALE_ONLY_KW)) sex = "男";
    else if (hasAny(allText, FEMALE_ONLY_KW)) sex = "女";
    else sex = Math.random() < 0.5 ? "男" : "女";
  }
  let age = extractAge(allText);
  if (age === null) {
    if (hasAny(allText, PEDIATRIC_KW)) age = rndInt(1, 12);
    else if (hasAny(allText, ELDERLY_KW)) age = rndInt(60, 82);
    else age = rndInt(18, 68);
  }

  const split = splitManifestations(mf);
  const hist = splitHistorySegments(split.symptoms);
  const examGrouped = groupSignsBySystem(split.signs);
  const vitals = extractVitals(allText);

  const isFemale = sex === "女";
  const isChild = age <= 14;
  const isOBGYN = /(妊娠|分娩|月经|子宫|卵巢|阴道|孕|产科|妇科)/.test(allText);

  return {
    item: item, allText: allText,
    mf: mf, lab: lab, diag: diag, diff: diff, treat: treat,
    comp: comp, prev: prev, prog: prog, overview: overview,
    name: rndPick(RECORD_SURNAMES) + "××",
    job: rndPick(RECORD_JOBS),
    marriage: rndPick(RECORD_MARRIAGE),
    nation: rndPick(RECORD_NATIONS),
    today: formatDate(new Date()),
    sex: sex, age: age,
    chief: buildChiefComplaint(split.symptoms, mf, allText),
    symptoms: split.symptoms, signs: split.signs,
    hist: hist, examGrouped: examGrouped, vitals: vitals,
    isFemale: isFemale, isChild: isChild, isOBGYN: isOBGYN,
    missingFields: collectMissingFields(item),
  };
}

function generateAdmissionNote(data) {
  const sections = [];
  let n = 0;
  function sec(title, lines) {
    const clean = lines.filter(x => x && String(x).trim());
    if (!clean.length) return;
    sections.push({ title: CN_NUM[n++] + "、" + title, lines: clean });
  }

  sec("一般项目", [
    "姓名：" + data.name + "　　性别：" + data.sex + "　　年龄：" + data.age + "岁",
    "民族：" + data.nation + "　　职业：" + data.job + "　　婚姻：" + data.marriage,
    "入院日期：" + data.today + "　　记录日期：" + data.today,
    "病史陈述者：患者本人（可靠）",
  ]);

  sec("主诉", [data.chief]);

  const histLines = [];
  if (data.hist.onset.length) histLines.push("起病情况：" + data.hist.onset.join("；") + "。");
  if (data.hist.features.length) histLines.push("主要症状特点：" + data.hist.features.join("；") + "。");
  if (data.hist.accompany.length) histLines.push("伴随症状：" + data.hist.accompany.join("；") + "。");
  if (data.hist.treatment.length) histLines.push("诊治经过：" + data.hist.treatment.join("；") + "。");
  if (data.hist.general.length) histLines.push("一般情况：" + data.hist.general.join("；") + "。");
  if (data.hist.negative.length) histLines.push("阴性症状：" + data.hist.negative.join("；") + "。");
  if (!histLines.length) histLines.push("（病例未记录现病史内容，请据实补充）");
  sec("现病史", histLines);

  const pastLines = ["既往史：（病例未记录，请据实补充）"];
  const smoke = extractSentence(data.allText, SMOKE_RE);
  const drink = extractSentence(data.allText, DRINK_RE);
  pastLines.push(smoke ? "吸烟史：" + smoke : "吸烟史：（病例未记录，请据实补充）");
  pastLines.push(drink ? "饮酒史：" + drink : "饮酒史：（病例未记录，请据实补充）");
  if (data.isFemale || data.isOBGYN) {
    const menstrual = extractSentence(data.allText, /(月经|经期|末次月经|LMP)/);
    const obstetric = extractSentence(data.allText, /(孕|产|G\d+P\d+|妊娠|分娩)/);
    pastLines.push(menstrual ? "月经史：" + menstrual : "月经史：（病例未记录，请据实补充）");
    if (obstetric) pastLines.push("婚育史：" + obstetric);
  }
  if (data.isChild) {
    const growth = extractSentence(data.allText, /(出生|发育|生长|喂养|疫苗|接种)/);
    pastLines.push(growth ? "生长发育史：" + growth : "生长发育史：（病例未记录，请据实补充）");
  }
  pastLines.push("家族史：（病例未记录，请据实补充）");
  sec("既往史 · 个人史 · 家族史", pastLines);

  const examLines = [];
  const vp = [];
  if (data.vitals.T) vp.push("T " + data.vitals.T);
  if (data.vitals.P) vp.push("P " + data.vitals.P);
  if (data.vitals.R) vp.push("R " + data.vitals.R);
  if (data.vitals.BP) vp.push("BP " + data.vitals.BP);
  if (data.vitals.SpO2) vp.push("SpO₂ " + data.vitals.SpO2);
  examLines.push(vp.length ? vp.join("　") : "生命体征：（病例未记录，请据实补充）");
  data.examGrouped.groups.forEach(function (g) {
    if (g.lines.length) examLines.push("【" + g.name + "】" + g.lines.join("；") + "。");
  });
  if (data.examGrouped.other.length) {
    examLines.push("【其他体征】" + data.examGrouped.other.join("；") + "。");
  }
  if (data.examGrouped.groups.every(g => !g.lines.length) && !data.examGrouped.other.length) {
    examLines.push("专科查体：（病例未记录阳性体征，请据实补充）");
  }
  sec("体格检查", examLines);

  sec("辅助检查", [data.lab || "（病例未记录辅助检查内容，请据实补充）"]);
  sec("初步诊断", [data.item.title || "（待补充）"]);
  sec("诊断依据", [data.diag || data.overview || "（病例未记录诊断依据，请据实补充）"]);
  sec("鉴别诊断", [data.diff || "（病例未记录鉴别诊断，请据实补充）"]);
  if (data.comp) sec("并发症", [data.comp]);
  sec("诊疗计划", [data.treat || "（病例未记录治疗方案，请据实补充）"]);

  const tail = [];
  if (data.prev) tail.push("预防：" + data.prev);
  if (data.prog) tail.push("预后：" + data.prog);
  if (tail.length) sec("预防与预后", tail);

  return {
    item: data.item, mode: "admission", sections: sections,
    missingFields: data.missingFields,
    name: data.name, sex: data.sex, age: data.age,
    chief: data.chief, today: data.today,
  };
}

function generateFirstCourseNote(data) {
  const sections = [];
  let n = 0;
  function sec(title, lines) {
    const clean = lines.filter(x => x && String(x).trim());
    if (!clean.length) return;
    sections.push({ title: CN_NUM[n++] + "、" + title, lines: clean });
  }

  const features = [];
  const ageDesc = data.age < 14 ? "幼儿" : data.age < 35 ? "青年" : data.age < 60 ? "中年" : "老年";
  const onsetDesc = data.hist.onset.length ? "急性起病" : "慢性起病";
  features.push("1. " + ageDesc + data.sex + "性，" + onsetDesc + "。");
  const mfFirst = data.symptoms.slice(0, 2).join("；");
  features.push("2. 主要症状：" + (mfFirst ? mfFirst + "。" : "（病例未记录）"));
  const signFirst = data.signs.slice(0, 2).join("；");
  features.push("3. 主要体征：" + (signFirst ? signFirst + "。" : "（病例未记录）"));
  features.push("4. 辅助检查：" + (data.lab ? data.lab.split(/[。\n]/)[0] + "。" : "（病例未记录）"));
  sec("病例特点", features);

  const discuss = [];
  discuss.push("1. 初步诊断：" + (data.item.title || "待定"));
  discuss.push("2. 诊断依据：");
  if (data.diag) {
    const dl = String(data.diag).split(/\n/).filter(Boolean);
    dl.forEach(function (l, i) { discuss.push("　（" + (i + 1) + "）" + l.replace(/^[-•*]\s*/, "")); });
  } else if (data.overview) {
    discuss.push("　（1）" + data.overview);
  } else {
    discuss.push("　（病例未记录诊断依据，请据实补充）");
  }
  discuss.push("3. 鉴别诊断：" + (data.diff || "（病例未记录，请据实补充）"));
  sec("拟诊讨论", discuss);

  const plan = [];
  if (data.treat) {
    const tl = String(data.treat).split(/\n/).filter(Boolean);
    tl.forEach(function (l, i) { plan.push((i + 1) + ". " + l.replace(/^[-•*]\s*/, "")); });
  } else {
    plan.push("（病例未记录诊疗计划，请据实补充）");
  }
  sec("诊疗计划", plan);

  return {
    item: data.item, mode: "firstCourse", sections: sections,
    missingFields: data.missingFields,
    name: data.name, sex: data.sex, age: data.age,
    chief: data.chief, today: data.today,
  };
}

function bigRecordToText(data) {
  const title = data.mode === "firstCourse" ? "首次病程记录" : "住院病历";
  const out = [title, "（模拟生成：一般项目为模拟值，疾病相关内容摘自病例原文）", ""];
  if (data.mode === "firstCourse" && data.name) {
    out.push("患者 " + data.name + "，" + data.sex + "，" + data.age + " 岁，因\u201c" +
      (data.chief || "（主诉待补）") + "\u201d于 " + data.today + " 入院。");
    out.push("");
  }
  data.sections.forEach(function (s) {
    out.push(s.title);
    s.lines.forEach(function (l) { out.push("  " + stripMarks(l)); });
    out.push("");
  });
  if (data.missingFields && data.missingFields.length) {
    out.push("⚠ 本病例缺失字段：" + data.missingFields.join("、"));
  }
  return out.join("\n");
}

function downloadText(filename, text) {
  const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(function () { a.remove(); URL.revokeObjectURL(url); }, 500);
}

    "<title>" + escapeHtml(modeTitle) + "</title><style>" + fullCss + "</style></head><body>" +

}

function loadRecordDrafts() {

      const arr = JSON.parse(raw);
      if (Array.isArray(arr)) return arr;
    }
  } catch (e) {}
  return [];
}
function saveRecordDrafts(list) {

}

  [rerollBtn, editBtn, saveBtn, draftsBtn, txtBtn, copyBtn, printBtn]
    .forEach(function (b) { ctrl.appendChild(b); });
  body.appendChild(ctrl);

  const scroll = el("div", "detail-scroll");
  body.appendChild(scroll);

  let currentItem = null;
  let currentData = null;
  let currentMode = "admission";
  let editing = false;
  let customText = null;
  let editTa = null;

  function getRecordText() {
    if (customText !== null) return customText;
    return bigRecordToText(currentData);
  }
  function renderRecord() {
    scroll.innerHTML = "";
    editTa = null;
    if (editing) {
      const ta = document.createElement("textarea");
      ta.className = "import-textarea";
      ta.style.minHeight = "400px";
      ta.style.height = "70vh";
      ta.value = getRecordText();
      ta.spellcheck = false;
      editTa = ta;
      scroll.appendChild(ta);
    } else if (customText !== null) {
      const pre = el("div", "big-record");
      pre.style.whiteSpace = "pre-wrap";
      pre.style.fontFamily = "inherit";
      pre.textContent = customText;
      scroll.appendChild(pre);
    } else {
      scroll.appendChild(renderBigRecord(currentData));
    }
  }
  function build(newItem) {
    if (newItem) currentItem = newItem;
    if (!currentItem) currentItem = rndPick(pool);
    const d = extractRecordData(currentItem);
    currentData = currentMode === "firstCourse"
      ? generateFirstCourseNote(d) : generateAdmissionNote(d);
    customText = null;
    editing = false;
    editBtn.textContent = "✏️ 编辑";
    titleEl.textContent = (currentMode === "firstCourse" ? "首次病程 · " : "住院病历 · ") +
      (currentItem.title || "");
    renderRecord();
    scroll.scrollTop = 0;
  }

  modeRow.addEventListener("click", function (e) {
    const t = e.target;
    if (t !== admissionTab && t !== firstTab) return;
    currentMode = t === firstTab ? "firstCourse" : "admission";
    admissionTab.classList.toggle("active", currentMode === "admission");
    firstTab.classList.toggle("active", currentMode === "firstCourse");
    build();
  });

  rerollBtn.addEventListener("click", function () { currentItem = null; build(); });

  editBtn.addEventListener("click", function () {
    if (editing) {
      if (editTa) customText = editTa.value;
      editing = false;
      editBtn.textContent = "✏️ 编辑";
    } else {
      editing = true;
      editBtn.textContent = "✅ 完成";
    }
    renderRecord();
  });

  copyBtn.addEventListener("click", function () {
    copyText(getRecordText())
      .then(function () { confirmPopup("病历文本已复制"); })
      .catch(function (err) { confirmPopup("复制失败：" + err.message); });
  });

  txtBtn.addEventListener("click", function () {
    const modeName = currentMode === "firstCourse" ? "首次病程" : "住院病历";
    const filename = (currentItem.title || "病历") + "_" + modeName + "_" +
      formatDate(new Date()) + ".txt";
    downloadText(filename, getRecordText());
  });

  printBtn.addEventListener("click", function () {
    printBigRecord({
      item: currentData.item, mode: currentMode, sections: currentData.sections,
      missingFields: currentData.missingFields,
      name: currentData.name, sex: currentData.sex, age: currentData.age,
      chief: currentData.chief, today: currentData.today,
      text: customText || null,
    });
  });

  saveBtn.addEventListener("click", function () {
    const drafts = loadRecordDrafts();
    drafts.unshift({
      id: genId(),
      title: (currentItem.title || "未命名") + " · " +
        (currentMode === "firstCourse" ? "首次病程" : "住院病历"),
      mode: currentMode,
      text: getRecordText(),
      createdAt: Date.now(),
    });
    saveRecordDrafts(drafts);
    confirmPopup("已保存到草稿（共 " + Math.min(drafts.length, DRAFT_MAX) + " 份）");
  });

  draftsBtn.addEventListener("click", function () {
    openDraftsPanel(function (draft) {
      currentMode = draft.mode || "admission";
      admissionTab.classList.toggle("active", currentMode === "admission");
      firstTab.classList.toggle("active", currentMode === "firstCourse");
      customText = draft.text;
      editing = false;
      currentItem = { title: draft.title || "草稿", subject: "" };
      currentData = {
        item: currentItem, mode: currentMode, sections: [], missingFields: [],
        name: "", sex: "", age: "", chief: "", today: "",
      };
      editBtn.textContent = "✏️ 编辑";
      titleEl.textContent = "草稿 · " + (draft.title || "未命名");
      renderRecord();
    });
  });

  pop.appendChild(body);
  const footer = el("div", "popup-footer");
  const closeBtn = el("button", "btn", "关闭");
  closeBtn.addEventListener("click", function () { ov.remove(); });
  footer.appendChild(closeBtn);
  pop.appendChild(footer);
  ov.appendChild(pop);
  document.body.appendChild(ov);

  build();
}

function bindEvents() {
  document.getElementById("subjectSel").addEventListener("change", function (e) {
    state.subject = e.target.value; state.system = "全部"; state.chapter = "全部";
    saveSettings(); render();
  });
  document.getElementById("systemSel").addEventListener("change", function (e) {
    state.system = e.target.value; state.chapter = "全部";
    saveSettings(); render();
  });
  document.getElementById("chapterSel").addEventListener("change", function (e) {
    state.chapter = e.target.value; saveSettings(); render();
  });
  document.getElementById("statusSel").addEventListener("change", function (e) {
    state.status = e.target.value; saveSettings(); render();
  });
  document.getElementById("tagSel").addEventListener("change", function (e) {
    state.tag = e.target.value; saveSettings(); render();
  });
  document.getElementById("sortSel").addEventListener("change", function (e) { setSort(e.target.value); });
  document.getElementById("searchInput").addEventListener("input", function (e) {
    state.search = e.target.value.trim(); render();
  });
  document.getElementById("addBtn").addEventListener("click", function () { openEdit(null); });
  document.getElementById("randomBtn").addEventListener("click", randomPick);
  document.getElementById("recordBtn").addEventListener("click", openBigRecord);
  document.getElementById("starBtn").addEventListener("click", function () {
    state.starredOnly = !state.starredOnly; saveSettings();
    this.textContent = state.starredOnly ? "★ 收藏" : "☆ 收藏";
    render();
  });
  document.getElementById("importBtn").addEventListener("click", openImport);
  document.getElementById("exportBtn").addEventListener("click", openExport);
  document.getElementById("pdfBtn").addEventListener("click", openPdfExport);
  document.getElementById("uploadBtn").addEventListener("click", openUpload);
  document.getElementById("clearBtn").addEventListener("click", confirmClear);
  document.getElementById("settingsBtn").addEventListener("click", openSettings);

  let scrollTimer = null;
  document.getElementById("listScroll").addEventListener("scroll", function () {
    updateBackToTop();
    if (scrollTimer) clearTimeout(scrollTimer);
    scrollTimer = setTimeout(saveScroll, 350);
  }, { passive: true });
  window.addEventListener("beforeunload", saveScroll);
  window.addEventListener("pagehide", saveScroll);

  bindBackToTop();
}

async function init() {
  loadSettings();
  applyTheme();
  try {
    await Promise.race([
      store.load(),
      new Promise((_, reject) => setTimeout(() => reject(new Error("数据加载超时")), 3000))
    ]);
  } catch (e) { if (!Array.isArray(store.data)) store.data = []; }
  bindEvents();
  document.getElementById("starBtn").textContent = state.starredOnly ? "★ 收藏" : "☆ 收藏";
  document.getElementById("sortSel").value = state.sort;
  document.getElementById("statusSel").value = state.status;
  document.getElementById("subjectSel").value = state.subject;
  render();
  requestAnimationFrame(() => { restoreScroll(); setTimeout(restoreScroll, 120); });
}
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
else init();
</script>
</body>
</html>
