function openEdit(item) {
  const isNew = !item;
  const src = item ? JSON.parse(JSON.stringify(item)) : {};
  const originalId = src.id || null;
  const draftValues = {};
  for (let i = 0; i < ALL_FIELDS.length; i++) draftValues[ALL_FIELDS[i]] = String(src[ALL_FIELDS[i]] || "");

  const ov = el("div", "overlay");
  const pop = el("div", "popup popup-lg");
  pop.appendChild(el("div", "popup-title", isNew ? "新增病例" : "编辑病例"));
  const body = el("div", "popup-body");
  const form = el("div", "edit-form");

  function addLabel(text) { form.appendChild(el("div", "edit-label", text)); }
  function addText(value, placeholder) {
    const inp = document.createElement("input");
    inp.className = "edit-input"; inp.type = "text"; inp.value = value || "";
    if (placeholder) inp.placeholder = placeholder;
    form.appendChild(inp);
    return inp;
  }
  function addSelect(values, current, labeler) {
    const sel = document.createElement("select");
    sel.className = "edit-select";
    for (let i = 0; i < values.length; i++) {
      const v = values[i];
      const o = document.createElement("option");
      o.value = v; o.textContent = labeler ? labeler(v) : v;
      sel.appendChild(o);
    }
    sel.value = current;
    form.appendChild(sel);
    return sel;
  }

  addLabel("标题 *");
  const titleInput = addText(src.title || "");
  addLabel("ID（唯一标识；留空自动编号）");
  const idInput = addText(src.id || "", "留空自动编号");
  addLabel("科目（决定下方字段模板）");
  const subjValues = SUBJECTS.slice();
  const curSubj = src.subject || SUBJECTS[0];
  if (subjValues.indexOf(curSubj) === -1) subjValues.push(curSubj);
  const subjectSel = addSelect(subjValues, curSubj);

  addLabel("章节");
  const chapterSel = document.createElement("select");
  chapterSel.className = "edit-select";
  form.appendChild(chapterSel);
  function rebuildChapterSelect(subject, keepValue) {
    const list = (CHAPTER_WHITELIST[subject] || []).slice();
    const cur = keepValue !== undefined ? String(keepValue == null ? "" : keepValue) : "";
    chapterSel.innerHTML = "";
    const inList = list.indexOf(cur) !== -1;
    const options = list.slice();
    if (cur && !inList) {
      options.push(cur);
    }
    options.forEach(c => {
      const o = document.createElement("option"); o.value = c; o.textContent = c; chapterSel.appendChild(o);
    });
    if (options.indexOf(CHAPTER_OTHER) === -1) {
      const otherOpt = document.createElement("option");
      otherOpt.value = CHAPTER_OTHER; otherOpt.textContent = CHAPTER_OTHER;
      chapterSel.appendChild(otherOpt);
    }
    const emptyOpt = document.createElement("option");
    emptyOpt.value = ""; emptyOpt.textContent = CHAPTER_EMPTY_LABEL;
    chapterSel.appendChild(emptyOpt);
    chapterSel.value = cur;
  }

  addLabel("出现频率");
  const freqValues = FREQ_OPTIONS.slice();
  const curFreq = src.frequency || "";
  if (curFreq && freqValues.indexOf(curFreq) === -1) freqValues.push(curFreq);
  const freqSel = addSelect(freqValues, curFreq, v => (v === "" ? "（未设置）" : v));
  addLabel("复习状态");
  const statusSel = addSelect(STATUS_OPTIONS, src.status || "未看");
  addLabel("标签（逗号分隔）");
  const tagsInput = addText((src.tags || []).join("，"));
  addLabel("收藏（1=收藏，0=不收藏）");
  const starredInput = addText(src.starred ? "1" : "0");

  form.appendChild(el("div", "edit-label", "内容字段（按科目自动切换）"));
  const fieldsContainer = el("div", "");
  fieldsContainer.style.cssText = "display:flex;flex-direction:column;gap:5px";
  form.appendChild(fieldsContainer);
  let fieldInputs = {};
  function syncCurrentToDraft() { for (const k in fieldInputs) draftValues[k] = fieldInputs[k].value; }
  function buildFields(subject) {
    syncCurrentToDraft();
    fieldsContainer.innerHTML = ""; fieldInputs = {};
    const fields = getFieldsForSubject(subject);
    const hint = el("div", "subject-hint", "当前科目：" + subject + "，共 " + fields.length + " 个字段。" + (subject === "内科学" || subject === "外科学" ? "（含分类 / 分型 / 分期）" : subject === "病理学总论" ? "（总论模板：概念 / 分类 / 机制 / 变化 / 转归 / 辨析）" : subject === "病理学各论" ? "（各论模板：含分类分型、好发部位、分子病理、并发症）" : "（切换科目不会丢失其他科字段已填内容）"));
    fieldsContainer.appendChild(hint);
    for (let i = 0; i < fields.length; i++) {
      const key = fields[i][0], name = fields[i][1];
      fieldsContainer.appendChild(el("div", "edit-label", name));
      const ta = document.createElement("textarea");
      ta.className = "edit-textarea";
      ta.value = draftValues[key] || "";
      fieldsContainer.appendChild(makeRichToolbar(ta));
      attachPasteImage(ta);
      attachDropImage(ta);
      fieldsContainer.appendChild(ta);
      fieldInputs[key] = ta;
    }
  }
  subjectSel.addEventListener("change", () => {
    buildFields(subjectSel.value);
    rebuildChapterSelect(subjectSel.value, chapterSel.value);
  });
  buildFields(curSubj);
  rebuildChapterSelect(curSubj, src.chapter || "");
  body.appendChild(form);
  pop.appendChild(body);
  const footer = el("div", "popup-footer");
  const cancelBtn = el("button", "btn", "取消");
  const saveBtn = el("button", "btn", "保存");
  cancelBtn.addEventListener("click", () => ov.remove());
  saveBtn.addEventListener("click", () => {
    const title = titleInput.value.trim();
    if (!title) { confirmPopup("标题不能为空"); return; }
    let newId = idInput.value.trim();
    if (!newId) {
      if (originalId) {
        newId = originalId;
      } else {
        newId = buildCaseId(
          { subject: subjectSel.value, chapter: chapterSel.value || "", title: title },
          store.data, {}
        );
      }
    }
    if (newId !== originalId) {
      for (let i = 0; i < store.data.length; i++) {
        if (store.data[i].id === newId) { confirmPopup("ID「" + newId + "」已被占用，请换一个"); return; }
      }
    }
    syncCurrentToDraft();
    const starredText = starredInput.value.trim();
    const data = {
      id: newId, title: title,
      subject: subjectSel.value.trim() || SUBJECTS[0],
      chapter: chapterSel.value || "",
      frequency: freqSel.value, status: statusSel.value,
      starred: ["1", "true", "True", "是", "y", "Y"].indexOf(starredText) !== -1,
      tags: tagsInput.value.split(/[,，;；]/).map(t => t.trim()).filter(Boolean),
    };
    for (let i = 0; i < ALL_FIELDS.length; i++) data[ALL_FIELDS[i]] = String(draftValues[ALL_FIELDS[i]] || "").trim();
    for (const k in src) {
      if (k.indexOf("__") === 0 || k in data) continue;
      const v = src[k];
      if (typeof v === "string" || typeof v === "number" || typeof v === "boolean") data[k] = v;
    }
    saveItem(data, originalId);
    ov.remove();
  });
  footer.appendChild(cancelBtn); footer.appendChild(saveBtn);
  pop.appendChild(footer);
  ov.appendChild(pop);
  document.body.appendChild(ov);
  setTimeout(() => titleInput.focus(), 60);
}

function saveItem(data, originalId) {
  const lookupId = (originalId !== undefined && originalId !== null) ? originalId : data.id;
  let found = false;
  for (let i = 0; i < store.data.length; i++) {
    if (store.data[i].id === lookupId) { store.data[i] = data; found = true; break; }
  }
  if (!found) store.data.push(data);
  store.save();
  render();
}

  const imgNote = el("div", "gh-note", "");
  function refreshImgNote() {

    const base = imgBaseIn.value.trim() || ("https://cdn.jsdelivr.net/gh/" + (o || "owner") + "/" + (r || "repo") + "@" + b + "/");
    imgNote.textContent = "图片上传后，JSON 里只存相对路径（如 " + (imgDirIn.value.trim() || "images") + "/abc123.webp）。\n渲染时用 base URL 拼接：\n" + base;

  [{ value: "git", label: "Git Data API（≤100MB）" }, { value: "release", label: "Release Assets（≤2GB）" }].forEach(item => {
    const o = document.createElement("option"); o.value = item.value; o.textContent = item.label; modeSel.appendChild(o);
  });
  modeSel.value = cfg.upload_mode || "git";

  const modeNote = el("div", "gh-note", "");
  function refreshModeNote() {

    else modeNote.textContent = "Git Data API 模式：写入仓库 " + (pathIn.value || defPath) + "，可追溯。";
  }
  refreshModeNote();
  modeSel.addEventListener("change", refreshModeNote);
  pathIn.addEventListener("input", refreshModeNote);
  form.appendChild(modeNote);

  form.appendChild(el("div", "gh-section-title", "④ 数据内容"));
  const fileRow = el("div", "file-row");
  const fileBtn = el("button", "btn", "选择 .json");

  const fileIn = document.createElement("input");
  fileIn.type = "file"; fileIn.accept = ".json,application/json";
  const fileName = el("div", "file-name", "未选择文件");
  fileRow.appendChild(fileBtn); fileRow.appendChild(loadCurBtn); fileRow.appendChild(fileIn); fileRow.appendChild(fileName);
  form.appendChild(fileRow);

  form.appendChild(countEl);
  const statusEl = el("div", "gh-status", "");
  form.appendChild(statusEl);
  function setStatus(text, cls) { statusEl.textContent = text || ""; statusEl.className = "gh-status" + (cls ? " " + cls : ""); }
  function refreshCount() {
    const t = ta.value.trim();
    if (!t) { countEl.textContent = "尚未载入数据"; countEl.className = "gh-status"; return; }
    const parsed = parseFn(t);
    if (parsed.err) { countEl.textContent = "⚠ " + parsed.err; countEl.className = "gh-status err"; return; }

    if (parsed.warnings) msg += "，提示 " + parsed.warnings.length + " 条";
    msg += "，约 " + Math.round(JSON.stringify(parsed.items, null, 2).length / 1024) + " KB";

    reader.onload = () => { ta.value = String(reader.result || ""); refreshCount(); setStatus("已读取文件 " + f.name); };

  const testBtn = el("button", "btn", "测试连接");
  const uploadBtn = el("button", "btn", "上传数据");
  function readCfg() {
    const p = pathIn.value.trim() || defPath;
    const out = {
      owner: ownerIn.value.trim(), repo: repoIn.value.trim(),
      branch: branchIn.value.trim() || "main",
      path: p,
      token: tokenIn.value.trim(),
      message: msgIn.value.trim() || "更新数据",
      upload_mode: modeSel.value,
      image_dir: imgDirIn.value.trim() || "images",
      image_base_url: imgBaseIn.value.trim(),

    else if (isQ) out.questions_path = p;
    else out.cases_path = p;

  closeBtn.addEventListener("click", () => ov.remove());
  saveCfgBtn.addEventListener("click", () => { saveGhConfig(readCfg()); setStatus("✅ 配置已保存", "ok"); });
  testBtn.addEventListener("click", async () => {
    const c = readCfg();
    if (!c.owner || !c.repo) { setStatus("❌ 请填写 owner 和 repo", "err"); return; }
    if (!c.token) { setStatus("❌ 请填写 GitHub Token", "err"); return; }
    testBtn.disabled = true; setStatus("⏳ 正在测试连接…");
    try {
      const info = await ghTest(c);
      saveGhConfig(c);
      let msg = "✅ 连接成功：" + (info.full_name || (c.owner + "/" + c.repo)) + "\n默认分支：" + (info.default_branch || "?");
      if (info.permissions && info.permissions.push) msg += "\n✅ 写入权限正常";
      else msg += "\n⚠ 无法确认写入权限";
      setStatus(msg, "ok");
    } catch (e) { setStatus("❌ " + e.message, "err"); }
    finally { testBtn.disabled = false; }
  });
  uploadBtn.addEventListener("click", async () => {
    const text = ta.value.trim();
    if (!text) { setStatus("❌ 请先选择文件、粘贴 JSON 或点「载入当前」", "err"); return; }
    const parsed = parseFn(text);
    if (parsed.err) { setStatus("❌ " + parsed.err, "err"); return; }
    const c = readCfg();
    if (!c.owner || !c.repo) { setStatus("❌ 请填写 owner 和 repo", "err"); return; }
    if (!c.token) { setStatus("❌ 请填写 GitHub Token", "err"); return; }
    if (c.upload_mode === "git" && !c.path) { setStatus("❌ 请填写文件路径", "err"); return; }
    const jsonText = JSON.stringify(parsed.items, null, 2);
    const sizeKb = Math.round(jsonText.length / 1024);
    if (c.upload_mode === "git" && sizeKb > 70000) { setStatus("⚠ 数据约 " + sizeKb + " KB，超过约 70 MB。", "err"); return; }
    if (c.upload_mode === "release" && sizeKb > 1500000) { setStatus("⚠ 数据约 " + sizeKb + " KB，超过实用上限。", "err"); return; }
    saveGhConfig(c);
    uploadBtn.disabled = true; testBtn.disabled = true; saveCfgBtn.disabled = true;
    try {
      let okMsg = "";
      if (c.upload_mode === "release") {
        setStatus("⏳ 开始上传（Release Assets）…");
        const asset = await ghPutFileViaRelease(c, jsonText, defAsset, step => setStatus("⏳ " + step));
        okMsg = "✅ 上传成功：" + parsed.items.length + " " + unit + "（约 " + sizeKb + " KB）";
        if (asset && asset.browser_download_url) okMsg += "\n" + asset.browser_download_url;
      } else {
        setStatus("⏳ 开始上传（Git Data API）…");
        const res = await ghPutFileViaGitData(c, jsonText, step => setStatus("⏳ " + step));
        okMsg = "✅ 上传成功：" + parsed.items.length + " " + unit + "（约 " + sizeKb + " KB）";
        if (res && res.sha) okMsg += "\ncommit " + res.sha.slice(0, 7);
        if (res && res.html_url) okMsg += "\n" + res.html_url;
      }
      setStatus(okMsg, "ok");
      if (isP) { politicsStore.data = parsed.items; politicsStore.save(); renderPoliticsList(); }
      else if (isQ) { questionStore.data = parsed.items.map(normalizeQuestion); questionStore.save(); renderQuizListOnly(); rebuildQSubjectValues(); }
      else { store.data = parsed.items.map(normalizeItem); store.save(); render(); }
    } catch (e) {
      const hint = c.upload_mode === "release" ? "\n（若为 CORS 错误，可切换到 Git Data API 模式重试）" : "";
      setStatus("❌ 上传失败：" + e.message + hint, "err");
    } finally { uploadBtn.disabled = false; testBtn.disabled = false; saveCfgBtn.disabled = false; }
  });
  footer.appendChild(closeBtn); footer.appendChild(saveCfgBtn);
  footer.appendChild(testBtn); footer.appendChild(uploadBtn);
  pop.appendChild(footer);
  ov.appendChild(pop);
  document.body.appendChild(ov);
}

  form.appendChild(el("div", "edit-label", "或直接粘贴文本（可与文件叠加）"));
  const ta = document.createElement("textarea");
  ta.className = "import-textarea"; ta.style.minHeight = "140px";
  ta.placeholder = "把 PDF 里的文字、讲义、笔记粘贴到这里…";
  ta.spellcheck = false;
  form.appendChild(ta);

  const subjRow = el("div", "import-row");
  subjRow.appendChild(el("div", "row-label", "目标科目"));
  const subjSel = document.createElement("select");
  subjSel.className = "edit-select";
  SUBJECTS.forEach(s => { const o = document.createElement("option"); o.value = s; o.textContent = s; subjSel.appendChild(o); });
  subjRow.appendChild(subjSel);
  form.appendChild(subjRow);
  const chapRow = el("div", "import-row");
  chapRow.appendChild(el("div", "row-label", "统一指定章节"));
  const chapSel = document.createElement("select");
  chapSel.className = "edit-select";
  chapRow.appendChild(chapSel);
  form.appendChild(chapRow);
  function rebuildAiChapter(keepValue) {
    const sj = subjSel.value;
    const list = CHAPTER_WHITELIST[sj] || [];
    chapSel.innerHTML = "";

    chapSel.appendChild(otherOpt);
    const emptyOpt = document.createElement("option");
    emptyOpt.value = "__empty__"; emptyOpt.textContent = CHAPTER_EMPTY_LABEL;
    chapSel.appendChild(emptyOpt);
    setChapterSelValue(chapSel, list, keepValue);
  }
  if (SUBJECTS.indexOf(cfg.subject_target) !== -1) subjSel.value = cfg.subject_target;
  rebuildAiChapter(cfg.chapter_sel);
  subjSel.addEventListener("change", () => {
    rebuildAiChapter();
    saveAiConfig(readCfg());
  });
  chapSel.addEventListener("change", () => saveAiConfig(readCfg()));

  form.appendChild(el("div", "gh-section-title", (isQ ? "⑤" : "④") + " 生成结果"));
  const logEl = el("div", "gh-status", "");
  logEl.style.maxHeight = "120px"; logEl.style.overflow = "auto";
  form.appendChild(logEl);
  const outTa = document.createElement("textarea");
  outTa.className = "import-textarea"; outTa.style.minHeight = "160px";
  outTa.placeholder = "手动粘贴的文本生成结果会出现在这里，可手动编辑后再导入";
  outTa.spellcheck = false;
  form.appendChild(outTa);
  const countEl = el("div", "gh-status", "");
  form.appendChild(countEl);
  function log(msg) {
    logEl.textContent += (logEl.textContent ? "\n" : "") + msg;
    logEl.scrollTop = logEl.scrollHeight;
  }
  function setCount() {
    const t = outTa.value.trim();
    if (!t) { countEl.textContent = ""; return; }
    const p = isQ ? parseQuestionList(t) : parseJsonList(t);
    if (p.err) { countEl.textContent = "⚠ " + p.err; countEl.className = "gh-status err"; }
    else { countEl.textContent = "✅ " + p.items.length + " 条，约 " + Math.round(t.length / 1024) + " KB"; countEl.className = "gh-status ok"; }
  }
  outTa.addEventListener("input", setCount);

  async function ensureQueueText() {
    for (const item of fileQueue) {
      if (item.text) continue;
      item.status = "parsing";
      item.error = "";
      renderQueue();
      try {
        item.text = await extractTextFromFile(
          item.file,
          (pg, total, msg) => log("[" + item.name + "] " + (msg || ("解析第 " + pg + "/" + total + " 页"))),
          readOcrOpts()
        );
        item.status = "parsed";
        log("[" + item.name + "] 解析完成，共 " + item.text.length + " 字");
      } catch (e) {
        item.status = "error";
        item.error = e.message || "解析失败";
        item.text = "";
        log("❌ [" + item.name + "] " + item.error);
      }
      renderQueue();
    }
  }

  fileBtn.addEventListener("click", () => fileIn.click());
  clearFilesBtn.addEventListener("click", () => {
    if (!fileQueue.length) return;
    confirmPopup("清空文件列表？", () => {
      fileQueue.length = 0;
      fileInfo.textContent = "未选择";
      renderQueue();
    });
  });
  fileIn.addEventListener("change", () => {
    const files = Array.from(fileIn.files || []);
    if (!files.length) return;
    const stale = fileQueue.filter(f => f.status !== "success");
    const doAdd = () => {
      fileQueue.length = 0;
      for (const f of files) {
        fileQueue.push({
          id: genId(),
          file: f,
          name: f.name,
          status: "pending",
          text: "",
          jsonItems: null,
          jsonText: "",
          error: "",
        });
      }
      fileInfo.textContent = "共 " + fileQueue.length + " 个文件";
      renderQueue();
      fileIn.value = "";
    };
    if (stale.length) {
      confirmPopup(
        "队列里还有 " + stale.length + " 个未导入的文件：\n" +
        stale.map(f => "  · " + f.name).join("\n") +
        "\n\n选择新文件将清空这些旧文件。是否继续？",
        doAdd,
        "清空并添加",
        "替换文件队列"
      );
    } else {
      doAdd();
    }
  });

  body.appendChild(form);
  pop.appendChild(body);
  const footer = el("div", "popup-footer");
  const closeBtn = el("button", "btn", "关闭");
  const copyPrompt = el("button", "btn", "复制 Prompt");
  const saveCfgBtn = el("button", "btn", "保存配置");
  const genBtn = el("button", "btn", "开始生成");
  const importBtn = el("button", "btn", "导入结果");
  const importAllBtn = el("button", "btn", "全部导入");

  function readCfg() {
    const chValue = chapSel.value;
    const chOverride = chValue === "__keep__" ? null : (chValue === "__empty__" ? "" : chValue);
    const modelValue = currentModelValue();
    const tempRaw = parseFloat(tempIn.value);
    const maxRaw = parseInt(maxIn.value, 10);
    const chunkRaw = parseInt(chunkIn.value, 10);
    const overlapRaw = parseInt(overlapIn.value, 10);
    commitScheme(provSel.value);
    return {
      version: 2,
      active: provSel.value,
      provider: provSel.value.indexOf("custom:") === 0 ? "custom" : provSel.value,
      base_url: baseIn.value.trim(),
      model: modelValue,
      api_key: keyIn.value.trim(),
      providers: providers,
      custom_presets: customPresets,
      custom_models: customModels,
      temperature: isFinite(tempRaw) ? tempRaw : 0.2,
      max_tokens: isFinite(maxRaw) && maxRaw > 0 ? maxRaw : 8000,
      chunk_size: isFinite(chunkRaw) && chunkRaw > 0 ? chunkRaw : 5000,
      chunk_overlap: isFinite(overlapRaw) && overlapRaw >= 0 ? overlapRaw : 300,
      chapter_override: chOverride,
      subject_target: subjSel.value,
      chapter_sel: chValue,
    };
  }
  closeBtn.addEventListener("click", () => ov.remove());
  saveCfgBtn.addEventListener("click", () => { saveAiConfig(readCfg()); log("✅ 配置已保存"); });

  copyPrompt.addEventListener("click", async () => {
    copyPrompt.disabled = true;
    try {
      await ensureQueueText();
      const queueText = fileQueue.filter(f => f.text).map(f => f.text).join("\n\n");
      const text = [queueText, casePoolText, ta.value.trim()].filter(Boolean).join("\n\n");
      if (!text) { confirmPopup("请先添加文件、选择病例库或粘贴文本"); return; }
      const full = (isQ ? buildQuestionPrompt(subjSel.value) : buildCasePrompt(subjSel.value)) + "\n\n=====\n以下是医学资料：\n\n" + text;
      await copyText(full);
      logEl.textContent = "";
      log("📋 已复制 Prompt（含 " + text.length + " 字资料）");
      log("请到以下任一网页版粘贴：");
      log("  · https://chat.deepseek.com");
      log("  · https://chat.openai.com");
      log("  · https://kimi.moonshot.cn");
      log("  · https://chatglm.cn");
      log("");
      log("拿到返回 JSON 后，粘贴到下方「生成结果」框，再点「导入结果」即可。");
    } catch (e) { confirmPopup("复制失败：" + e.message); }
    finally { copyPrompt.disabled = false; }
  });

  function pendingCount() {
    let n = 0;
    for (const f of fileQueue) if (f.status === "pending") n++;
    return n;
  }

  async function runGeneration() {
    const provider = provSel.value;
    const preset = AI_PRESETS[provider];

    if (preset.manual) {
      genBtn.disabled = true;
      try {
        await ensureQueueText();
        const queueText = fileQueue.filter(f => f.text).map(f => f.text).join("\n\n");
        const text = [queueText, casePoolText, ta.value.trim()].filter(Boolean).join("\n\n");
        if (!text) { confirmPopup("请先添加文件、选择病例库或粘贴文本"); return; }
        const full = (isQ ? buildQuestionPrompt(subjSel.value) : buildCasePrompt(subjSel.value)) + "\n\n=====\n以下是医学资料：\n\n" + text;
        await copyText(full);
        logEl.textContent = "";
        log("📋 已复制 Prompt（含 " + text.length + " 字资料）");
        log("请到任意网页版 AI 粘贴，再把返回 JSON 贴到下方框。");
      } catch (e) { confirmPopup("复制失败：" + e.message); }
      finally { genBtn.disabled = false; }
      return;
    }

    const c = readCfg();
    if (!c.base_url) { confirmPopup("请填写 Base URL"); return; }
    if (!c.model && !preset.oc_server) { confirmPopup("请选择或填写模型名"); return; }
    if (preset.oc_server && c.model && c.model.indexOf("/") <= 0) { confirmPopup("opencode 模型名格式应为 provider/model（如 deepseek/deepseek-flash），留空则用服务器默认模型"); return; }
    if (!c.api_key && !preset.no_key && !preset.oc_server) { confirmPopup("请填写 API Key，或切换到「手动模式」"); return; }
    if (preset.cors === false) {
      confirmPopup("⚠ 该服务不支持浏览器直连（CORS）。\n\n建议：\n  1. 切换到 OpenRouter（含 DeepSeek 免费版）\n  2. 或自建代理后改填代理地址\n  3. 或改用「手动模式」");
      return;
    }

    saveAiConfig(c);
    logEl.textContent = ""; outTa.value = ""; setCount();
    genBtn.disabled = true; importBtn.disabled = true; importAllBtn.disabled = true; copyPrompt.disabled = true;

    try {
      log("本轮将处理 " + pendingCount() + " 个待生成文件" +
          (casePoolText ? "，以及病例库范围" : "") +
          (ta.value.trim() ? "，以及手动粘贴文本" : ""));

      for (let i = 0; i < fileQueue.length; i++) {
        const item = fileQueue[i];
        if (item.status !== "pending") continue;
        if (!item.text) {
          item.status = "parsing";
          item.error = "";
          renderQueue();
          try {
            item.text = await extractTextFromFile(
              item.file,
              (pg, total, msg) => log("[" + item.name + "] " + (msg || ("解析第 " + pg + "/" + total + " 页"))),
              readOcrOpts()
            );
            item.status = "parsed";
            log("[" + item.name + "] 解析完成，共 " + item.text.length + " 字");
          } catch (e) {
            item.status = "error";
            item.error = e.message || "解析失败";
            log("❌ [" + item.name + "] " + item.error);
            renderQueue();
            continue;
          }
          renderQueue();
        }
        item.status = "generating";
        renderQueue();
        log("[" + (i + 1) + "/" + fileQueue.length + "] " + item.name + " 调用 AI 中…");
        try {
          const items = await aiGenerate(
            { cfg: c, subject: subjSel.value, text: item.text },
            msg => { if (/完成|失败|解析出|合并去重|共切分|章节归一化/.test(msg)) log("[" + item.name + "] " + msg); },
            isQ
          );
          item.jsonItems = items;
          item.jsonText = JSON.stringify(items, null, 2);
          item.status = "success";
          log("✅ " + item.name + " 完成，共 " + items.length + " 条");
        } catch (e) {
          item.status = "error";
          item.error = e.message;
          log("❌ " + item.name + " 失败：" + e.message);
        }
        renderQueue();
        if (i < fileQueue.length - 1) await new Promise(r => setTimeout(r, 1500));
      }

      const manualSources = [];
      const taText = ta.value.trim();
      if (taText)           manualSources.push({ label: "手动粘贴", text: taText });
      if (casePoolText)     manualSources.push({ label: casePoolLabel || "病例库", text: casePoolText });

      const manualResults = [];
      for (let i = 0; i < manualSources.length; i++) {
        const m = manualSources[i];
        log("处理 " + m.label + "（约 " + Math.round(m.text.length / 1024) + " KB）…");
        try {
          const items = await aiGenerate(
            { cfg: c, subject: subjSel.value, text: m.text },
            msg => { if (/完成|失败|解析出|合并去重|共切分|章节归一化/.test(msg)) log("[" + m.label + "] " + msg); },
            isQ
          );
          manualResults.push(...items);
          log("✅ " + m.label + " 完成，共 " + items.length + " 条");
        } catch (e) {
          log("❌ " + m.label + " 失败：" + e.message);
        }
        if (i < manualSources.length - 1) await new Promise(r => setTimeout(r, 1200));
      }
      if (manualResults.length) {
        const seen = {};
        const merged = [];
        for (const it of manualResults) {
          const k = isQ ? aiQuestionKey(it) : String(it.title || "").trim();
          if (!k || seen[k]) continue;
          seen[k] = true;
          merged.push(it);
        }
        outTa.value = JSON.stringify(merged, null, 2);
        setCount();
        log("🎉 手动来源共 " + merged.length + " 条（去重后）");
      }
      if (!fileQueue.some(f => f.status === "pending") && !manualSources.length) {
        log("⚠ 没有可处理的内容（请在 ③ 选病例库，或上传文件 / 粘贴文本）");
      }
    } catch (e) {
      log("❌ " + e.message);
    } finally {
      genBtn.disabled = false; importBtn.disabled = false; importAllBtn.disabled = false; copyPrompt.disabled = false;
    }
  }

  genBtn.addEventListener("click", () => {
    const provider = provSel.value;
    const preset = AI_PRESETS[provider];
    if (preset.manual) { runGeneration(); return; }
    const peak = getPeakStatus(provider);
    if (peak.isPeak && peak.note) {
      confirmPopup(
        "当前为" + peak.label + "。\n" + peak.note + "\n\n" +
        "高峰期可能更慢、更容易触发限流" +
        (provider === "deepseek" ? "，且费用更高" : "") + "。\n" +
        "确定现在开始生成吗？",
        runGeneration,
        "继续生成",
        "⏰ 高峰提醒"
      );
      return;
    }
    runGeneration();
  });

  importAllBtn.addEventListener("click", () => {
    const c = readCfg();
    const successful = fileQueue.filter(f => f.status === "success" && f.jsonItems && f.jsonItems.length);
    if (!successful.length) { confirmPopup("没有可导入的成功结果"); return; }
    const seen = {};
    const allItems = [];
    for (const item of successful) {
      for (const it of item.jsonItems) {
        const key = isQ ? aiQuestionKey(it) : String(it.title || "").trim();
        if (!key || seen[key]) continue;
        seen[key] = true;
        allItems.push(it);
      }
    }
    if (!allItems.length) { confirmPopup("去重后没有有效条目"); return; }
    stripAiIds(allItems);
    const jsonText = JSON.stringify(allItems, null, 2);
    const p = isQ ? parseQuestionList(jsonText) : parseJsonList(jsonText);
    if (p.err) { confirmPopup("合并后的 JSON 不合法：" + p.err); return; }
    if (isQ) {
      const r = questionStore.importFromText(jsonText, "append", c.subject_target, c.chapter_override);
      if (!r.ok) { confirmPopup(r.msg); return; }
      renderQuizListOnly(); rebuildQSubjectValues();
      confirmPopup("已导入 " + allItems.length + " 条（去重后）\n" + r.msg);
    } else {
      const r = store.importFromText(jsonText, "append", c.subject_target, c.chapter_override);
      if (!r.ok) { confirmPopup(r.msg); return; }
      render();
      let msg = "已导入 " + allItems.length + " 条（去重后）\n" + r.msg;
      if (r.warnings.length) msg += "\n\n注意：\n" + r.warnings.slice(0, 5).join("\n");
      confirmPopup(msg);
    }
  });

  importBtn.addEventListener("click", () => {
    const c = readCfg();
    const t = outTa.value.trim();
    if (!t) { confirmPopup("还没有生成结果"); return; }
    const cleanText = stripIdsFromJsonText(t);
    const p = isQ ? parseQuestionList(cleanText) : parseJsonList(cleanText);
    if (p.err) { confirmPopup("结果不是合法 JSON：" + p.err); return; }
    ov.remove();
    if (isQ) {
      const result = questionStore.importFromText(cleanText, "append", c.subject_target, c.chapter_override);
      if (!result.ok) { confirmPopup(result.msg); return; }
      renderQuizListOnly(); rebuildQSubjectValues();
      confirmPopup(result.msg);
    } else {
      const result = store.importFromText(cleanText, "append", c.subject_target, c.chapter_override);
      if (!result.ok) { confirmPopup(result.msg); return; }
      render();
      let msg = result.msg;
      if (result.warnings.length) {
        msg += "\n\n注意：\n" + result.warnings.slice(0, 8).join("\n");
        if (result.warnings.length > 8) msg += "\n…… 共 " + result.warnings.length + " 条";
      }
      confirmPopup(msg);
    }
  });

  footer.appendChild(closeBtn); footer.appendChild(copyPrompt);
  footer.appendChild(saveCfgBtn); footer.appendChild(genBtn);
  footer.appendChild(importAllBtn); footer.appendChild(importBtn);
  pop.appendChild(footer);
  ov.appendChild(pop);
  document.body.appendChild(ov);
}

    });
    const otherOpt = document.createElement("option");
    otherOpt.value = CHAPTER_OTHER; otherOpt.textContent = CHAPTER_OTHER;
    chSel.appendChild(otherOpt);
    const emptyOpt = document.createElement("option");
    emptyOpt.value = "__empty__"; emptyOpt.textContent = CHAPTER_EMPTY_LABEL;
    chSel.appendChild(emptyOpt);
    setChapterSelValue(chSel, list, keepValue);
  }
  applyImportCfg(savedCfg, sjSel, rebuildQChapter);
  sjSel.addEventListener("change", () => {

  const exRow = el("div", "export-row");

  cancelBtn.addEventListener("click", () => ov.remove());
  function doImport(mode) {

    const chValue = chSel.value;

      msg += "\n本次作答：" + sessionDone + " 道";
      if (sessionDone > 0) msg += "\n本次答对：" + sessionCorrect + " / " + sessionDone + "（正确率 " + Math.round(sessionCorrect / sessionDone * 100) + "%）";
      confirmPopup(msg, () => { quizProgress.clear(); ov.remove(); }, "关闭", "刷题完成");
    }
  }
  function finishExam() {
    const used = opts.timer > 0 ? Math.max(0, opts.timer * 60 - remainRef.v) : Math.round((Date.now() - examStartTs) / 1000);
    quizProgress.clear();
    ov.remove();
    openExamResult({
      total: sessionDone, correct: sessionCorrect, timeUsed: used,
      subjects: sessionSubjects, wrongQs: sessionWrong,
    });
  }
  function goNext() {
    if (mode === "exam" && !answered) {
      const q = currentQ();
      if (q.type === "essay") {
        const ta = scroll.querySelector("textarea");
        if (ta) essayTexts[answerKey(q)] = ta.value;
        answerLog.record(answerKey(q), [], false, 0);
        sessionDone++;
        recordSession(q, false);
        checkin.add("q");
        answered = true;
        nextSub();
        return;
      }
      const ansArr = userAnswers[answerKey(q)] || [];
      const correct = judgeMulti(q, subIdx, ansArr);
      answerLog.record(answerKey(q), ansArr.slice(), correct, 0);
      sessionDone++;
      if (correct) sessionCorrect++;
      recordSession(q, correct);
      checkin.add("q");
      answered = true;
    }
    nextSub();
  }
  skipBtn.addEventListener("click", nextSub);
  submitBtn.addEventListener("click", submit);
  nextBtn.addEventListener("click", goNext);
  closeBtn.addEventListener("click", () => { saveProgress(); ov.remove(); });
  function toggleStar() {
    const q = currentQ();
    q.starred = !q.starred;
    questionStore.save();
    starBtn.textContent = q.starred ? "★" : "☆";
  }
  function toggleDoubt() {
    const q = currentQ();
    q.doubt = !q.doubt;
    questionStore.save();
    doubtBtn.textContent = q.doubt ? "❓✓" : "❓";
  }
  function readCurrent() {
    const q = currentQ();
    let text = getStem(q) + "。";
    const opts2 = getOpts(q);
    if (opts2.length) text += opts2.map(o => o.key + "，" + o.text).join("；") + "。";
    if (mode === "review" || answered) {
      text += "答案：" + getAnswer(q).join("、") + "。";
      const ex = getExplanation(q);
      if (ex) text += "解析：" + ex;
    }
    tts.lastText = text;
    tts.lastLabel = "第 " + (idx + 1) + " 题";
    tts.speak(text, tts.lastLabel);
  }
  starBtn.addEventListener("click", toggleStar);
  doubtBtn.addEventListener("click", toggleDoubt);
  readBtn.addEventListener("click", readCurrent);
  function onKey(e) {
    if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
    const q = currentQ();
    const kUp = e.key.toUpperCase();
    const optWrap = scroll.querySelector(".quiz-opts");
    const opts = optWrap ? Array.from(optWrap.children) : [];
    if (["A", "B", "C", "D", "E"].indexOf(kUp) !== -1) {
      const i = ["A", "B", "C", "D", "E"].indexOf(kUp);
      if (opts[i]) opts[i].click();
      e.preventDefault();
      return;
    }
    if (["1", "2", "3", "4", "5"].indexOf(kUp) !== -1) {
      const i = parseInt(kUp, 10) - 1;
      if (opts[i]) opts[i].click();
      e.preventDefault();
      return;
    }
    const sk = normalizeShortcutKey(e);
    const sc = state.shortcuts || {};
    if (sc.submit && sk === sc.submit) {
      if (!answered && mode !== "exam" && mode !== "review") submit();
      else goNext();
      e.preventDefault();
    } else if (sc.next && sk === sc.next) {
      e.preventDefault();
      goNext();
    } else if (sc.star && sk === sc.star) {
      e.preventDefault();
      toggleStar();
    } else if (sc.doubt && sk === sc.doubt) {
      e.preventDefault();
      toggleDoubt();
    } else if (sc.read && sk === sc.read) {
      e.preventDefault();
      readCurrent();
    }
  }
  document.addEventListener("keydown", onKey);
  if (mode === "exam") {
    examStartTs = Date.now();
    if (examTimer > 0) {
      let remain = examTimer * 60;
      remainRef.v = remain;
      timerEl.textContent = "⏱ " + formatDuration(remain);
      timerHandle = setInterval(() => {
        remain--;
        remainRef.v = Math.max(0, remain);
        timerEl.textContent = "⏱ " + formatDuration(remain);
        if (remain <= 0) {
          clearInterval(timerHandle);
          confirmPopup("考试时间到！点击查看本次考试结果。", () => finishExam());
        }
      }, 1000);
    }
  }
  ov.appendChild(pop);
  document.body.appendChild(ov);
  render();
  const autoSave = setInterval(saveProgress, 5000);
  const origCleanup = function () {
    document.removeEventListener("keydown", onKey);
    if (timerHandle) clearInterval(timerHandle);
    clearInterval(autoSave);
  };
  const origRemove = ov.remove.bind(ov);
  ov.remove = function () { origCleanup(); origRemove(); };
}

  const startBtn = el("button", "btn", "开始刷题");
  cancelBtn.addEventListener("click", () => ov.remove());
  startBtn.addEventListener("click", () => {
    state.qSubject = sjSel.value;
    state.qType = tpSel.value;
    state.quizScope = scSel.value;
    state.quizMode = mdSel.value;
    state.quizCount = parseInt(cntIn.value, 10) || 20;
    state.optionShuffle = shufSel.value === "on";
    saveSettings();
    document.getElementById("qSubjectSel").value = state.qSubject;
    document.getElementById("qTypeSel").value = state.qType;
    let pool = questionStore.data.slice();
    if (state.qSubject !== "全部") pool = pool.filter(q => q.subject === state.qSubject);
    if (state.qType !== "全部") pool = pool.filter(q => q.type === state.qType);
    if (state.quizScope === "wrong") pool = pool.filter(q => answerStatusFor(q).anyWrong);
    else if (state.quizScope === "unanswered") pool = pool.filter(q => !answerStatusFor(q).answered);
    if (!pool.length) { confirmPopup("该筛选下没有题目"); return; }
    ov.remove();
    openQuiz(pool, { mode: state.quizMode, scope: state.quizScope, count: state.quizCount, shuffle: state.optionShuffle });
  });
  footer.appendChild(cancelBtn); footer.appendChild(startBtn);
  pop.appendChild(footer);
  ov.appendChild(pop);
  document.body.appendChild(ov);
}

/* =========================================================

function openWrongBook() {
  const wrongIds = answerLog.wrongIds();
  const wrongs = questionStore.data.filter(q => wrongIds.indexOf(q.id) !== -1);
  const ov = el("div", "overlay");
  const pop = el("div", "popup popup-sm");
  pop.appendChild(el("div", "popup-title", "错题本（" + wrongs.length + " 题）"));
  const body = el("div", "popup-body");
  const footer = el("div", "popup-footer");
  if (!wrongs.length) {
    body.appendChild(el("div", "empty-note", "暂无错题 🎉"));
    const closeBtn = el("button", "btn", "关闭");
    closeBtn.addEventListener("click", () => ov.remove());
    footer.appendChild(closeBtn);
  } else {
    const tabRow = el("div", "record-tabs");
    const groups = [
      { id: "subject", label: "按科目" },
      { id: "chapter", label: "按章节" },
      { id: "count", label: "按错误次数" },
      { id: "recent", label: "最近 7 天" },
    ];
    let curGroup = "subject";
    const tabs = {};
    groups.forEach(g => {
      const b = el("button", "record-tab" + (g.id === curGroup ? " active" : ""), g.label);
      tabs[g.id] = b;
      b.addEventListener("click", () => {
        curGroup = g.id;
        Object.keys(tabs).forEach(k => tabs[k].classList.toggle("active", k === curGroup));
        renderGroup();
      });
      tabRow.appendChild(b);
    });
    body.appendChild(tabRow);
    const listBox = el("div", "drug-result-list");
    body.appendChild(listBox);
    function stemOf(q) {
      if (q.type === "B") return (q.subQuestions[0] && q.subQuestions[0].stem) || "B型题";
      if (q.type === "A3") return q.caseStem || "病例串题";
      return q.stem;
    }
    function addListItem(q) {
      const item = el("div", "drug-result-item");
      const stem = stemOf(q) || "";
      item.appendChild(el("span", "dt", stem.slice(0, 40) + (stem.length > 40 ? "…" : "")));
      item.appendChild(el("span", "ds", "错 " + Math.max(1, answerStatusFor(q).wrongCount) + " 次"));
      item.addEventListener("click", () => { ov.remove(); openQuiz([q]); });
      listBox.appendChild(item);
    }
    function renderGroup() {
      listBox.innerHTML = "";
      if (curGroup === "subject" || curGroup === "chapter") {
        const groupsMap = {};
        const keyFn = curGroup === "subject" ? (q => q.subject) : (q => q.chapter || "（未填章节）");
        wrongs.forEach(q => { const k = keyFn(q); if (!groupsMap[k]) groupsMap[k] = []; groupsMap[k].push(q); });
        Object.keys(groupsMap).sort().forEach(k => {
          listBox.appendChild(el("div", "gh-section-title", k + "（" + groupsMap[k].length + "）"));
          groupsMap[k].forEach(addListItem);
        });
      } else if (curGroup === "count") {
        wrongs.slice().sort((a, b) => answerStatusFor(b).wrongCount - answerStatusFor(a).wrongCount).forEach(addListItem);
      } else if (curGroup === "recent") {
        const cutoff = Date.now() - 7 * 86400000;
        const recent = wrongs.filter(q => answerStatusFor(q).lastAt > cutoff);
        if (!recent.length) { listBox.appendChild(el("div", "empty-note", "最近 7 天没有错题")); return; }
        recent.forEach(addListItem);
      }
    }
    renderGroup();
    const srsAddBtn = el("button", "btn", "⏰ 加入复习");
    const pdfBtn = el("button", "btn", "🖨 PDF");
    const csvBtn = el("button", "btn", "📄 Anki");
    const clearBtn = el("button", "btn", "清空记录");
    const quizBtn = el("button", "btn", "重做全部");
    const closeBtn = el("button", "btn", "关闭");
    srsAddBtn.addEventListener("click", () => {
      wrongs.forEach(q => { for (let i = 0; i < questionSubCount(q); i++) srs.makeDue(srs.keyFor(q, i)); });
      srs.save();
      confirmPopup("已将 " + wrongs.length + " 题加入复习队列（立即到期，可点首页「⏰ 复习」开始）");
    });
    pdfBtn.addEventListener("click", () => { printDocument(buildWrongPrintDocument(wrongs)); });
    csvBtn.addEventListener("click", () => { exportQuestionsCsv(wrongs); });
    clearBtn.addEventListener("click", () => { answerLog.reset(); ov.remove(); confirmPopup("已清空所有答题记录"); });
    quizBtn.addEventListener("click", () => { ov.remove(); openQuiz(wrongs); });
    closeBtn.addEventListener("click", () => ov.remove());
    footer.appendChild(srsAddBtn); footer.appendChild(pdfBtn); footer.appendChild(csvBtn);
    footer.appendChild(clearBtn); footer.appendChild(quizBtn); footer.appendChild(closeBtn);
  }
  pop.appendChild(footer);
  ov.appendChild(pop);
  document.body.appendChild(ov);
}

    const pct = Math.round(v.correct / v.total * 100);
    const row = el("div", "heat-row");
    row.appendChild(el("div", "heat-label", QUIZ_TYPES[k] || k));
    const bar = el("div", "heat-bar");
    const fill = el("div", "heat-fill");
    fill.style.width = pct + "%";
    fill.style.background = pct >= 80 ? "#4dcc66" : pct >= 60 ? "#f2c433" : pct >= 40 ? "#ff9933" : "#d62828";
    bar.appendChild(fill);
    row.appendChild(bar);
    row.appendChild(el("div", "heat-pct", pct + "% (" + v.correct + "/" + v.total + ")"));

   考研政治 · 记忆卡

function normalizePoliticsCard(raw, defaultCategory) {
  if (!raw || typeof raw !== "object" || Array.isArray(raw)) return null;
  const question = String(raw.question || raw.front || raw.q || raw["问题"] || raw["题目"] || "").trim();
  const answer = String(raw.answer || raw.back || raw.a || raw["答案"] || raw["解析"] || "").trim();
  if (!question || !answer) return null;
  let category = String(raw.category || raw["分类"] || raw["类别"] || raw.subject || "").trim();
  if (!category) category = defaultCategory || "其他";
  let tags = raw.tags;
  if (typeof tags === "string") tags = tags.split(/[,，、;；\s]+/);
  if (!Array.isArray(tags)) tags = [];
  tags = tags.map(t => String(t).trim()).filter(Boolean).slice(0, 20);
  return {
    id: String(raw.id || "").trim(),
    category: category,
    question: question,
    answer: answer,
    tags: tags,
    starred: !!raw.starred,
    created: Number(raw.created) || Date.now(),
    updated: Number(raw.updated) || Date.now(),
  };
}

const politicsStore = {
  data: [],
  load() {
    let raw = null;
    try { raw = localStorage.getItem(POLITICS_KEY); } catch (e) {}
    if (raw == null) {
      this.data = POLITICS_BUILTIN.map(c => normalizePoliticsCard(c, "其他")).filter(Boolean);
      this.save();
      return;
    }
    try {
      const parsed = JSON.parse(raw);
      const arr = Array.isArray(parsed) ? parsed : (parsed && Array.isArray(parsed.cards) ? parsed.cards : []);
      this.data = arr.map(c => normalizePoliticsCard(c, "其他")).filter(Boolean);
    } catch (e) { this.data = []; }
    this._ensureIds();
  },
  _ensureIds() {
    const seen = {};
    for (const c of this.data) {
      if (!c.id || seen[c.id]) c.id = "p_" + genId();
      seen[c.id] = 1;
    }
  },
  save() { try { localStorage.setItem(POLITICS_KEY, JSON.stringify(this.data)); } catch (e) {} },
  add(card) { this.data.push(card); this.save(); },
  update(id, changes) {
    for (let i = 0; i < this.data.length; i++) {
      if (this.data[i].id === id) {
        this.data[i] = Object.assign({}, this.data[i], changes, { updated: Date.now() });
        this.save();
        return true;
      }
    }
    return false;
  },
  remove(id) {
    this.data = this.data.filter(c => c.id !== id);
    this.save();
    politicsSrs.remove(id);
  },
  clear() { this.data = []; this.save(); },
  restoreBuiltins() {
    const have = {};
    for (const c of this.data) have[c.id] = 1;
    let added = 0;
    for (const b of POLITICS_BUILTIN) {
      if (have[b.id]) continue;
      this.data.push(normalizePoliticsCard(b, "其他"));
      added++;
    }
    if (added) this.save();
    return added;
  },
};

const politicsSrs = {
  data: {},
  load() {
    this.data = {};
    try {
      const raw = localStorage.getItem(POLITICS_SRS_KEY);
      if (raw) {
        const o = JSON.parse(raw);
        if (o && typeof o === "object" && !Array.isArray(o)) this.data = o;
      }
    } catch (e) { this.data = {}; }
  },
  save() { try { localStorage.setItem(POLITICS_SRS_KEY, JSON.stringify(this.data)); } catch (e) {} },
  get(id) { return this.data[id] || null; },
  remove(id) { if (this.data[id]) { delete this.data[id]; this.save(); } },
  reset() { this.data = {}; this.save(); },
  schedule(id, grade) {
    const now = Date.now();
    const r = this.data[id] || { ease: 2.5, ivl: 0, reps: 0, lapses: 0, due: 0, last: 0, reviews: 0 };
    if (grade <= 0) {
      r.lapses = (r.lapses || 0) + 1;
      r.reps = 0;
      r.ease = Math.max(1.3, Math.round((r.ease - 0.2) * 100) / 100);
      r.ivl = 0;
      r.due = now + 10 * 60 * 1000;
    } else if (grade === 1) {
      r.ivl = !r.reps ? 1 : Math.max(1, Math.round((r.ivl || 1) * 0.6));
      r.ease = Math.max(1.3, Math.round((r.ease - 0.15) * 100) / 100);
      r.reps = (r.reps || 0) + 1;
      r.due = now + r.ivl * 86400000;
    } else {
      if (!r.reps) r.ivl = grade >= 3 ? 4 : 2;
      else if (r.reps === 1) r.ivl = grade >= 3 ? 8 : 5;
      else r.ivl = Math.max(1, Math.round((r.ivl || 1) * r.ease * (grade === 3 ? 1.3 : 1)));
      r.ease = clamp(Math.round((r.ease + (grade >= 3 ? 0.15 : 0.05)) * 100) / 100, 1.3, 2.8);
      r.reps = (r.reps || 0) + 1;
      r.due = now + r.ivl * 86400000;
    }
    r.last = now;
    r.reviews = (r.reviews || 0) + 1;
    this.data[id] = r;
    this.save();
    return r;
  },
  stateOf(card) {
    const r = this.data[card.id];
    if (!r) return "new";
    if ((r.due || 0) <= Date.now()) return "due";
    if ((r.reps || 0) >= 2 && (r.ivl || 0) >= 7) return "mastered";
    return "sched";
  },
  stateLabel(st) {
    return st === "new" ? "新卡" : st === "due" ? "待复习" : st === "mastered" ? "已掌握" : "已安排";
  },
  nextText(card) {
    const r = this.data[card.id];
    if (!r) return "未学习";
    const diff = (r.due || 0) - Date.now();
    if (diff <= 0) return "现在复习";
    const mins = Math.ceil(diff / 60000);
    if (mins < 60) return mins + " 分钟后";
    const hours = Math.ceil(diff / 3600000);
    if (hours < 24) return hours + " 小时后";
    return Math.ceil(diff / 86400000) + " 天后";
  },
  reviewCount(card) {
    const r = this.data[card.id];
    return r ? (r.reviews || r.reps || 0) : 0;
  },
  dueCount() {
    let n = 0;
    for (const c of politicsStore.data) {
      const r = this.data[c.id];
      if (r && (r.due || 0) <= Date.now()) n++;
    }
    return n;
  },
  newCount() {
    let n = 0;
    for (const c of politicsStore.data) if (!this.data[c.id]) n++;
    return n;
  },
  masteredCount() {
    let n = 0;
    for (const c of politicsStore.data) {
      const r = this.data[c.id];
      if (r && (r.reps || 0) >= 2 && (r.ivl || 0) >= 7) n++;
    }
    return n;
  },
  todayReviewed() {
    const today = formatDate(new Date());
    let n = 0;
    for (const c of politicsStore.data) {
      const r = this.data[c.id];
      if (r && r.last && formatDate(new Date(r.last)) === today) n++;
    }
    return n;
  },
};

function politicsKeywordMatches(card, kw) {
  const s = [card.question, card.answer, card.category, (card.tags || []).join(" ")].join(" ").toLowerCase();
  if (s.indexOf(kw) !== -1) return true;
  if (kw.length >= 2 && /^[a-z0-9]+$/.test(kw)) {
    const py = pyInitials(card.question + " " + card.category + " " + (card.tags || []).join(" ")).toLowerCase();
    if (py.indexOf(kw) !== -1) return true;
    if (kw.length >= 3 && isSubsequence(kw, py)) return true;
  }
  return false;
}
function politicsStateRank(st) {
  return st === "due" ? 0 : st === "new" ? 1 : st === "sched" ? 2 : 3;
}
function rebuildPoliticsCategoryValues() {
  const sel = document.getElementById("pCategorySel");
  if (!sel) return;
  const counts = {};
  for (const c of politicsStore.data) counts[c.category] = (counts[c.category] || 0) + 1;
  const values = [{ value: "全部", label: "全部类别" }];
  for (const cat of POLITICS_CATEGORIES) if (counts[cat]) values.push({ value: cat, label: withCount(cat, counts[cat]) });
  for (const cat of Object.keys(counts).sort()) if (POLITICS_CATEGORIES.indexOf(cat) === -1) values.push({ value: cat, label: withCount(cat, counts[cat]) });
  updateSelectOptions(sel, values);
  const names = values.map(v => v.value);
  if (state.pCategory !== "全部" && names.indexOf(state.pCategory) === -1) { state.pCategory = "全部"; saveSettings(); }
  sel.value = state.pCategory;
}
function getFilteredPolitics() {
  let data = politicsStore.data.slice();
  if (state.pCategory !== "全部") data = data.filter(c => c.category === state.pCategory);
  if (state.pFilter === "due") data = data.filter(c => politicsSrs.stateOf(c) === "due");
  else if (state.pFilter === "new") data = data.filter(c => politicsSrs.stateOf(c) === "new");
  else if (state.pFilter === "mastered") data = data.filter(c => politicsSrs.stateOf(c) === "mastered");
  else if (state.pFilter === "starred") data = data.filter(c => c.starred);
  if (state.pSearch) {
    const kws = String(state.pSearch).toLowerCase().split(/\s+/).filter(Boolean);
    data = data.filter(c => {
      for (let i = 0; i < kws.length; i++) if (!politicsKeywordMatches(c, kws[i])) return false;
      return true;
    });
  }
  data.sort((a, b) => {
    const sa = politicsSrs.stateOf(a), sb = politicsSrs.stateOf(b);
    const r = politicsStateRank(sa) - politicsStateRank(sb);
    if (r) return r;
    const ra = politicsSrs.get(a.id), rb = politicsSrs.get(b.id);
    const da = ra ? (ra.due || 0) : (a.created || 0);
    const db = rb ? (rb.due || 0) : (b.created || 0);
    if (da !== db) return da - db;
    if (!!a.starred !== !!b.starred) return a.starred ? -1 : 1;
    return String(a.question).localeCompare(String(b.question), "zh");
  });
  return data;
}

function parsePoliticsCardsText(text, defaultCategory) {
  const out = { items: [], error: "" };
  const raw = String(text || "").trim();
  if (!raw) { out.error = "请输入要导入的内容"; return out; }
  const first = raw.charAt(0);
  if (first === "[" || first === "{") {
    try {
      const parsed = JSON.parse(raw);
      const arr = Array.isArray(parsed) ? parsed : (parsed && Array.isArray(parsed.cards) ? parsed.cards : (parsed && typeof parsed === "object" ? [parsed] : null));
      if (!arr) { out.error = "JSON 结构无法识别，应为数组或 {cards:[...]}"; return out; }
      for (const item of arr) {
        const card = normalizePoliticsCard(item, defaultCategory);
        if (card) out.items.push(card);
      }
      if (!out.items.length) out.error = "没有解析出有效卡片（题目和答案都不能为空）";
      return out;
    } catch (e) {
      out.error = "JSON 解析失败：" + e.message;
      return out;
    }
  }
  if (/^[ \t]*(?:Q|问|题目)[:：]/im.test(raw)) {
    const blocks = raw.split(/\n\s*\n/);
    for (const block of blocks) {
      if (!block.trim()) continue;
      let question = "", answer = "", category = "", tags = "", mode = "";
      for (const line of block.split("\n")) {
        let m = line.match(/^[ \t]*(?:Q|问|题目)[:：]\s*(.*)$/i);
        if (m) { mode = "q"; question += (question ? "\n" : "") + m[1]; continue; }
        m = line.match(/^[ \t]*(?:A|答|答案)[:：]\s*(.*)$/i);
        if (m) { mode = "a"; answer += (answer ? "\n" : "") + m[1]; continue; }
        m = line.match(/^[ \t]*(?:分类|类别|科目)[:：]\s*(.*)$/);
        if (m) { category = m[1].trim(); continue; }
        m = line.match(/^[ \t]*标签[:：]\s*(.*)$/);
        if (m) { tags = m[1].trim(); continue; }
        if (mode === "q") question += "\n" + line;
        else if (mode === "a") answer += "\n" + line;
      }
      const card = normalizePoliticsCard({ question: question, answer: answer, category: category, tags: tags }, defaultCategory);
      if (card) out.items.push(card);
    }
    if (!out.items.length) out.error = "没有解析出有效卡片";
    return out;
  }
  for (const line of raw.split("\n")) {
    const t = line.trim();
    if (!t || /^[#/]/.test(t)) continue;
    const parts = t.split(/\s*\|\s*|\t+/).map(function (s) { return s.trim(); });
    if (parts.length < 2) continue;
    const card = normalizePoliticsCard({ question: parts[0], answer: parts[1], category: parts[2] || "", tags: parts[3] || "" }, defaultCategory);
    if (card) out.items.push(card);
  }
  if (!out.items.length) out.error = "没有解析出有效卡片。支持 JSON，或每行「问题 | 答案 | 分类 | 标签」；也支持 Q：/A：分块。";
  return out;
}

    else data = data.filter(d => d.chapter === state.chapter);
  }
  if (state.status !== "全部") data = data.filter(d => d.status === state.status);
  if (state.tag !== "全部") data = data.filter(d => (d.tags || []).indexOf(state.tag) !== -1);
  if (state.starredOnly) data = data.filter(d => d.starred);
  if (state.search) {
    const q = parseSearchQuery(state.search);
    if (q.subject) data = data.filter(d => String(d.subject || "").indexOf(q.subject) !== -1);
    if (q.chapter) data = data.filter(d => String(d.chapter || "").indexOf(q.chapter) !== -1);
    if (q.status) data = data.filter(d => String(d.status || "") === q.status);
    if (q.tag) data = data.filter(d => (d.tags || []).indexOf(q.tag) !== -1);
    if (q.frequency) {
      const t = (String(q.frequency).match(/★/g) || []).length || parseInt(q.frequency, 10) || 0;

    }

      data = data.filter(d => !!d.starred === y);
    }
    if (q.keywords.length) {

function renderList() {

  if (!filtered.length) list.appendChild(el("div", "empty-hint", store.data.length ? "没有匹配的条目" : EMPTY_HINT));
  else for (let i = 0; i < filtered.length; i++) list.appendChild(makeItemCard(filtered[i]));
  const total = store.data.length;
  let starred = 0;
  for (let i = 0; i < store.data.length; i++) if (store.data[i].starred) starred++;

function confirmDelete(item) {
  confirmPopup("确定删除「" + (item.title || "") + "」？", function () {

}

  const pool = getFiltered();
  if (!pool.length) { confirmPopup("当前筛选下没有可抽取的条目"); return; }

function saveScroll() {
  const s = document.getElementById("listScroll"); if (!s) return;
  const max = s.scrollHeight - s.clientHeight;
  state.scrollY = max > 0 ? 1 - (s.scrollTop / max) : 1.0;
  saveSettings();
}
function restoreScroll() {
  const s = document.getElementById("listScroll"); if (!s) return;
  const max = s.scrollHeight - s.clientHeight;
  if (max > 0) {
    const y = Number(state.scrollY);
    s.scrollTop = (1 - clamp(isFinite(y) ? y : 1.0, 0, 1)) * max;

function openBigRecord() {
  const pool = getFiltered();
  if (!pool.length) { confirmPopup("当前筛选下没有可用于生成病历的条目"); return; }
  const item = rndPick(pool);
  const ov = el("div", "overlay");
  const pop = el("div", "popup popup-lg");
  pop.appendChild(el("div", "popup-title", "病历 · " + (item.title || "")));
  const body = el("div", "popup-body");
  const scroll = el("div", "detail-scroll");
  const wrap = el("div", "big-record");
  wrap.appendChild(el("div", "br-title", "住 院 病 历（模拟）"));
  wrap.appendChild(el("div", "br-sub", "疾病相关内容摘自病例条目原文"));
  const name = rndPick(RECORD_SURNAMES) + "××";
  const sex = Math.random() < 0.5 ? "男" : "女";
  const age = rndInt(20, 75);
  const today = formatDate(new Date());
  const fields = getFieldsForSubject(item.subject);
  const secs = [
    ["一、一般项目", ["姓名：" + name + "　　性别：" + sex + "　　年龄：" + age + "岁", "职业：" + rndPick(RECORD_JOBS) + "　　入院日期：" + today]],
    ["二、主诉", [item.title || "（待补充）"]],
  ];
  let n = 3;
  fields.forEach(([k, label]) => {
    const v = String(item[k] || "").trim();
    if (!v) return;
    secs.push([(CN_NUM[n - 1] || String(n)) + "、" + label, [v]]);

  closeBtn.addEventListener("click", () => ov.remove());
  copyBtn.addEventListener("click", () => copyText(wrap.textContent).then(() => confirmPopup("已复制")).catch(e => confirmPopup("失败：" + e.message)));
  footer.appendChild(closeBtn); footer.appendChild(copyBtn);
  pop.appendChild(footer);
  ov.appendChild(pop);
  document.body.appendChild(ov);

  const pop = el("div", "popup popup-sm");
  pop.appendChild(el("div", "popup-title", title || "请选择"));
  const body = el("div", "popup-body");

  if (kw.length >= 3 && isSubsequence(kw, s)) return true;
  if (kw.length >= 4 && approxContains(String(d.title || "").toLowerCase(), kw, 1)) return true;
  return false;
}
function keywordMatchesQuestion(q, kw) {
  const s = getQuestionSearchText(q);
  if (s.indexOf(kw) !== -1) return true;
  if (String(q.id || "").toLowerCase().indexOf(kw) !== -1) return true;
  if (kw.length >= 2 && /^[a-z0-9]+$/.test(kw)) {
    const py = getQuestionPyText(q);
    if (py.indexOf(kw) !== -1) return true;
    if (kw.length >= 3 && isSubsequence(kw, py)) return true;
    const ex = ABBR_MAP[kw.toUpperCase()];
    if (ex && s.indexOf(ex.toLowerCase()) !== -1) return true;
  }
  if (kw.length >= 3 && isSubsequence(kw, s)) return true;
  return false;
}
function currentSearchKeywords() {
  const q = parseSearchQuery(state.search || "");
  return (q.keywords || []).map(k => String(k).toLowerCase()).filter(Boolean);

function hlTextHtml(text, kws) {
  let s = escapeHtml(String(text == null ? "" : text));
  if (kws && kws.length) {
    const parts = s.split(/(<[^>]*>)/);
    for (let i = 0; i < parts.length; i += 2) {
      if (!parts[i]) continue;
      for (const kw of kws) {
        if (!kw) continue;
        try { parts[i] = parts[i].replace(new RegExp(escapeRegExp(kw), "gi"), m => '<span class="srch-hl">' + m + '</span>'); } catch (e) {}
      }
    }
    s = parts.join("");
  }
  return s;
}

/* ---------- 富文本剥离（TTS / CSV 用） ---------- */
function stripRichMarkup(s) {
  return String(s == null ? "" : s)
    .replace(/\|\s*(?=[^|\n]*\|)/g, "、")
    .replace(/^\s*\|/gm, "").replace(/\|\s*$/gm, "")
    .replace(/^#+\s*/gm, "")
    .replace(/@([^|\n]*)\|/g, "$1：")
    .replace(/[=!@$*_~^`]/g, "")
    .replace(/\(\s*\)/g, "")
    .replace(/\n{2,}/g, "\n");
}

function titleBigrams(s) {
  const set = Object.create(null);
  const t = String(s || "");
  for (let i = 0; i + 1 < t.length; i++) set[t.slice(i, i + 2)] = 1;
  return set;
}
function relatedCasesFor(item, limit) {
  const out = [];
  const tags = {};
  (item.tags || []).forEach(t => { tags[t] = true; });
  const bt = titleBigrams(item.title);
  for (const d of store.data) {
    if (d.id === item.id) continue;
    let s = 0;
    if (d.subject === item.subject) s += 2;
    if (item.chapter && d.chapter === item.chapter) s += 3;
    for (const t of (d.tags || [])) if (tags[t]) s += 2;
    if (d.subject === item.subject) {
      const bg = titleBigrams(d.title);
      let inter = 0;
      for (const g in bt) if (bg[g]) inter++;
      if (inter >= 2) s += inter;
    }
    if (s >= 4) out.push({ d, s });
  }
  out.sort((a, b) => b.s - a.s);
  return out.slice(0, limit || 6).map(x => x.d);
}

/* ---------- 8) AI 追问 / 全库问答 ---------- */
function ragTokens(query) {
  const out = [];
  const parts = String(query || "").split(/[\s,，。;；、？！?!/]+/).filter(Boolean);
  for (const p of parts) {
    if (/[\u4e00-\u9fff]/.test(p)) {
      if (p.length >= 2) {
        if (out.indexOf(p) === -1) out.push(p);
        for (let i = 0; i + 2 <= p.length; i++) {
          const bg = p.slice(i, i + 2);
          if (out.indexOf(bg) === -1) out.push(bg);
        }
      }
    } else if (p.length >= 2) {
      if (out.indexOf(p.toLowerCase()) === -1) out.push(p.toLowerCase());
    }
  }
  return out.slice(0, 24);
}
function ragRetrieve(query, k) {
  const toks = ragTokens(query);
  if (!toks.length) return [];
  const scored = [];
  for (const d of store.data) {
    const title = String(d.title || "").toLowerCase();
    let score = 0;
    const s = getSearchText(d);
    for (const t of toks) {
      if (title.indexOf(t) !== -1) score += 5;
      else if (s.indexOf(t) !== -1) score += 1;
    }
    if (score > 0) scored.push({ d, score });
  }
  scored.sort((a, b) => b.score - a.score);
  return scored.slice(0, k || 4).map(x => x.d);
}

/* ---------- 11) 病例卡片分享图 ---------- */
function wrapCanvasText(ctx, text, maxWidth, maxLines) {
  const lines = [];
  let cur = "";
  for (const ch of String(text || "")) {
    if (ch === "\n") { lines.push(cur); cur = ""; if (lines.length >= maxLines) break; continue; }
    if (ctx.measureText(cur + ch).width > maxWidth) { lines.push(cur); cur = ch; if (lines.length >= maxLines) break; }
    else cur += ch;
  }
  if (lines.length < maxLines && cur) lines.push(cur);
  if (lines.length >= maxLines) lines[maxLines - 1] = lines[maxLines - 1].slice(0, Math.max(0, lines[maxLines - 1].length - 1)) + "…";
  return lines;
}
function buildCardCanvas(item) {
  return new Promise((resolve, reject) => {
    try {
      const W = 900;
      const pad = 48;
      const c = document.createElement("canvas");
      const ctx = c.getContext("2d");
      ctx.font = "600 40px 'Noto Sans SC','PingFang SC',sans-serif";
      const titleLines = wrapCanvasText(ctx, item.title || "未命名病例", W - pad * 2, 2);
      const fields = getFieldsForSubject(item.subject).filter(([k]) => String(item[k] || "").trim());
      const picks = [];
      let used = 0;
      for (const [k, label] of fields) {
        const v = stripRichMarkup(String(item[k] || "").trim());
        if (!v) continue;
        picks.push([label, v]);
        used += Math.min(3, Math.ceil(v.length / 34));
        if (used >= 18 || picks.length >= 8) break;
      }
      ctx.font = "24px 'Noto Sans SC','PingFang SC',sans-serif";
      let bodyH = 0;
      const prepared = picks.map(([label, v]) => {
        const lines = wrapCanvasText(ctx, v, W - pad * 2 - 170, 3);
        bodyH += Math.max(1, lines.length) * 36 + 18;
        return { label, lines };
      });
      const headH = 60 + titleLines.length * 52 + 46;
      const H = Math.min(2600, headH + bodyH + 120 + 90);
      c.width = W; c.height = H;
      const x = c.getContext("2d");
      x.fillStyle = "#f4f6fa"; x.fillRect(0, 0, W, H);
      const color = SUBJECT_COLORS[item.subject] || "#1a4db3";
      x.fillStyle = color; x.fillRect(0, 0, W, headH);
      x.fillStyle = "rgba(255,255,255,.16)"; x.beginPath(); x.arc(W - 60, 40, 120, 0, Math.PI * 2); x.fill();
      x.fillStyle = "#fff";
      x.font = "700 44px 'Noto Sans SC','PingFang SC',sans-serif";
      titleLines.forEach((l, i) => x.fillText(l, pad, 84 + i * 54));
      x.font = "24px 'Noto Sans SC','PingFang SC',sans-serif";
      x.fillStyle = "rgba(255,255,255,.92)";
      const meta = [item.subject || "", item.chapter || "", item.frequency || ""].filter(Boolean).join(" · ");
      x.fillText(meta, pad, 84 + titleLines.length * 54 + 8);
      let y = headH + 48;
      x.font = "24px 'Noto Sans SC','PingFang SC',sans-serif";
      for (const p of prepared) {
        x.fillStyle = "#1a4db3";
        x.font = "700 24px 'Noto Sans SC','PingFang SC',sans-serif";
        x.fillText(p.label, pad, y + 24);
        x.fillStyle = "#20242c";
        x.font = "24px 'Noto Sans SC','PingFang SC',sans-serif";
        p.lines.forEach((l, i2) => x.fillText(l, pad + 170, y + 24 + i2 * 36));
        y += Math.max(1, p.lines.length) * 36 + 18;
        if (y > H - 150) break;
      }
      x.fillStyle = "rgba(0,0,0,.06)"; x.fillRect(0, H - 84, W, 84);
      x.fillStyle = "#5a6072"; x.font = "22px 'Noto Sans SC','PingFang SC',sans-serif";
      x.fillText("考研西医综合 306 · 病例速查", pad, H - 34);
      x.textAlign = "right";
      x.fillText(item.id || "", W - pad, H - 34);
      x.textAlign = "left";
      resolve(c);
    } catch (e) { reject(e); }
  });
}

function csvEscape(v) {
  v = String(v == null ? "" : v);
  if (/[",\n]/.test(v)) return '"' + v.replace(/"/g, '""') + '"';
  return v;
}
function downloadCsv(filename, text) {
  const blob = new Blob(["\uFEFF" + text], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 600);
}

const notifyMgr = {
  _t: null,
  supported() { return typeof window !== "undefined" && "Notification" in window; },
  async requestPermission() {
    if (!this.supported()) return false;
    try { return (await Notification.requestPermission()) === "granted"; } catch (e) { return false; }
  },
  flag() { try { return localStorage.getItem(NOTIFY_FLAG_KEY) || ""; } catch (e) { return ""; } },
  setFlag(v) { try { localStorage.setItem(NOTIFY_FLAG_KEY, v); } catch (e) {} },
  show(title, body) {
    try {
      if (navigator.serviceWorker && navigator.serviceWorker.ready) {
        navigator.serviceWorker.ready.then(reg => {
          try { reg.showNotification(title, { body: body, icon: "icons/icon.svg", badge: "icons/icon.svg" }); } catch (e) {}
        }).catch(() => {});
        return;
      }
    } catch (e) {}
    try { new Notification(title, { body: body }); } catch (e) {}
  },
  check() {
    if (!state.notifyEnabled) return;
    const now = new Date();
    const hm = String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
    if (hm < state.notifyTime) return;
    const today = formatDate(now);
    if (this.flag() === today) return;
    const due = srs.dueCount();
    const pDue = politicsSrs.dueCount();
    const ts = checkin.todayStats();
    const quizLeft = Math.max(0, state.dailyQuizGoal - ts.q);
    if (due > 0 || quizLeft > 0 || pDue > 0) {
      this.setFlag(today);
      const parts = [];
      if (due > 0) parts.push("今日待复习 " + due + " 题");
      if (pDue > 0) parts.push("政治记忆待复习 " + pDue + " 张");
      if (quizLeft > 0) parts.push("刷题还差 " + quizLeft + " 题");
      this.show("⏰ 学习提醒", parts.join("，") + "，加油！");
    }
  },
  start() {
    this.stop();
    this.check();
    this._t = setInterval(() => this.check(), 60000);
  },
  stop() { if (this._t) { clearInterval(this._t); this._t = null; } },
};

function normalizeShortcutKey(e) {
  if (e.key === " ") return "Space";
  return e.key.length === 1 ? e.key.toLowerCase() : e.key;
}
function prettyShortcutKey(k) {
  if (k === "Space") return "空格";
  if (k === "Enter") return "回车";
  if (k === "ArrowLeft") return "←";
  if (k === "ArrowRight") return "→";
  return String(k || "");
}
function openKbEditor() {
  const ov = el("div", "overlay");

  const inputs = {};
  let capturing = null;
  function onCapture(e) {
    if (!capturing) return;
    e.preventDefault(); e.stopPropagation();
    const k = normalizeShortcutKey(e);
    if (e.key === "Escape") { capturing.value = prettyShortcutKey(state.shortcuts[capturing.dataset.k]); capturing = null; return; }
    if (SHORTCUT_BLOCKED.indexOf(String(k).toLowerCase()) !== -1) { capturing.value = "已被占用，换一个"; return; }
    const key = capturing.dataset.k;
    for (const a of SHORTCUT_ACTIONS) if (a[0] !== key && state.shortcuts[a[0]] === k) state.shortcuts[a[0]] = "";
    state.shortcuts[key] = k;
    saveSettings();
    capturing.value = prettyShortcutKey(k);
    capturing = null;
  }

    inp.dataset.k = key;
    inp.addEventListener("focus", () => { capturing = inp; inp.value = "按下新键…"; });
    inp.addEventListener("blur", () => { if (capturing === inp) capturing = null; inp.value = prettyShortcutKey(state.shortcuts[key]); });
    inp.addEventListener("keydown", onCapture);
    inputs[key] = inp;

}

/* =========================================================
   OCR 修正词表编辑器
   ========================================================= */
function openOcrFixEditor() {
  const ov = el("div", "overlay");
  const pop = el("div", "popup popup-lg");
  pop.appendChild(el("div", "popup-title", "OCR 修正词表"));
  const body = el("div", "popup-body");
  body.appendChild(el("div", "hint-text",
    "每行一条，格式：错误 → 正确\n" +
    "例如：心肌梗寒→心肌梗死\n" +
    "保存后仅影响后续 OCR 结果（已识别文本不会被改动）。"));
  const userFix = loadUserFix();
  const lines = Object.keys(userFix).map(k => k + "→" + userFix[k]).join("\n");
  const ta = document.createElement("textarea");
  ta.className = "import-textarea";
  ta.style.minHeight = "260px";
  ta.placeholder = "心肌梗寒→心肌梗死\n肺气肿肿→肺气肿\n(支持中英文混排，每行一条)";
  ta.value = lines;
  body.appendChild(ta);
  body.appendChild(el("div", "gh-note",
    "内置词表（可被下方覆盖）：\n" +
    Object.keys(MED_FIX_BUILTIN).slice(0, 12).map(k => k + "→" + MED_FIX_BUILTIN[k]).join("　")));
  pop.appendChild(body);
  const footer = el("div", "popup-footer");
  const cancelBtn = el("button", "btn", "取消");
  const resetBtn = el("button", "btn", "恢复默认");
  const saveBtn = el("button", "btn", "保存");
  cancelBtn.addEventListener("click", () => ov.remove());
  resetBtn.addEventListener("click", () => { ta.value = ""; });
  saveBtn.addEventListener("click", () => {
    const dict = {};
    const rows = ta.value.split("\n");
    for (let r of rows) {
      r = r.trim();
      if (!r) continue;
      let sep = r.indexOf("→");
      if (sep === -1) sep = r.indexOf("->");
      if (sep === -1) sep = r.indexOf("=>");
      if (sep === -1) continue;
      let k = r.slice(0, sep).trim();
      let v = r.slice(sep + 1).replace(/^[->]/, "").trim();
      if (k && v) dict[k] = v;
    }
    saveUserFix(dict);
    ov.remove();
    confirmPopup("已保存 " + Object.keys(dict).length + " 条修正规则");
  });
  footer.appendChild(cancelBtn); footer.appendChild(resetBtn); footer.appendChild(saveBtn);
  pop.appendChild(footer);
  ov.appendChild(pop);
  document.body.appendChild(ov);
}

/* =========================================================
   通用确认弹窗
   ========================================================= */
function confirmPopup(text, onYes, yesText, title) {
  if (yesText === undefined) yesText = "确定";
  if (title === undefined) title = "提示";
  const ov = el("div", "overlay");
  const pop = el("div", "popup popup-sm");
  pop.appendChild(el("div", "popup-title", title));
  const body = el("div", "popup-body");
  body.appendChild(el("div", "confirm-msg", text));
  pop.appendChild(body);
  const footer = el("div", "popup-footer");
  if (typeof onYes === "function") {
    const no = el("button", "btn", "取消");
    const yes = el("button", "btn", yesText);
    no.addEventListener("click", () => ov.remove());
    yes.addEventListener("click", () => { ov.remove(); onYes(); });
    footer.appendChild(no); footer.appendChild(yes);
  } else {
    const ok = el("button", "btn", "知道了");
    ok.addEventListener("click", () => ov.remove());
    footer.appendChild(ok);
  }
  pop.appendChild(footer);
  ov.appendChild(pop);
  document.body.appendChild(ov);
  return ov;
}

      new Promise((_, reject) => setTimeout(() => reject(new Error("数据加载超时")), 5000))
    ]);
  } catch (e) { if (!Array.isArray(store.data)) store.data = []; if (!Array.isArray(questionStore.data)) questionStore.data = []; }

  if (state.autoPull) {
    await Promise.all([
      pullFromRemote("cases", true),
      pullFromRemote("questions", true),
    ]);
  }
  bindEvents();
  refreshSrsBtn();
  try { notifyMgr.start(); } catch (e) {}
  window.addEventListener("focus", refreshSrsBtn);
  document.getElementById("starBtn").textContent = state.starredOnly ? "★ 收藏" : "☆ 收藏";
  document.getElementById("sortSel").value = state.sort;
  document.getElementById("statusSel").value = state.status;
  document.getElementById("subjectSel").value = state.subject;
  rebuildQSubjectValues();
  document.getElementById("qTypeSel").value = state.qType;
  document.getElementById("qSubjectSel").value = state.qSubject;
  document.getElementById("pFilterSel").value = state.pFilter;
  setMode(state.mode || "cases");
  requestAnimationFrame(() => { restoreScroll(); setTimeout(restoreScroll, 120); });
}

if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register("sw.js").catch(function () {});
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
else init();
</script>
</body>
</html>
