<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>西医综合306病例速查 & 刷题</title>
<style>
:root {
  --bg:#fff; --text:#1f1f1f; --sub:#737373; --title:#1a4db3;
  --input-bg:#f5f5f5; --input-fg:#1f1f1f; --input-hint:#8c8c8c;
  --panel:#ededed; --btn-bg:#e6e6eb; --btn-fg:#1f1f1f;
  --divider:#d9d9d9; --hl:#ff8800; --overlay:rgba(0,0,0,0.45);
  --font-scale:1;
}
html[data-theme="dark"] {
  --bg:#1c1c21; --text:#e6e6e6; --sub:#9e9e9e; --title:#73b8ff;
  --input-bg:#33333d; --input-fg:#ebebeb; --input-hint:#8c8c8c;
  --panel:#2b2b36; --btn-bg:#3d3d47; --btn-fg:#ebebeb;
  --divider:#4d4d57; --hl:#ff8800; --overlay:rgba(0,0,0,0.65);
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; padding:0; height:100%; overflow:hidden; }
body {
  font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Heiti SC",sans-serif;
  font-size:calc(16px * var(--font-scale, 1));
  background:var(--bg); color:var(--text); transition:background .15s, color .15s;
}
button, input, select, textarea { font-family:inherit; color:inherit; }
#app { display:flex; flex-direction:column; height:100vh; height:100dvh; padding:8px; gap:6px; }
.app-title { flex:none; height:34px; line-height:34px; text-align:center; font-size:1.15em; font-weight:600; color:var(--title); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.filter-row { flex:none; display:flex; gap:6px; height:44px; }
.filter-row > * { flex:1; min-width:0; }
select {
  font-size:.875em; background:var(--btn-bg); color:var(--btn-fg);
  border:1px solid var(--divider); border-radius:4px; padding:0 6px;
  height:100%; width:100%; outline:none; cursor:pointer;
  appearance:none; -webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 14px) calc(50% - 2px),calc(100% - 9px) calc(50% - 2px);
  background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-right:24px;
}
select option { background:var(--bg); color:var(--text); }
input[type=text], input[type=password], textarea {
  font-size:.9375em; background:var(--input-bg); color:var(--input-fg);
  border:1px solid var(--divider); border-radius:4px; padding:0 10px; outline:none; width:100%;
}
textarea { padding:8px 10px; resize:none; line-height:1.5; }
textarea.drag-over { outline:2px dashed var(--title); outline-offset:-2px; background:rgba(26,77,179,0.06); }
#searchInput, #qSearchInput, #pSearchInput { flex:none; height:42px; font-size:.9375em; }
.btn-row { flex:none; display:flex; gap:6px; height:40px; }
.btn {
  flex:1; min-width:0; font-size:.875em; padding:6px 8px;
  border:1px solid var(--divider); border-radius:4px;
  background:var(--btn-bg); color:var(--btn-fg); cursor:pointer;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:filter .1s;
}
.btn:hover { filter:brightness(1.08); }
.btn:active { filter:brightness(.92); }
.btn:disabled { opacity:.5; cursor:not-allowed; }
.btn.active { background:var(--title); color:#fff; border-color:var(--title); }
#statLabel { flex:none; height:22px; line-height:22px; font-size:.8125em; color:var(--sub); padding-left:2px; }
#listScroll { flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; position:relative; }
#listLayout { display:flex; flex-direction:column; gap:6px; padding-bottom:4px; }
#backToTop {
  position:fixed; right:16px; bottom:88px; width:44px; height:44px;
  border-radius:50%; border:1px solid var(--divider);
  background:var(--btn-bg); color:var(--title);
  font-size:1.2em; font-weight:700; cursor:pointer;
  box-shadow:0 4px 12px rgba(0,0,0,.25); display:none;
  align-items:center; justify-content:center; z-index:500;
}
#backToTop.show { display:flex; }
.item-card { display:flex; height:62px; border-radius:4px; overflow:hidden; flex:none; box-shadow:0 1px 3px rgba(0,0,0,.15); }
.status-bar { width:8px; flex:none; }
.item-main { flex:1; min-width:0; display:flex; align-items:center; gap:6px; padding:0 8px 0 14px; color:#fff; cursor:pointer; }
.item-main:focus { outline:2px solid #fff; outline-offset:-3px; }
.item-title { flex:1; min-width:0; font-size:1em; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.item-status { flex:none; padding:3px 9px; border:none; border-radius:10px; font-size:.72em; font-weight:600; color:#fff; background:rgba(0,0,0,.3); cursor:pointer; white-space:nowrap; }
.item-star { flex:none; border:none; padding:4px; background:transparent; color:rgba(255,255,255,.55); font-size:1.15em; cursor:pointer; line-height:1; }
.item-star.on { color:#ffd700; }
.empty-hint { white-space:pre-line; text-align:center; padding:60px 20px; color:var(--sub); font-size:.9375em; line-height:1.8; }
.overlay { position:fixed; inset:0; background:var(--overlay); display:flex; align-items:center; justify-content:center; z-index:1000; padding:4px; animation:fadeIn .12s; }
@keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
.popup { display:flex; flex-direction:column; background:var(--bg); border-radius:8px; box-shadow:0 12px 40px rgba(0,0,0,.45); overflow:hidden; max-height:96vh; max-width:96vw; }
.popup-lg { width:96vw; max-width:900px; height:94vh; }
.popup-sm { width:88vw; max-width:460px; max-height:80vh; }
.popup-title { flex:none; padding:10px 14px; font-size:1.05em; font-weight:600; color:var(--title); border-bottom:1px solid var(--divider); text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.popup-body { flex:1; min-height:0; padding:12px; display:flex; flex-direction:column; gap:10px; overflow:hidden; }
.popup-sm .popup-body { overflow-y:auto; }
.popup-footer { flex:none; display:flex; gap:8px; padding:10px 12px; border-top:1px solid var(--divider); flex-wrap:wrap; }
.popup-footer .btn { min-height:38px; flex:1; min-width:60px; }
.confirm-msg { white-space:pre-wrap; line-height:1.7; font-size:.9375em; word-break:break-word; overflow-y:auto; max-height:50vh; }
.detail-meta { flex:none; font-size:.8125em; color:var(--sub); line-height:1.8; word-break:break-word; padding:2px 0; }
.detail-ctrl { flex:none; display:flex; gap:6px; height:38px; }
.detail-scroll { flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:6px; padding-right:2px; }
.field-row { flex:none; border:1px solid var(--divider); border-radius:4px; overflow:hidden; background:var(--panel); }
.field-header { display:flex; align-items:center; gap:8px; padding:4px 6px; min-height:38px; }
.field-toggle { flex:none; width:64px; font-size:.8125em; padding:5px 4px; border:1px solid var(--divider); border-radius:4px; background:var(--btn-bg); color:var(--btn-fg); cursor:pointer; }
.field-label { flex:1; min-width:0; font-size:.9375em; font-weight:600; color:var(--title); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.field-content { padding:0 10px 10px 10px; font-size:.875em; line-height:1.65; white-space:pre-wrap; word-break:break-word; color:var(--text); }
.hl { color:var(--hl); font-weight:600; }
.field-other-header { flex:none; margin-top:12px; padding:6px 4px 2px 4px; font-size:.8125em; font-weight:700; color:var(--sub); border-top:1px dashed var(--divider); }
.status-badge { display:inline-block; padding:1px 10px; border-radius:10px; font-size:.92em; font-weight:600; color:#fff; vertical-align:middle; }
.status-未看 { background:#999; }
.status-需复习 { background:#ff9933; }
.status-已掌握 { background:#4dcc66; }
.star-badge { display:inline-block; padding:1px 10px; border-radius:10px; font-size:.92em; font-weight:600; background:#ffaa33; color:#fff; vertical-align:middle; }
.star-badge.off { background:var(--btn-bg); color:var(--sub); border:1px solid var(--divider); }
.empty-note { text-align:center; padding:40px 10px; color:var(--sub); font-size:.875em; }
.edit-form { flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:5px; padding-right:4px; }
.edit-label { font-size:.875em; color:var(--text); padding-top:6px; font-weight:500; }
.edit-input { height:44px; flex:none; }
.edit-textarea { min-height:110px; flex:none; font-size:.875em; }
.edit-select { height:44px; flex:none; }
.hint-text { flex:none; font-size:.875em; color:var(--text); }
.import-textarea { flex:1; min-height:120px; font-size:.75em; font-family:ui-monospace,Menlo,Consolas,monospace; }
.import-row { flex:none; display:flex; align-items:center; gap:8px; height:42px; }
.row-label { flex:none; width:38%; font-size:.8125em; color:var(--text); }
.import-row .edit-select { flex:1; height:42px; }
.export-row { flex:none; display:flex; align-items:center; gap:8px; height:42px; }
.export-row .edit-select { flex:1; height:42px; }
.export-info { flex:none; font-size:.8125em; color:var(--sub); }
.export-textarea { flex:1; min-height:120px; font-size:.75em; font-family:ui-monospace,Menlo,Consolas,monospace; }
.settings-row { flex:none; display:flex; align-items:center; gap:8px; min-height:46px; }
.settings-row .row-label { flex:none; width:38%; }
.settings-row > .btn, .settings-row > .edit-select { flex:1; height:44px; }
.font-wrap { flex:1; display:flex; align-items:center; gap:6px; height:44px; }
.font-wrap .btn { flex:1; height:44px; }
.font-label { flex:none; width:60px; text-align:center; font-size:.875em; color:var(--text); }
.settings-info { flex:none; white-space:pre-line; font-size:.75em; line-height:1.7; color:var(--sub); padding:8px 2px; }
::-webkit-scrollbar { width:8px; height:8px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--divider); border-radius:4px; }

.rich-hl { background:#fff3a0; color:#7a4a00; padding:0 4px; border-radius:3px; font-weight:600; }
html[data-theme=dark] .rich-hl { background:#6a5b00; color:#ffe680; }
.rich-danger { color:#d62828; font-weight:700; }
html[data-theme=dark] .rich-danger { color:#ff6b6b; }
.rich-key { color:#1a6dd6; font-weight:700; }
html[data-theme=dark] .rich-key { color:#73b8ff; }
.rich-bold { font-weight:700; }
.rich-sup { font-size:.75em; vertical-align:super; line-height:0; }
.rich-sub { font-size:.75em; vertical-align:sub; line-height:0; }
.rich-strike { text-decoration:line-through; color:var(--sub); }
.rich-underline { text-decoration:underline; text-underline-offset:3px; }
.rich-italic { font-style:italic; }
.rich-code { font-family:ui-monospace,Menlo,Consolas,monospace; background:var(--btn-bg); padding:1px 5px; border-radius:3px; font-size:.9em; color:var(--title); }
.rich-hr { border:none; border-top:1px dashed var(--divider); margin:8px 0; }
.rich-quote { display:block; border-left:3px solid var(--title); background:var(--panel); padding:4px 10px; margin:4px 0; font-style:italic; color:var(--sub); border-radius:0 4px 4px 0; }
.rich-list { display:block; padding-left:16px; margin:2px 0; position:relative; }
.rich-list::before { content:"•"; position:absolute; left:4px; color:var(--title); font-weight:bold; }
.rich-fold-header { display:block; font-weight:700; color:var(--title); font-size:1.05em; border-bottom:1px solid var(--divider); padding-bottom:2px; margin-top:10px; }
.rich-link { color:var(--title); cursor:pointer; text-decoration:underline dotted; font-weight:600; }
.rich-abbr { border-bottom:1px dotted var(--title); cursor:help; font-weight:600; color:var(--title); }
.rich-drug { color:#b83bbf; cursor:pointer; font-weight:700; text-decoration:underline dashed; text-underline-offset:3px; }
html[data-theme=dark] .rich-drug { color:#e187e7; }
.rich-timeline { list-style:none; padding:4px 0 4px 20px; margin:6px 0; border-left:2px solid var(--title); position:relative; }
.rich-tl-item { position:relative; padding:4px 0 6px 12px; font-size:.9em; line-height:1.6; }
.rich-tl-item::before { content:""; position:absolute; left:-26px; top:10px; width:10px; height:10px; border-radius:50%; background:var(--title); border:2px solid var(--bg); box-shadow:0 0 0 1px var(--title); }
.rich-tl-node { display:inline-block; font-weight:700; color:var(--title); margin-right:8px; padding:1px 8px; background:var(--btn-bg); border-radius:10px; font-size:.85em; }
.rich-img-wrap { display:block; text-align:center; margin:8px 0; }
.rich-img-wrap .rich-img { display:inline-block; max-width:100%; height:auto; border-radius:6px; border:1px solid var(--divider); cursor:zoom-in; background:var(--panel); }
.rich-img-caption { display:block; font-size:.82em; color:var(--sub); margin-top:4px; text-align:center; }
.rich-table { border-collapse:collapse; width:100%; margin:6px 0; font-size:.95em; }
.rich-table th, .rich-table td { border:1px solid var(--divider); padding:4px 8px; text-align:left; vertical-align:top; word-break:break-word; }
.rich-table th { background:var(--btn-bg); color:var(--title); font-weight:600; }
.rich-table tr:nth-child(even) td { background:rgba(0,0,0,0.02); }
html[data-theme=dark] .rich-table tr:nth-child(even) td { background:rgba(255,255,255,0.03); }
.img-preview-overlay { position:fixed; inset:0; background:rgba(0,0,0,.92); display:flex; align-items:center; justify-content:center; z-index:2000; padding:16px; cursor:zoom-out; }
.img-preview-overlay img { max-width:100%; max-height:100%; object-fit:contain; border-radius:4px; }
.img-preview-hint { position:absolute; top:12px; left:50%; transform:translateX(-50%); font-size:.8em; color:rgba(255,255,255,.6); pointer-events:none; }

.rich-toolbar { display:flex; gap:4px; flex:none; padding:3px 0 4px; align-items:center; flex-wrap:wrap; }
.rich-toolbar::before { content:"标记："; font-size:.72em; color:var(--sub); padding-right:2px; }
.rich-btn { flex:none; font-size:.72em; font-weight:600; padding:3px 8px; border:1px solid var(--divider); border-radius:3px; background:var(--btn-bg); color:var(--btn-fg); cursor:pointer; line-height:1.3; transition:filter .1s; }
.rich-btn:hover { filter:brightness(1.1); }
.rich-btn.hl { background:#fff3a0; color:#7a4a00; border-color:#e0c860; }
html[data-theme=dark] .rich-btn.hl { background:#6a5b00; color:#ffe680; border-color:#8a7a10; }
.rich-btn.danger { background:#ffd8d8; color:#b00000; border-color:#e0a0a0; }
html[data-theme=dark] .rich-btn.danger { background:#5a1a1a; color:#ff9e9e; border-color:#7a2a2a; }
.rich-btn.key { background:#d8e8ff; color:#0044aa; border-color:#a0c0e0; }
html[data-theme=dark] .rich-btn.key { background:#1a3a5a; color:#9ecbff; border-color:#2a4a6a; }
.rich-btn.bold { font-weight:800; }
.rich-btn.block { background:var(--panel); color:var(--sub); border-color:var(--divider); }
.rich-btn.img { background:#ffe8cc; color:#8a4400; border-color:#e0b880; }
html[data-theme=dark] .rich-btn.img { background:#4a2a00; color:#ffbb66; border-color:#6a3a10; }
.rich-btn.drug { background:#f5d8ff; color:#7a008a; border-color:#d0a0e0; }
html[data-theme=dark] .rich-btn.drug { background:#3a1a4a; color:#dba0ff; border-color:#5a2a6a; }
.rich-btn.tl { background:#d8ffe0; color:#006622; border-color:#90d0a0; }
html[data-theme=dark] .rich-btn.tl { background:#1a3a22; color:#90e0a0; border-color:#2a5a3a; }

.gh-section-title { flex:none; font-size:.875em; font-weight:600; color:var(--title); padding:10px 0 2px; margin-top:4px; border-top:1px solid var(--divider); }
.gh-section-title:first-child { border-top:none; margin-top:0; padding-top:0; }
.gh-textarea { flex:none !important; height:200px; min-height:140px; }
.file-row { flex:none; display:flex; align-items:center; gap:8px; height:42px; }
.file-row .btn { flex:none; padding:0 12px; height:42px; }
.file-row input[type=file] { display:none; }
.file-name { flex:1; min-width:0; font-size:.8125em; color:var(--sub); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.gh-status { flex:none; font-size:.8125em; line-height:1.7; color:var(--sub); white-space:pre-wrap; word-break:break-word; padding:4px 2px; user-select:text; }
.gh-status.ok { color:#2e9e4a; }
html[data-theme=dark] .gh-status.ok { color:#63d97f; }
.gh-status.err { color:#d62828; }
html[data-theme=dark] .gh-status.err { color:#ff6b6b; }
.gh-note { flex:none; font-size:.75em; line-height:1.7; color:var(--sub); padding:4px 2px; }

.img-tab-row { display:flex; gap:4px; flex:none; }
.img-tab { flex:1; padding:6px; font-size:.78em; font-weight:600; border:1px solid var(--divider); border-radius:4px; background:var(--btn-bg); color:var(--btn-fg); cursor:pointer; text-align:center; white-space:nowrap; }
.img-tab.active { background:var(--title); color:#fff; border-color:var(--title); }
.img-preview-box { flex:none; min-height:120px; max-height:220px; border:1px dashed var(--divider); border-radius:4px; display:flex; align-items:center; justify-content:center; background:var(--panel); overflow:hidden; }
.img-preview-box img { max-width:100%; max-height:220px; display:block; }
.img-preview-box .empty { color:var(--sub); font-size:.8125em; }

.drug-result-list { flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:6px; }
.drug-result-item { padding:8px 10px; border:1px solid var(--divider); border-radius:4px; background:var(--panel); cursor:pointer; font-size:.875em; display:flex; align-items:center; gap:8px; }
.drug-result-item:hover { filter:brightness(1.08); }
.drug-result-item .dt { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; color:var(--title); }
.drug-result-item .ds { flex:none; font-size:.75em; color:var(--sub); }

.subject-hint { flex:none; font-size:.75em; color:var(--sub); padding:2px 0 4px; line-height:1.6; }

.ai-info-card { flex:none; padding:8px 10px; border:1px solid var(--divider); border-radius:6px; background:var(--panel); font-size:.8125em; line-height:1.7; display:flex; flex-direction:column; gap:3px; }
.ai-info-free { color:#2e9e4a; font-weight:600; }
html[data-theme=dark] .ai-info-free { color:#63d97f; }
.ai-info-note { color:var(--sub); white-space:pre-line; }
.ai-info-warn { color:#d62828; font-weight:600; white-space:pre-line; margin-top:2px; }
html[data-theme=dark] .ai-info-warn { color:#ff6b6b; }
.ai-info-link { color:var(--title); font-weight:600; text-decoration:underline dotted; margin-top:3px; align-self:flex-start; }

.ai-peak-badge { font-weight:600; padding:3px 8px; border-radius:4px; font-size:.9em; }
.ai-peak-badge.peak { background:rgba(214,40,40,.15); color:#d62828; }
.ai-peak-badge.offpeak { background:rgba(77,204,102,.15); color:#2e9e4a; }
html[data-theme=dark] .ai-peak-badge.peak { background:rgba(255,107,107,.18); color:#ff6b6b; }
html[data-theme=dark] .ai-peak-badge.offpeak { background:rgba(99,217,127,.18); color:#63d97f; }

.ai-info-stats { display:flex; align-items:center; flex-wrap:wrap; gap:4px; color:var(--sub); }
.ai-balance-row { display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin-top:3px; }
.ai-balance-out { font-size:.92em; color:var(--sub); word-break:break-all; }
.ai-balance-out.ok { color:#2e9e4a; font-weight:600; }
.ai-balance-out.err { color:#d62828; }
html[data-theme=dark] .ai-balance-out.ok { color:#63d97f; }
html[data-theme=dark] .ai-balance-out.err { color:#ff6b6b; }

.merged-timeline-section { flex:none; margin-top:16px; padding:10px; border:1px solid var(--divider); border-radius:6px; background:var(--panel); }
.merged-timeline-title { font-size:.9375em; font-weight:700; color:var(--title); margin-bottom:10px; padding-bottom:6px; border-bottom:1px solid var(--divider); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.merged-timeline-count { font-size:.75em; font-weight:500; color:var(--sub); background:var(--btn-bg); padding:1px 8px; border-radius:10px; }
.merged-timeline { position:relative; padding-left:22px; }
.merged-timeline::before { content:""; position:absolute; left:7px; top:5px; bottom:5px; width:2px; background:linear-gradient(to bottom, var(--title), var(--divider)); }
.mt-item { position:relative; margin-bottom:14px; }
.mt-item:last-child { margin-bottom:0; }
.mt-item::before { content:""; position:absolute; left:-19px; top:4px; width:8px; height:8px; border-radius:50%; background:var(--title); border:2px solid var(--panel); box-shadow:0 0 0 1px var(--title); }

  ["马原", "商品的二因素是什么？", "商品是用来交换的劳动产品，具有使用价值和价值两个因素。\n使用价值是商品的自然属性，是价值的物质承担者；\n价值是凝结在商品中的无差别的人类劳动，是商品的社会属性。\n商品是使用价值和价值的矛盾统一体。", ["政治经济学"]],
  ["马原", "劳动二重性及其与商品二因素的关系是什么？", "具体劳动和抽象劳动是生产商品的劳动二重性。\n具体劳动创造商品的使用价值，抽象劳动形成商品的价值。\n劳动二重性理论是理解政治经济学的枢纽。", ["政治经济学"]],
  ["马原", "剩余价值是怎样产生的？", "剩余价值是雇佣工人在剩余劳动时间内创造的、被资本家无偿占有的超过劳动力价值的那部分价值。\n资本主义生产过程是劳动过程和价值增殖过程的统一。\n剩余价值不能在流通中产生，也不能离开流通产生。\n剩余价值率 m′=m/v，反映资本家对工人的剥削程度。", ["政治经济学"]],
  ["马原", "资本积累的实质和后果是什么？", "实质：把剩余价值转化为资本，即剩余价值的资本化，用无偿占有的剩余价值扩大资本规模，进一步占有更多剩余价值。\n后果：资本有机构成提高，相对过剩人口形成，贫富分化加剧，资本主义基本矛盾深化。", ["政治经济学"]],
  ["马原", "产业资本循环的三个阶段和三种职能形式是什么？", "三个阶段：购买阶段、生产阶段、售卖阶段。\n三种职能形式：货币资本、生产资本、商品资本。\n产业资本循环是三种循环形式的统一。连续循环的条件：三种职能形式在空间上并存，三种循环形式在时间上继起。", ["政治经济学"]],
  ["马原", "资本主义基本矛盾及其表现是什么？", "基本矛盾：生产资料资本主义私人占有和生产社会化之间的矛盾。\n表现：①个别企业内部生产的有组织性与整个社会生产的无政府状态之间的矛盾；②生产无限扩大的趋势与劳动人民有支付能力的需求相对缩小之间的矛盾。", ["高频"]],
  ["马原", "垄断与竞争的关系是什么？", "垄断是从自由竞争中形成的，是作为自由竞争的对立面产生的，但垄断并没有消除竞争，反而使竞争变得更加复杂和激烈。\n垄断条件下的竞争包括垄断组织内部的竞争、垄断组织之间的竞争、垄断组织与非垄断组织之间的竞争，以及非垄断组织之间的竞争。", ["易错"]],
  ["马原", "共产主义社会的基本特征有哪些？", "①物质财富极大丰富，消费资料按需分配；\n②社会关系高度和谐，人们精神境界极大提高；\n③每个人自由而全面地发展，人类从必然王国向自由王国飞跃。\n实现共产主义是历史发展的必然趋势，也是一个长期的历史过程。", ["核心概念"]],
  ["毛中特", "新民主主义革命总路线是什么？", "无产阶级领导的，人民大众的，反对帝国主义、封建主义和官僚资本主义的革命。\n总路线规定了革命的领导力量、革命动力、革命对象和革命性质。", ["高频"]],
  ["毛中特", "新民主主义革命的道路是什么？", "农村包围城市、武装夺取政权。\n这是马克思主义基本原理同中国革命具体实际相结合的产物，是中国共产党领导中国革命取得胜利的正确道路。", ["高频"]],
  ["毛中特", "新民主主义革命的三大法宝是什么？", "统一战线、武装斗争、党的建设。\n毛泽东在《〈共产党人〉发刊词》中总结了中国革命的经验，指出这三大法宝是中国共产党在中国革命中战胜敌人的主要武器。", ["高频"]],
  ["毛中特", "党在过渡时期的总路线是什么？", "要在一个相当长的时期内，逐步实现国家的社会主义工业化，并逐步实现国家对农业、手工业和资本主义工商业的社会主义改造。\n简称“一化三改”，体现了发展生产力和变革生产关系的统一。", ["核心概念"]],
  ["毛中特", "社会主义的本质是什么？", "解放生产力，发展生产力，消灭剥削，消除两极分化，最终达到共同富裕。\n社会主义本质论把生产力与生产关系、根本任务与根本目标统一起来。", ["高频"]],
  ["毛中特", "社会主义初级阶段基本路线的主要内容是什么？", "领导和团结全国各族人民，以经济建设为中心，坚持四项基本原则，坚持改革开放，自力更生，艰苦创业，为把我国建设成为富强民主文明和谐美丽的社会主义现代化强国而奋斗。\n可概括为“一个中心、两个基本点”。", ["高频"]],
  ["毛中特", "“三个有利于”判断标准是什么？", "是否有利于发展社会主义社会的生产力，是否有利于增强社会主义国家的综合国力，是否有利于提高人民的生活水平。\n这是判断改革和各方面工作是非得失的根本标准。", ["核心概念"]],
  ["毛中特", "社会主义市场经济体制的基本特征是什么？", "①坚持公有制为主体、多种所有制经济共同发展；\n②坚持按劳分配为主体、多种分配方式并存；\n③坚持市场在资源配置中起决定性作用，更好发挥政府作用；\n④坚持党的领导，坚持以人民为中心，把社会主义制度优势与市场经济优势结合起来。", ["核心概念"]],
  ["毛中特", "新发展理念的内容和关系是什么？", "创新、协调、绿色、开放、共享。\n创新是引领发展的第一动力，协调是持续健康发展的内在要求，绿色是永续发展的必要条件，开放是国家繁荣发展的必由之路，共享是中国特色社会主义的本质要求。\n五大发展理念相互贯通、相互促进，是具有内在联系的集合体。", ["高频"]],
  ["毛中特", "“五位一体”总体布局是什么？", "经济建设、政治建设、文化建设、社会建设、生态文明建设。\n统筹推进“五位一体”总体布局，推动中国特色社会主义事业全面发展、全面进步。", ["高频"]],
  ["毛中特", "“四个全面”战略布局是什么？", "全面建设社会主义现代化国家、全面深化改革、全面依法治国、全面从严治党。\n其中，全面建设社会主义现代化国家是战略目标，全面深化改革、全面依法治国、全面从严治党是战略举措。", ["高频"]],
  ["毛中特", "中国式现代化的中国特色是什么？", "①人口规模巨大的现代化；\n②全体人民共同富裕的现代化；\n③物质文明和精神文明相协调的现代化；\n④人与自然和谐共生的现代化；\n⑤走和平发展道路的现代化。", ["高频"]],
  ["毛中特", "高质量发展的地位和要求是什么？", "高质量发展是全面建设社会主义现代化国家的首要任务。\n必须完整、准确、全面贯彻新发展理念，加快构建新发展格局，着力推动质量变革、效率变革、动力变革，建设现代化经济体系，提高全要素生产率。", ["高频"]],
  ["毛中特", "新发展格局是什么？", "以国内大循环为主体、国内国际双循环相互促进的新发展格局。\n构建新发展格局的关键在于经济循环的畅通无阻，要打通堵点、补齐短板，贯通生产、分配、流通、消费各环节，形成需求牵引供给、供给创造需求的更高水平动态平衡。", ["高频"]],
  ["毛中特", "全过程人民民主的内涵是什么？", "全过程人民民主是社会主义民主政治的本质属性，是最广泛、最真实、最管用的民主。\n它把选举民主与协商民主结合起来，把民主选举、民主协商、民主决策、民主管理、民主监督贯通起来，实现人民当家作主。", ["高频"]],
  ["毛中特", "“两个确立”的内容和意义是什么？", "确立习近平同志党中央的核心、全党的核心地位，确立习近平新时代中国特色社会主义思想的指导地位。\n这对新时代党和国家事业发展、对推进中华民族伟大复兴历史进程具有决定性意义。", ["时政"]],
  ["毛中特", "人类命运共同体的内涵是什么？", "建设持久和平、普遍安全、共同繁荣、开放包容、清洁美丽的世界。\n坚持对话协商、共建共享、合作共赢、交流互鉴、绿色低碳，推动构建人类命运共同体。", ["时政"]],
  ["毛中特", "全面深化改革的总目标是什么？", "完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化。\n前一句规定了根本方向，后一句规定了实现路径，两句话组成一个整体。", ["核心概念"]],
  ["毛中特", "全面依法治国的总目标是什么？", "建设中国特色社会主义法治体系、建设社会主义法治国家。\n坚持党的领导、人民当家作主、依法治国有机统一，坚定不移走中国特色社会主义法治道路。", ["核心概念"]],
  ["毛中特", "新时代党的建设总要求是什么？", "坚持和加强党的全面领导，坚持党要管党、全面从严治党，以加强党的长期执政能力建设、先进性和纯洁性建设为主线，以党的政治建设为统领，以坚定理想信念宗旨为根基，以调动全党积极性、主动性、创造性为着力点，全面推进党的政治建设、思想建设、组织建设、作风建设、纪律建设，把制度建设贯穿其中，深入推进反腐败斗争，不断提高党的建设质量。", ["核心概念"]],
  ["史纲", "鸦片战争的历史影响是什么？", "1840年鸦片战争后，中国逐步沦为半殖民地半封建社会，中国近代史由此开端。\n中国社会主要矛盾变为帝国主义与中华民族、封建主义与人民大众的矛盾；争取民族独立、人民解放和实现国家富强、人民幸福成为近代中国的两大历史任务。", ["时间线"]],
  ["史纲", "五四运动的历史意义是什么？", "1919年五四运动是中国旧民主主义革命走向新民主主义革命的转折点，是中国新民主主义革命的开端。\n它促进了马克思主义在中国的传播，促进了马克思主义同中国工人运动的结合，为中国共产党的成立作了思想上和干部上的准备。", ["高频"]],
  ["史纲", "中共一大的历史意义是什么？", "1921年7月，中国共产党第一次全国代表大会在上海召开（后转移至浙江嘉兴南湖），宣告中国共产党正式成立。\n中国共产党的成立是开天辟地的大事变，中国革命的面貌从此焕然一新。", ["时间线"]],
  ["史纲", "中共二大的重要贡献是什么？", "1922年中共二大第一次提出了反帝反封建的民主革命纲领。\n最低纲领：打倒军阀，推翻国际帝国主义的压迫，统一中国为真正的民主共和国；最高纲领：实现共产主义。", ["时间线"]],
  ["史纲", "遵义会议的历史意义是什么？", "1935年1月遵义会议集中解决了当时具有决定意义的军事问题和组织问题，事实上确立了毛泽东在党中央和红军的领导地位，开始确立以毛泽东同志为主要代表的马克思主义正确路线在党中央的领导地位。\n它是党的历史上一个生死攸关的转折点。", ["高频"]],
  ["史纲", "红军长征胜利的标志和意义是什么？", "1936年10月，红一、红二、红四方面军在甘肃会宁、静宁将台堡会师，标志着长征胜利结束。\n长征实现了党和红军战略大转移，保存了革命骨干，铸就了伟大长征精神，为开创中国革命新局面奠定了基础。", ["时间线"]],
  ["史纲", "西安事变的和平解决有何意义？", "1936年12月西安事变发生后，中国共产党从民族大义出发，促成事变和平解决。\n西安事变的和平解决成为时局转换的枢纽，标志着十年内战基本结束，抗日民族统一战线初步形成。", ["时间线"]],
  ["史纲", "七七事变的历史意义是什么？", "1937年7月7日卢沟桥事变（七七事变）标志着日本全面侵华战争爆发，也标志着中国全民族抗战的开始。\n中国人民抗日战争进入战略防御阶段。", ["时间线"]],
  ["史纲", "中共七大的历史贡献是什么？", "1945年中共七大在延安召开，制定了党的政治路线，确立了毛泽东思想为党的指导思想并写入党章，选举产生了以毛泽东为核心的中央领导集体。\n为争取抗战胜利和新民主主义革命胜利奠定了政治、思想和组织基础。", ["高频"]],
  ["史纲", "抗日战争胜利的意义是什么？", "1945年9月2日日本签署投降书，中国人民抗日战争取得胜利。\n这是近代以来中国人民反抗外敌入侵第一次取得完全胜利的民族解放战争，是中华民族由衰败走向复兴的重大转折点，也是世界反法西斯战争的重要组成部分。", ["高频"]],
  ["史纲", "新中国成立的历史意义是什么？", "1949年10月1日中华人民共和国成立，标志着新民主主义革命取得基本胜利。\n它结束了中国半殖民地半封建社会的历史，实现了民族独立和人民解放，为实现由新民主主义向社会主义过渡创造了前提条件。", ["高频"]],
  ["史纲", "三大改造完成的意义是什么？", "1956年底，对农业、手工业和资本主义工商业的社会主义改造基本完成，实现了生产资料私有制向社会主义公有制的转变。\n标志着社会主义制度在我国基本确立，我国进入社会主义初级阶段。", ["高频"]],
  ["史纲", "十一届三中全会的历史意义是什么？", "1978年12月党的十一届三中全会重新确立了解放思想、实事求是的思想路线，停止使用“以阶级斗争为纲”的口号，把党和国家工作中心转移到经济建设上来，实行改革开放。\n它是新中国成立以来党的历史上具有深远意义的伟大转折。", ["高频"]],
  ["史纲", "党的二十大的主题和中心任务是什么？", "主题：高举中国特色社会主义伟大旗帜，全面贯彻新时代中国特色社会主义思想，弘扬伟大建党精神，自信自强、守正创新，踔厉奋发、勇毅前行，为全面建设社会主义现代化国家、全面推进中华民族伟大复兴而团结奋斗。\n中心任务：团结带领全国各族人民全面建成社会主义现代化强国、实现第二个百年奋斗目标，以中国式现代化全面推进中华民族伟大复兴。", ["时政"]],
  ["史纲", "“两步走”战略安排是什么？", "从2020年到2035年基本实现社会主义现代化；\n从2035年到本世纪中叶把我国建成富强民主文明和谐美丽的社会主义现代化强国。", ["时政"]],
  ["思修法基", "人生价值的内容及评价标准是什么？", "人生价值包括自我价值和社会价值。\n自我价值是个体的人生活动对自己的生存和发展所具有的价值；社会价值是个体的人生活动对社会、他人所具有的价值。\n评价人生价值要坚持能力有大小与贡献须尽力相统一、物质贡献与精神贡献相统一、完善自身与贡献社会相统一。社会价值是人生价值的主要方面。", ["核心概念"]],
  ["思修法基", "理想信念的作用是什么？", "理想信念是人的精神世界的核心。\n①指引人生奋斗目标；②提供人生前进动力；③提高人生精神境界。\n中国特色社会主义共同理想和共产主义远大理想是中国共产党人的精神支柱和政治灵魂。", ["核心概念"]],
  ["思修法基", "中国精神的内涵是什么？", "以爱国主义为核心的民族精神和以改革创新为核心的时代精神。\n民族精神包括伟大创造精神、伟大奋斗精神、伟大团结精神、伟大梦想精神；时代精神包括改革创新等。\n中国精神是兴国强国之魂。", ["高频"]],
  ["思修法基", "社会主义核心价值观的内容是什么？", "国家层面：富强、民主、文明、和谐；\n社会层面：自由、平等、公正、法治；\n公民层面：爱国、敬业、诚信、友善。\n社会主义核心价值观是当代中国精神的集中体现，凝结着全体人民共同的价值追求。", ["高频"]],

function loadScript(src, timeoutMs) {
  return new Promise((resolve, reject) => {
    const selector = 'script[src="' + src + '"]';
    const existing = document.querySelector(selector);
    if (existing) {
      if (existing.dataset.loaded === "1") return resolve();
      let done = false;
      const onLoad = () => { if (done) return; done = true; cleanup(); resolve(); };
      const onErr = () => { if (done) return; done = true; cleanup(); reject(new Error("加载失败：" + src)); };
      function cleanup() {
        existing.removeEventListener("load", onLoad);
        existing.removeEventListener("error", onErr);
      }
      existing.addEventListener("load", onLoad);
      existing.addEventListener("error", onErr);
      setTimeout(() => { if (!done) { done = true; cleanup(); reject(new Error("加载超时：" + src)); } }, timeoutMs || 20000);
      return;
    }
    const s = document.createElement("script");
    s.src = src;
    s.crossOrigin = "anonymous";
    s.referrerPolicy = "no-referrer";
    let settled = false;
    const timer = setTimeout(() => {
      if (settled) return;
      settled = true;
      try { s.remove(); } catch (e) {}
      reject(new Error("加载超时：" + src));
    }, timeoutMs || 20000);
    s.onload = () => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      s.dataset.loaded = "1";
      resolve();
    };
    s.onerror = () => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      try { s.remove(); } catch (e) {}
      reject(new Error("加载失败：" + src));
    };
    document.head.appendChild(s);
  });
}

function withTimeout(promise, ms, msg) {
  return new Promise((resolve, reject) => {
    let settled = false;
    const timer = setTimeout(() => {
      if (settled) return;
      settled = true;
      reject(new Error(msg || "操作超时"));
    }, ms);
    Promise.resolve(promise).then(
      v => { if (settled) return; settled = true; clearTimeout(timer); resolve(v); },
      e => { if (settled) return; settled = true; clearTimeout(timer); reject(e); }
    );

async function ocrPdfText(file, onProgress, opts) {
  opts = opts || {};
  const scale       = opts.scale || 2.5;
  const workerCount = Math.max(1, Math.min(OCR_WORKER_COUNT_MAX, opts.workers || OCR_WORKER_COUNT_DEFAULT));
  const lang        = opts.lang || "chi_sim+eng";

  const pageTo      = opts.pageTo || 0;

    lib.getDocument({ data: new Uint8Array(buf.slice(0)), disableWorker: true }).promise,
    90000, "打开 PDF 超时"
  );

  if (!total) throw new Error("PDF 页数为 0");

  const to   = pageTo > 0 ? Math.min(pageTo, total) : total;
  if (from > to) throw new Error("页码范围无效：" + from + "-" + to);

    const h = await hashBuffer(buf);
    cacheKey = h + "|" + OCR_ENGINE_VERSION + "|" + engine + "|" + lang + "|" + scale.toFixed(1) + "|" + (preprocess ? "p1" : "p0");
  }

  if (engine === "paddle") {
    if (!opts.paddleEndpoint) throw new Error("PaddleOCR 模式需要填写服务地址");
    if (onProgress) onProgress(0, pageCount, "使用 PaddleOCR 后端…");
  } else {
    if (onProgress) onProgress(0, pageCount, "准备 OCR 引擎（引擎与语言包均已内置）…");
    workers = await getOcrPool(workerCount, lang, msg => onProgress && onProgress(0, pageCount, msg));
  }

  const pages = new Array(pageCount).fill("");
  const errors = [];
  let next = 0;
  let doneCount = 0;
  let cacheHits = 0;

    const page = await pdf.getPage(i);
    const vp = page.getViewport({ scale });
    const canvas = document.createElement("canvas");
    canvas.width = Math.ceil(vp.width);
    canvas.height = Math.ceil(vp.height);

      if (cached != null) {
        pages[idx] = cached;
        cacheHits++;
        doneCount++;
        if (onProgress) onProgress(doneCount, pageCount, "第 " + absPage + " 页命中缓存（" + doneCount + "/" + pageCount + "）");
        return;
      }
    }
    let canvas = null;
    try {
      canvas = await renderPage(absPage);
    } catch (e) {
      errors.push({ page: absPage, msg: "渲染失败：" + e.message });
      doneCount++;
      if (onProgress) onProgress(doneCount, pageCount, "第 " + absPage + " 页渲染失败（" + doneCount + "/" + pageCount + "）");

      const runners = [];

    if (tail) onProgress(pageCount, pageCount, "OCR 完成" + tail);
  }

function compressImage(file, maxWidth, quality) {
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(file.type)) { reject(new Error("请选择图片文件")); return; }
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
        if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        let dataUrl = "";
        try { dataUrl = canvas.toDataURL("image/webp", quality); } catch (e) {}
        if (!dataUrl || dataUrl.indexOf("data:image/webp") !== 0) {
          dataUrl = canvas.toDataURL("image/jpeg", quality);
        }
        resolve({ dataUrl, width: w, height: h });
      };
      img.onerror = () => reject(new Error("图片加载失败"));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error("文件读取失败"));
    reader.readAsDataURL(file);
  });
}

  parsed = arr;

    if (Object.prototype.hasOwnProperty.call(seenTitles, title)) warnings.push("导入内容中「" + title + "」重复");

    const item = normalizeItem(obj);
    let filled = 0;
    for (let k = 0; k < ALL_FIELDS.length; k++) if (item[ALL_FIELDS[k]]) filled++;

  if (q.type === "judge" && q.options.length === 0) q.options = [{ key: "A", text: "正确" }, { key: "B", text: "错误" }];
  const ans = raw.answer;
  if (q.type === "essay") {
    if (Array.isArray(ans)) q.answer = ans.map(x => String(x).trim()).filter(Boolean);
    else if (typeof ans === "string" && ans.trim()) q.answer = [ans.trim()];
  } else if (Array.isArray(ans)) q.answer = ans.map(x => String(x).trim().toUpperCase());
  else if (typeof ans === "string") q.answer = ans.split(/[,，;；\s]+/).map(x => x.trim().toUpperCase()).filter(Boolean);
  const tags = raw.tags || [];
  if (Array.isArray(tags)) q.tags = tags.map(t => String(t).trim()).filter(Boolean);
  else if (typeof tags === "string") q.tags = tags.split(/[,，;；]/).map(t => t.trim()).filter(Boolean);
  Object.defineProperty(q, "__userProvidedId", {
    value: !!(raw.id && String(raw.id).trim()),
    enumerable: false, configurable: true, writable: true,
  });
  return q;
}
function parseQuestionList(text) {
  let parsed;
  try { parsed = JSON.parse(text); } catch (e) { return { items: null, err: "JSON 解析失败：" + e.message }; }
  const arr = coercePayloadArray(parsed, "questions");
  if (!arr) return { items: null, err: "顶层必须是数组（也支持 {\"questions\": [...]} 包装格式）" };
  parsed = arr;
  const items = [];
  for (let i = 0; i < parsed.length; i++) {
    const obj = parsed[i];
    if (!obj || typeof obj !== "object") return { items: null, err: "第 " + (i + 1) + " 项不是对象" };
    if (obj.type === "B") {
      if (!obj.sharedOptions || !obj.subQuestions) return { items: null, err: "第 " + (i + 1) + " 项 B 型题缺少 sharedOptions / subQuestions" };
    } else if (obj.type === "A3") {
      if (!obj.caseStem || !obj.questions) return { items: null, err: "第 " + (i + 1) + " 项 A3 型题缺少 caseStem / questions" };
    } else {
      if (!obj.stem) return { items: null, err: "第 " + (i + 1) + " 项缺少 stem" };
      if (!obj.answer) return { items: null, err: "第 " + (i + 1) + " 项缺少 answer" };
    }
    items.push(normalizeQuestion(obj));
  }
  return { items, err: null };
}

  backup() {

      const lastTs = Number(localStorage.getItem(BACKUP_KEY + "_ts") || 0);
      if (Date.now() - lastTs < 60000) return;
      const backups = this.getBackups();
      const keys = Object.keys(backups).sort();
      const lastKey = keys[keys.length - 1];
      if (lastKey && JSON.stringify(backups[lastKey]) === JSON.stringify(this.data)) return;
      backups[BACKUP_PREFIX + stamp] = JSON.parse(JSON.stringify(this.data));
      const allKeys = Object.keys(backups).sort();
      while (allKeys.length > MAX_BACKUPS) delete backups[allKeys.shift()];
      localStorage.setItem(BACKUP_KEY, JSON.stringify(backups));
      localStorage.setItem(BACKUP_KEY + "_ts", String(Date.now()));
    } catch (e) {}
  },
  getBackups() {

    return {};
  },
  backupCount() { return Object.keys(this.getBackups()).length; },
  clearBackups() { try { localStorage.removeItem(BACKUP_KEY); localStorage.removeItem(BACKUP_KEY + "_ts"); } catch (e) {} },
  importFromText(text, mode, subjectOverride, chapterOverride) {

    const items = parsed.items;
    const warnings = parsed.warnings.slice();
    if (subjectOverride) for (let i = 0; i < items.length; i++) items[i].subject = subjectOverride;
    if (chapterOverride !== undefined && chapterOverride !== null) {
      for (let i = 0; i < items.length; i++) items[i].chapter = chapterOverride;
    }

    const baseData = mode === "replace" ? [] : this.data;
    const idCounters = {};

    for (let i = 0; i < items.length; i++) {
      if (items[i].__userProvidedId) continue;
      items[i].id = buildCaseId(items[i], baseData, idCounters);
    }

    if (mode !== "replace") {
      const existingTitles = {};
      for (let i = 0; i < this.data.length; i++) existingTitles[this.data[i].title] = true;
      for (let i = 0; i < items.length; i++) {
        if (existingTitles[items[i].title]) warnings.push("「" + items[i].title + "」与现有数据标题重复");
      }
    }

    if (mode === "replace") {
      this.data = items;
    } else {
      const existingIds = {};
      for (let i = 0; i < this.data.length; i++) existingIds[this.data[i].id] = true;
      for (let i = 0; i < items.length; i++) {
        if (existingIds[items[i].id]) {
          warnings.push("ID「" + items[i].id + "」与现有数据冲突，已自动改名");
          items[i].id = buildCaseId(items[i], baseData.concat(items.slice(0, i)), {});
        }
        existingIds[items[i].id] = true;
      }
      this.data = this.data.concat(items);
    }
    this.save();
    return { ok: true, msg: "已" + (mode === "replace" ? "替换为" : "追加") + " " + items.length + " 条", warnings };
  },

    if (subject && subject !== "全部") data = data.filter(d => d.subject === subject);
    return JSON.stringify(data, null, 2);
  },
};

function mergeRemoteList(localList, remoteList, isQ) {
  const normalize = isQ ? normalizeQuestion : normalizeItem;
  const remote = remoteList.map(normalize);
  const remoteById = {};
  remote.forEach(x => { remoteById[x.id] = x; });
  const localIds = {};
  const out = [];
  let updated = 0, kept = 0, added = 0;
  for (const d of localList) {
    localIds[d.id] = true;
    const r = remoteById[d.id];
    if (!r) { out.push(d); kept++; continue; }
    const merged = Object.assign({}, d);
    for (const k in r) {
      if (!Object.prototype.hasOwnProperty.call(r, k)) continue;
      if (isQ) {
        if (k === "starred" || k === "doubt") continue;
        if ((r[k] === "" || (Array.isArray(r[k]) && !r[k].length)) && merged[k] !== undefined && merged[k] !== "") continue;
      } else {
        if (k === "starred" || k === "status") continue;
        if ((r[k] === "" || (Array.isArray(r[k]) && !r[k].length)) && merged[k]) continue;
      }
      merged[k] = r[k];
    }
    out.push(merged);
    updated++;
  }
  for (const r of remote) {
    if (!localIds[r.id]) { out.push(r); added++; }
  }
  return { list: out, updated, kept, added };
}
async function pullFromRemote(kind, silent) {
  const isQ = kind === "questions";
  const url = isQ ? REMOTE_QUESTIONS_URL : REMOTE_DATA_URL;
  const label = isQ ? "题库" : "病例";
  try {
    const resp = await fetch(url + "?t=" + Date.now());
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const remote = coercePayloadArray(await resp.json(), isQ ? "questions" : "cases");
    if (!remote) throw new Error("返回不是数组");
    if (!remote.length) throw new Error("远端为空");

    const before = isQ ? questionStore.data.length : store.data.length;

    if (silent) {
      if (isQ) {
        questionStore.data = remote.map(normalizeQuestion);
        questionStore.save();
        rebuildQSubjectValues();
      } else {
        store.backup();
        store.data = remote.map(normalizeItem);
        store.save(false);
      }
      if (state.mode === "quiz") renderQuizListOnly(); else render();
      return { ok: true, count: remote.length, before, mode: "overwrite" };
    }

    const apply = (mode) => {
      if (mode === "overwrite") {
        if (isQ) {
          questionStore.data = remote.map(normalizeQuestion);
          questionStore.save();
          rebuildQSubjectValues();
        } else {
          store.backup();
          store.data = remote.map(normalizeItem);
          store.save(false);
        }
        if (state.mode === "quiz") renderQuizListOnly(); else render();
        confirmPopup("✅ 已覆盖拉取" + label + " " + remote.length + " 条\n（本地原有 " + before + " 条）");
      } else {
        const merged = mergeRemoteList(isQ ? questionStore.data : store.data, remote, isQ);
        if (isQ) {
          questionStore.data = merged.list;
          questionStore.save();
          rebuildQSubjectValues();
        } else {
          store.backup();
          store.data = merged.list;
          store.save(false);
        }
        if (state.mode === "quiz") renderQuizListOnly(); else render();
        confirmPopup(
          "✅ 已合并" + label + "\n\n" +
          "更新 " + merged.updated + " 条 · 新增 " + merged.added + " 条\n" +
          "保留本地独有 " + merged.kept + " 条\n" +
          "合并后共 " + merged.list.length + " 条\n\n" +
          "（同名 ID 以远端内容为准，本地收藏/状态/疑问标记保留）"
        );
      }
    };

    confirmChoice(
      "远端共有 " + label + " " + remote.length + " 条，本地 " + before + " 条。\n\n" +
      "选择拉取方式：\n· 覆盖：完全以远端为准（本地独有条目会丢失）\n· 合并：远端优先 + 保留本地独有条目与收藏/状态标记",
      [
        { label: "覆盖拉取", onClick: () => apply("overwrite") },
        { label: "合并拉取", primary: true, onClick: () => apply("merge") },
      ]
    );
    return { ok: true, count: remote.length, before, mode: "ask" };
  } catch (e) {
    if (!silent) confirmPopup("❌ 拉取" + label + "失败：" + e.message);
    else console.error("自动拉取" + label + "失败：", e);
    return { ok: false, error: e.message };
  }
}

   数据迁移
   ========================================================= */
const PATHO_GENERAL_CHAPTERS = ["细胞和组织的适应与损伤","损伤的修复","局部血液循环障碍","炎症","免疫性疾病","肿瘤","环境和营养性疾病","遗传性疾病和儿童疾病"];

function migrateAllData() {
  let changedCases = false;
  let changedQuestions = false;

  const caseIdSet = {};
  for (let i = 0; i < store.data.length; i++) caseIdSet[store.data[i].id] = true;
  for (let i = 0; i < store.data.length; i++) {
    const d = store.data[i];
    let newId = d.id;
    let newChapter = d.chapter;
    if (d.chapter === "外科学基础") newChapter = "外科学总论";
    if (d.id && String(d.id).indexOf("-01外科学基础-") !== -1) {
      newId = String(d.id).replace("-01外科学基础-", "-01外科学总论-");
    }
    if (newId !== d.id) {
      if (caseIdSet[newId] && newId !== d.id) {
        newId = d.id;
      } else {
        delete caseIdSet[d.id];
        caseIdSet[newId] = true;
      }
    }
    if (newId !== d.id || newChapter !== d.chapter) {
      d.id = newId;
      d.chapter = newChapter;
      changedCases = true;
    }
  }

  for (let i = 0; i < store.data.length; i++) {
    const d = store.data[i];
    if (d.subject === "病理学") {
      const isGeneral = PATHO_GENERAL_CHAPTERS.indexOf(d.chapter) !== -1;
      d.subject = isGeneral ? "病理学总论" : "病理学各论";
      changedCases = true;
    }
  }
  for (let i = 0; i < questionStore.data.length; i++) {
    const q = questionStore.data[i];
    if (q.subject === "病理学") {
      const isGeneral = PATHO_GENERAL_CHAPTERS.indexOf(q.chapter) !== -1;
      q.subject = isGeneral ? "病理学总论" : "病理学各论";
      changedQuestions = true;
    }
  }

  const qIdSet = {};
  const qIdMap = {};
  for (let i = 0; i < questionStore.data.length; i++) qIdSet[questionStore.data[i].id] = true;
  for (let i = 0; i < questionStore.data.length; i++) {
    const q = questionStore.data[i];
    const oldId = String(q.id || "");
    const m = oldId.match(/^Q(\d{2})([^-]+)-([A-Z])-(\d+)$/);
    if (!m) continue;
    const subj = m[2];
    const typeCode = m[3];
    const seq = m[4];
    const sys = matchSystemCode(subj, (q.chapter || "") + " " + (q.stem || "") + " " + (q.caseStem || ""));
    const newId = "Q" + m[1] + subj + "-" + sys.code + sys.name + "-" + typeCode + "-" + seq;
    if (newId === oldId) continue;
    if (qIdSet[newId] && newId !== oldId) continue;
    delete qIdSet[oldId];
    qIdSet[newId] = true;
    q.id = newId;
    qIdMap[oldId] = newId;
    changedQuestions = true;
  }

  if (changedCases) store.save(false);
  if (changedQuestions) questionStore.save();

  const renamed = Object.keys(qIdMap);
  if (renamed.length) {
    let logChanged = false;
    for (const oldId of renamed) {
      const newId = qIdMap[oldId];
      if (answerLog.data[oldId] === undefined) continue;
      if (answerLog.data[newId] === undefined) answerLog.data[newId] = answerLog.data[oldId];
      delete answerLog.data[oldId];
      logChanged = true;
    }
    if (logChanged) answerLog.save();
    try {
      const p = quizProgress.load();
      if (p && Array.isArray(p.poolIds)) {
        let pc = false;
        p.poolIds = p.poolIds.map(id => { if (qIdMap[id]) { pc = true; return qIdMap[id]; } return id; });
        if (pc) quizProgress.save(p);
      }
    } catch (e) {}
    try {
      const notes = loadQNotes();
      let nc = false;
      for (const oldId of renamed) {
        if (notes[oldId] === undefined) continue;
        if (notes[qIdMap[oldId]] === undefined) notes[qIdMap[oldId]] = notes[oldId];
        delete notes[oldId];
        nc = true;
      }
      if (nc) saveQNotes(notes);
    } catch (e) {}
  }
}

   答题记录 / 刷题进度 / 笔记

const answerLog = {
  data: {},
  load() { try { const raw = localStorage.getItem(ANSWER_LOG_KEY); if (raw) this.data = JSON.parse(raw) || {}; } catch (e) { this.data = {}; } },
  save() { try { localStorage.setItem(ANSWER_LOG_KEY, JSON.stringify(this.data)); } catch (e) {} },
  record(qid, userAnswer, correct, elapsed) {
    const r = this.data[qid] || { attempts: 0, wrongCount: 0 };
    r.lastAnswer = userAnswer;
    r.correct = correct;
    r.attempts = (r.attempts || 0) + 1;
    if (!correct) r.wrongCount = (r.wrongCount || 0) + 1;
    r.lastAt = Date.now();
    if (elapsed) { r.lastElapsed = elapsed; if (!r.bestElapsed || elapsed < r.bestElapsed) r.bestElapsed = elapsed; }
    this.data[qid] = r;
    this.save();
  },
  reset(qid) { if (qid) delete this.data[qid]; else this.data = {}; this.save(); },
  stats() {
    let total = 0, correct = 0, wrong = 0, unanswered = 0;
    for (const q of questionStore.data) {
      const st = answerStatusFor(q);
      if (!st.answered) { unanswered++; continue; }
      total++;
      if (st.anyWrong) wrong++; else correct++;
    }
    return { total, correct, wrong, unanswered, all: questionStore.data.length };
  },
  wrongIds() {
    const ids = [];
    for (const q of questionStore.data) if (answerStatusFor(q).anyWrong) ids.push(q.id);
    return ids;
  },
};
function questionSubCount(q) {
  if (q.type === "B") return (q.subQuestions || []).length || 1;
  if (q.type === "A3") return (q.questions || []).length || 1;
  return 1;
}
function answerRecordsFor(q) {
  const n = questionSubCount(q);
  const recs = [];
  for (let i = 0; i < n; i++) {
    const k = n > 1 ? q.id + "#" + i : q.id;
    if (answerLog.data[k]) recs.push(answerLog.data[k]);
  }
  return recs;
}
function answerStatusFor(q) {
  const recs = answerRecordsFor(q);
  let anyWrong = false, allCorrect = recs.length > 0;
  let wrongCount = 0, attempts = 0, lastAt = 0, bestElapsed = 0;
  for (const r of recs) {
    if (!r.correct) { anyWrong = true; allCorrect = false; }
    wrongCount += r.wrongCount || 0;
    attempts += r.attempts || 0;
    if ((r.lastAt || 0) > lastAt) lastAt = r.lastAt || 0;
    if (r.bestElapsed && (!bestElapsed || r.bestElapsed < bestElapsed)) bestElapsed = r.bestElapsed;
  }
  return {
    answered: recs.length >= questionSubCount(q),
    any: recs.length > 0,
    anyWrong,
    allCorrect,
    wrongCount,
    attempts,
    lastAt,
    bestElapsed,
  };
}

/* =========================================================
   判分 / 优先排序
   ========================================================= */
function judgeAnswer(q, userAnswer) {
  if (!userAnswer || !userAnswer.length) return false;
  const a = q.answer.slice().sort().join("");
  const u = userAnswer.slice().sort().join("");
  return a === u;
}
function judgeMulti(q, subIdx, userAnswer) {
  if (q.type === "B") {
    const sub = q.subQuestions[subIdx];
    if (!sub || !userAnswer || !userAnswer.length) return false;
    return sub.answer.slice().sort().join("") === userAnswer.slice().sort().join("");
  }
  if (q.type === "A3") {
    const sub = q.questions[subIdx];
    if (!sub || !userAnswer || !userAnswer.length) return false;
    return sub.answer.slice().sort().join("") === userAnswer.slice().sort().join("");
  }
  return judgeAnswer(q, userAnswer);
}
function quizPriority(q) {
  const st = answerStatusFor(q);
  if (!st.any) return 1000;
  if (st.anyWrong) return 800 - Math.min(st.wrongCount * 50, 200);
  const days = (Date.now() - st.lastAt) / 86400000;
  return 500 + Math.min(days, 100);
}

function utf8ToBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  const CHUNK = 0x8000;
  for (let i = 0; i < bytes.length; i += CHUNK) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
  return btoa(bin);
}
function ghHeaders(cfg) {
  return { "Authorization": "Bearer " + cfg.token, "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" };
}
function ghRepoUrl(cfg, suffix) { return "https://api.github.com/repos/" + encodeURIComponent(cfg.owner) + "/" + encodeURIComponent(cfg.repo) + suffix; }
function encodeRefPath(branch) { return String(branch).split("/").map(encodeURIComponent).join("/"); }
async function readJsonSafe(resp) { try { return await resp.json(); } catch (e) { return null; } }
function ghErrMsg(resp, body) {
  let msg = (body && body.message) ? body.message : ("HTTP " + resp.status);
  if (resp.status === 401) msg += "（Token 无效或已过期）";
  else if (resp.status === 403) msg += "（权限不足或触发限流）";
  else if (resp.status === 404) msg += "（仓库 / 分支 / 路径不存在）";
  else if (resp.status === 409) msg += "（文件冲突，请重试）";
  else if (resp.status === 422) msg += "（sha 不匹配或文件已存在）";
  return msg;
}
async function ghTest(cfg) {
  const resp = await fetch("https://api.github.com/repos/" + encodeURIComponent(cfg.owner) + "/" + encodeURIComponent(cfg.repo), { headers: ghHeaders(cfg) });
  const body = await readJsonSafe(resp);
  if (!resp.ok) throw new Error(ghErrMsg(resp, body));
  return body;
}
async function ghGetBranchCommit(cfg) {
  const resp = await fetch(ghRepoUrl(cfg, "/git/ref/heads/" + encodeRefPath(cfg.branch)), { headers: ghHeaders(cfg) });
  const body = await readJsonSafe(resp);
  if (resp.status === 404) throw new Error("分支「" + cfg.branch + "」不存在");
  if (!resp.ok) throw new Error("获取分支引用失败：" + ghErrMsg(resp, body));
  return body.object.sha;
}
async function ghGetCommit(cfg, sha) {
  const resp = await fetch(ghRepoUrl(cfg, "/git/commits/" + encodeURIComponent(sha)), { headers: ghHeaders(cfg) });
  const body = await readJsonSafe(resp);
  if (!resp.ok) throw new Error("获取 commit 失败：" + ghErrMsg(resp, body));
  return body;
}
async function ghCreateBlob(cfg, content) {
  const resp = await fetch(ghRepoUrl(cfg, "/git/blobs"), {
    method: "POST",
    headers: Object.assign({ "Content-Type": "application/json" }, ghHeaders(cfg)),
    body: JSON.stringify({ content: utf8ToBase64(content), encoding: "base64" }),
  });
  const body = await readJsonSafe(resp);
  if (!resp.ok) throw new Error("创建 blob 失败：" + ghErrMsg(resp, body));
  return body.sha;
}
async function ghCreateTree(cfg, baseTreeSha, filePath, blobSha) {
  const resp = await fetch(ghRepoUrl(cfg, "/git/trees"), {
    method: "POST",
    headers: Object.assign({ "Content-Type": "application/json" }, ghHeaders(cfg)),
    body: JSON.stringify({ base_tree: baseTreeSha, tree: [{ path: filePath, mode: "100644", type: "blob", sha: blobSha }] }),
  });
  const body = await readJsonSafe(resp);
  if (!resp.ok) throw new Error("创建 tree 失败：" + ghErrMsg(resp, body));
  return body.sha;
}
async function ghCreateCommit(cfg, message, treeSha, parentSha) {
  const resp = await fetch(ghRepoUrl(cfg, "/git/commits"), {
    method: "POST",
    headers: Object.assign({ "Content-Type": "application/json" }, ghHeaders(cfg)),
    body: JSON.stringify({ message, tree: treeSha, parents: [parentSha] }),
  });
  const body = await readJsonSafe(resp);
  if (!resp.ok) throw new Error("创建 commit 失败：" + ghErrMsg(resp, body));
  return body;
}
async function ghUpdateRef(cfg, commitSha) {
  const resp = await fetch(ghRepoUrl(cfg, "/git/refs/heads/" + encodeRefPath(cfg.branch)), {
    method: "PATCH",
    headers: Object.assign({ "Content-Type": "application/json" }, ghHeaders(cfg)),
    body: JSON.stringify({ sha: commitSha, force: false }),
  });
  const body = await readJsonSafe(resp);
  if (!resp.ok) throw new Error("更新分支引用失败：" + ghErrMsg(resp, body));
  return body;
}
async function ghPutFileViaGitData(cfg, contentText, onStep) {
  const report = typeof onStep === "function" ? onStep : function () {};
  report("获取分支引用…");
  const parentSha = await ghGetBranchCommit(cfg);
  report("获取父 commit…");
  const parentCommit = await ghGetCommit(cfg, parentSha);
  report("创建 blob…");
  const blobSha = await ghCreateBlob(cfg, contentText);
  report("创建 tree…");
  const newTreeSha = await ghCreateTree(cfg, parentCommit.tree.sha, cfg.path, blobSha);
  report("创建 commit…");
  const newCommit = await ghCreateCommit(cfg, cfg.message || "更新数据", newTreeSha, parentSha);
  report("更新分支引用…");
  await ghUpdateRef(cfg, newCommit.sha);
  return newCommit;
}

/* ===== 读取 / 写入任意仓库文件 ===== */
async function ghReadFile(cfg, path) {
  const apiPath = "/contents/" + String(path).split("/").map(encodeURIComponent).join("/");
  const url = ghRepoUrl(cfg, apiPath) + "?ref=" + encodeURIComponent(cfg.branch || "main");
  const resp = await fetch(url, { headers: ghHeaders(cfg) });
  if (resp.status === 404) return null;
  const body = await readJsonSafe(resp);
  if (!resp.ok) throw new Error(ghErrMsg(resp, body));
  if (!body || !body.content) return null;
  const b64 = String(body.content).replace(/\s+/g, "");
  let bin;
  try { bin = atob(b64); } catch (e) { throw new Error("文件内容不是有效的 base64"); }
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}
async function ghWriteFile(cfg, path, text, message) {
  const apiPath = "/contents/" + String(path).split("/").map(encodeURIComponent).join("/");
  let sha = null;
  try {
    const gUrl = ghRepoUrl(cfg, apiPath) + "?ref=" + encodeURIComponent(cfg.branch || "main");
    const gResp = await fetch(gUrl, { headers: ghHeaders(cfg) });
    if (gResp.ok) {
      const gBody = await readJsonSafe(gResp);
      if (gBody && gBody.sha) sha = gBody.sha;
    }
  } catch (e) {}
  const body = {
    message: message || "更新配置",
    content: utf8ToBase64(text),
    branch: cfg.branch || "main",
  };
  if (sha) body.sha = sha;
  const resp = await fetch(ghRepoUrl(cfg, apiPath), {
    method: "PUT",
    headers: Object.assign({ "Content-Type": "application/json" }, ghHeaders(cfg)),
    body: JSON.stringify(body),
  });
  const rb = await readJsonSafe(resp);
  if (!resp.ok) throw new Error(ghErrMsg(resp, rb));
  return rb;
}

async function ghEnsureRelease(cfg, tag, name) {
  const resp = await fetch(ghRepoUrl(cfg, "/releases/tags/" + encodeURIComponent(tag)), { headers: ghHeaders(cfg) });
  if (resp.ok) { const body = await readJsonSafe(resp); if (body && body.id) return body; }
  else if (resp.status !== 404) { const body = await readJsonSafe(resp); throw new Error("获取 release 失败：" + ghErrMsg(resp, body)); }
  const createResp = await fetch(ghRepoUrl(cfg, "/releases"), {
    method: "POST",
    headers: Object.assign({ "Content-Type": "application/json" }, ghHeaders(cfg)),
    body: JSON.stringify({ tag_name: tag, name: name || "数据文件", body: "自动发布", draft: false, prerelease: false }),
  });
  const createBody = await readJsonSafe(createResp);
  if (!createResp.ok) throw new Error("创建 release 失败：" + ghErrMsg(createResp, createBody));
  return createBody;
}
async function ghDeleteAsset(cfg, assetId) {
  const resp = await fetch(ghRepoUrl(cfg, "/releases/assets/" + assetId), { method: "DELETE", headers: ghHeaders(cfg) });
  if (!resp.ok && resp.status !== 404) { const body = await readJsonSafe(resp); throw new Error("删除旧 asset 失败：" + ghErrMsg(resp, body)); }
}
async function ghUploadAsset(cfg, releaseId, contentText, filename) {
  const url = "https://uploads.github.com/repos/" + encodeURIComponent(cfg.owner) + "/" + encodeURIComponent(cfg.repo) + "/releases/" + releaseId + "/assets?name=" + encodeURIComponent(filename);
  const resp = await fetch(url, {
    method: "POST",
    headers: { "Authorization": "Bearer " + cfg.token, "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", "Content-Type": "application/json" },
    body: contentText,
  });
  const body = await readJsonSafe(resp);
  if (!resp.ok) throw new Error("上传 asset 失败：" + ghErrMsg(resp, body));
  return body;
}
async function ghPutFileViaRelease(cfg, contentText, assetName, onStep) {
  const report = typeof onStep === "function" ? onStep : function () {};
  report("获取或创建 release…");
  const release = await ghEnsureRelease(cfg, RELEASE_TAG, "数据文件");
  report("清理同名旧 asset…");
  const assets = release.assets || [];
  for (let i = 0; i < assets.length; i++) if (assets[i].name === assetName) await ghDeleteAsset(cfg, assets[i].id);
  report("上传 " + (contentText.length / 1024 / 1024).toFixed(2) + " MB…");
  return await ghUploadAsset(cfg, release.id, contentText, assetName);
}
async function ghUploadImage(cfg, dataUrl) {
  if (!cfg.owner || !cfg.repo) throw new Error("请先在上传面板配置 owner 和 repo");
  if (!cfg.token) throw new Error("请先在上传面板配置 GitHub Token");
  const m = String(dataUrl).match(/^data:image\/(\w+);base64,(.+)$/);
  if (!m) throw new Error("图片格式无法识别");
  let ext = m[1].toLowerCase();

  const resp = await fetch(url, {
    method: "PUT",
    headers: Object.assign({ "Content-Type": "application/json" }, ghHeaders(cfg)),
    body: JSON.stringify({ message: "上传图片 " + filename, content: m[2], branch: cfg.branch || "main" }),
  });
  const body = await readJsonSafe(resp);
  if (!resp.ok) throw new Error("上传图片失败：" + ghErrMsg(resp, body));

function ocBodyMessage(b) {
  if (!b) return "";
  if (typeof b === "string") return b.slice(0, 300);
  if (b.data && b.data.message) return String(b.data.message).slice(0, 300);
  if (typeof b.message === "string") return b.message.slice(0, 300);
  if (b.error) return ocBodyMessage(b.error);
  return "";
}
async function callAiOpencodeServer(cfg, messages, timeoutMs) {
  const base = String(cfg.base_url || "").replace(/\/+$/, "");

      err.oc = true; throw err;

  const sys = messages.filter(m => m.role === "system").map(m => String(m.content || "")).filter(Boolean).join("\n\n");
  const chat = messages.filter(m => m.role !== "system");
  let prompt = "";
  if (chat.length === 1) prompt = String(chat[0].content || "");
  else prompt = chat.map(m => "【" + (m.role === "assistant" ? "助手" : "用户") + "】\n" + String(m.content || "")).join("\n\n");
  if (!prompt.trim()) throw new Error("opencode：没有可发送的内容");
  const timeout = Math.max(timeoutMs || 180000, 300000);
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeout);
  const title = "kaoyan306 · " + (cfg.subject_target ? cfg.subject_target + " · " : "") + new Date().toLocaleString();
  function fail(msg) { const err = new Error(msg); err.oc = true; return err; }

      method: "POST", headers,
      body: JSON.stringify({ title: title }),
      signal: controller.signal,
    });
    let sb = null;
    try { sb = await sr.json(); } catch (e) {}
    const sid = sb && typeof sb.id === "string" ? sb.id : "";
    if (!sr.ok || !sid) {
      let msg = ocBodyMessage(sb) || ("HTTP " + sr.status);
      if (sr.status === 401) msg += "（OPENCODE_SERVER_PASSWORD 不匹配）";
      else if (sr.status === 404) msg += "（地址错误？base_url 只需填到端口）";
      throw fail("opencode 创建会话失败：" + msg);
    }
    const payload = { system: sys || undefined, tools: {}, parts: [{ type: "text", text: prompt }] };
    if (model) payload.model = model;
    const mr = await fetch(base + "/session/" + sid + "/message", {
      method: "POST", headers,
      body: JSON.stringify(payload),
      signal: controller.signal,
    });
    let mb = null;
    try { mb = await mr.json(); } catch (e) {}
    if (!mr.ok) {
      let msg = ocBodyMessage(mb) || ("HTTP " + mr.status);
      if (mr.status === 401) msg += "（OPENCODE_SERVER_PASSWORD 不匹配）";
      throw fail("opencode 发送消息失败：" + msg);
    }
    const info = mb && mb.info;
    if (info && info.error) {
      const em = (info.error.data && info.error.data.message) || info.error.name || "未知错误";

    } else {

    if (e && e.oc) throw e;
    throw new Error("连接 opencode 服务器失败：" + ((e && e.message) || e) +
      "\n请确认：① 已运行 opencode serve --hostname 0.0.0.0 --port 4096 --cors <本页地址>；② 地址与端口正确、设备同网；③ Android 应用需允许明文 HTTP。");

async function callAi(cfg, messages, timeoutMs) {
  const ocPreset = AI_PRESETS[cfg.provider];
  if (ocPreset && ocPreset.oc_server) return callAiOpencodeServer(cfg, messages, timeoutMs);
  const url = String(cfg.base_url).replace(/\/+$/, "") + "/chat/completions";
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs || 180000);
  let resp;
  try {
    resp = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + (cfg.api_key || "none") },
      body: JSON.stringify({ model: cfg.model, messages, temperature: Number(cfg.temperature) || 0.2, max_tokens: Number(cfg.max_tokens) || 8000, stream: false }),
      signal: controller.signal,
    });
  } catch (e) {
    clearTimeout(timer);
    if (e.name === "AbortError") throw new Error("请求超时（可减小分块大小或换模型）");
    throw new Error("网络错误：" + e.message + "（可能是 CORS 或 base_url 错误）");
  }
  clearTimeout(timer);
  let body = null;
  try { body = await resp.json(); } catch (e) {}
  if (!resp.ok) {
    let msg = (body && body.error && body.error.message) || (body && body.message) || ("HTTP " + resp.status);
    if (resp.status === 401) msg += "（API Key 无效）";
    else if (resp.status === 429) msg += "（限流或余额不足）";
    else if (resp.status === 404) msg += "（模型名或 base_url 错误）";
    throw new Error(msg);
  }
  const choice = body && body.choices && body.choices[0];
  const text = choice && choice.message && choice.message.content;
  if (!text) throw new Error("AI 返回内容为空");
  aiUsageRecord(cfg.provider, body && body.usage, cfg.model);
  return text;
}
function tryParseJson(s) {

}
function normalizeAiResult(obj) {
  if (Array.isArray(obj)) return obj;
  if (obj && typeof obj === "object") {
    for (const k of ["items","data","list","result","cases","questions","病例","数据","题目"]) if (Array.isArray(obj[k])) return obj[k];
    if (obj.title || obj.stem) return [obj];
  }

}
function parseAiJson(text) {
  let s = String(text || "").trim();
  s = s.replace(/^```(?:json)?\s*/i, "").replace(/```\s*$/i, "").trim();
  let obj = tryParseJson(s);
  if (obj) return normalizeAiResult(obj);
  const a = s.indexOf("["), b = s.lastIndexOf("]");
  if (a !== -1 && b > a) { obj = tryParseJson(s.slice(a, b + 1)); if (obj) return normalizeAiResult(obj); }
  const c = s.indexOf("{"), d = s.lastIndexOf("}");
  if (c !== -1 && d > c) { obj = tryParseJson(s.slice(c, d + 1)); if (obj) return normalizeAiResult(obj); }
  throw new Error("AI 返回内容不是合法 JSON，请重试或换模型");
}

function stripAiIds(items) {

function casesToAiText(items) {
  const blocks = [];
  for (let i = 0; i < items.length; i++) {
    const it = items[i];
    const lines = [];
    lines.push("【病例 " + (i + 1) + "】" + (it.title || "（无标题）"));
    let meta = "科目：" + (it.subject || "");
    if (it.chapter) meta += "　章节：" + it.chapter;
    if (it.frequency) meta += "　出现频率：" + it.frequency;
    if (it.tags && it.tags.length) meta += "　标签：" + it.tags.join("、");
    lines.push(meta);
    const fields = getFieldsForSubject(it.subject);
    const thisKeys = {};
    for (let j = 0; j < fields.length; j++) {
      const key = fields[j][0], name = fields[j][1];
      thisKeys[key] = true;
      const val = String(it[key] == null ? "" : it[key]).trim();
      if (val) lines.push("【" + name + "】" + val);
    }
    for (let j = 0; j < ALL_FIELDS.length; j++) {
      const key = ALL_FIELDS[j];
      if (thisKeys[key]) continue;
      const val = String(it[key] == null ? "" : it[key]).trim();
      if (val) lines.push("【" + (FIELD_LABELS[key] || key) + "】" + val);
    }
    blocks.push(lines.join("\n"));
  }
  return blocks.join("\n\n---\n\n");
}

function chunkText(text, size, overlap) {
  size = Math.max(1000, Number(size) || 5000);
  const ovNum = Number(overlap);
  overlap = Math.max(0, Math.min(isFinite(ovNum) ? ovNum : 300, size / 2));
  const paras = String(text).split(/\n{2,}/);
  const chunks = []; let cur = "";
  for (let p of paras) {
    while (p.length > size) { if (cur) { chunks.push(cur); cur = ""; } chunks.push(p.slice(0, size)); p = p.slice(size - overlap); }
    if (cur && cur.length + p.length + 2 > size) { chunks.push(cur); cur = overlap > 0 ? cur.slice(-overlap) + "\n\n" + p : p; }
    else cur = cur ? cur + "\n\n" + p : p;
  }
  if (cur) chunks.push(cur);
  return chunks;
}
function aiQuestionKey(it) {
  if (!it || typeof it !== "object") return "";
  if (it.type === "B") return String(it.stem || (it.subQuestions && it.subQuestions[0] && it.subQuestions[0].stem) || it.group || "").trim();
  if (it.type === "A3") return String(it.stem || it.caseStem || (it.questions && it.questions[0] && it.questions[0].stem) || "").trim();
  return String(it.stem || "").trim();
}
function mergeAiItems(all, isQ) {
  const map = new Map();
  for (const it of all) {
    const key = isQ ? aiQuestionKey(it) : String(it.title || "").trim();
    if (!key) continue;
    if (!map.has(key)) { map.set(key, it); continue; }
    if (!isQ) {
      const old = map.get(key);
      let os = 0, ns = 0;
      for (const k of ALL_FIELDS) {
        if (String(old[k] || "").trim()) os++;
        if (String(it[k] || "").trim()) ns++;
      }
      if (ns > os) map.set(key, it);
    }
  }
  return Array.from(map.values());
}
async function aiGenerate(opts, onLog, isQ) {
  const cfg = opts.cfg;
  const subject = opts.subject;
  const chunks = chunkText(opts.text, cfg.chunk_size, cfg.chunk_overlap);
  onLog("共切分为 " + chunks.length + " 个文本块");
  const allItems = [];
  let totalTokens = 0;
  const systemPrompt = isQ ? buildQuestionPrompt(subject) : buildCasePrompt(subject);
  for (let i = 0; i < chunks.length; i++) {
    onLog("[" + (i + 1) + "/" + chunks.length + "] 调用 AI 中…（约 " + chunks[i].length + " 字）");
    const messages = [
      { role: "system", content: systemPrompt },
      { role: "user", content: "以下是医学资料，请整理成 JSON 数组：\n\n" + chunks[i] },
    ];
    let text = "";
    let ok = false;
    for (let attempt = 1; attempt <= 2 && !ok; attempt++) {
      try { text = await callAi(cfg, messages); ok = true; if (lastAiUsage && lastAiUsage.total) totalTokens += lastAiUsage.total; }
      catch (e) { if (attempt === 2) onLog("[" + (i + 1) + "] 失败：" + e.message); else onLog("[" + (i + 1) + "] 第 1 次失败，重试…"); }
    }
    if (!ok) continue;
    try {
      const items = parseAiJson(text);
      onLog("[" + (i + 1) + "/" + chunks.length + "] 解析出 " + items.length + " 条" + lastUsageText());
      allItems.push(...items);
    } catch (e) { onLog("[" + (i + 1) + "] JSON 解析失败：" + e.message); }
  }
  const merged = mergeAiItems(allItems, isQ);
  stripAiIds(merged);
  let fixed = 0;
  for (let i = 0; i < merged.length; i++) {
    const it = merged[i];
    const sj = String(it.subject || subject || "").trim();
    if (!sj || !CHAPTER_WHITELIST[sj]) continue;
    const before = String(it.chapter == null ? "" : it.chapter).trim();
    const after = normalizeChapter(sj, before);
    if (after !== before) fixed++;
    it.chapter = after;
  }
  if (fixed) onLog("章节归一化修正 " + fixed + " 条");
  onLog("合并去重后共 " + merged.length + " 条");
  if (totalTokens) onLog("📊 本次共消耗 " + totalTokens + " tokens");
  return isQ ? merged.map(normalizeQuestion) : merged.map(normalizeItem);
}

function printDocument(html) {

  document.body.appendChild(iframe);
  let cleaned = false;
  function cleanup() { if (cleaned) return; cleaned = true; try { iframe.remove(); } catch (e) {} }
  const doc = iframe.contentWindow.document;
  doc.open(); doc.write(html); doc.close();
  let printed = false;
  function doPrint() {
    if (printed) return;

    try { iframe.contentWindow.focus(); iframe.contentWindow.print(); }
    catch (e) { confirmPopup("打印失败：" + e.message); cleanup(); return; }
    try { iframe.contentWindow.onafterprint = cleanup; } catch (e) {}
    setTimeout(cleanup, 60000);
  }
  let tries = 0;
  function waitImages() {
    tries++;
    let done = true;
    try { const imgs = iframe.contentWindow.document.images; for (let i = 0; i < imgs.length; i++) if (!imgs[i].complete) { done = false; break; } } catch (e) { done = true; }
    if (done || tries > 25) doPrint(); else setTimeout(waitImages, 160);
  }
  setTimeout(waitImages, 250);
}

      }
    } catch (err) {
      statusEl.textContent = "❌ " + err.message;

      updatePreview("");
    }
  }
  fileBtn1.addEventListener("click", () => fileIn1.click());
  fileIn1.addEventListener("change", () => {
    const f = fileIn1.files && fileIn1.files[0];
    if (!f) return;

    handleFile(f, "file");
  });
  fileBtn2.addEventListener("click", () => fileIn2.click());
  fileIn2.addEventListener("change", () => {
    const f = fileIn2.files && fileIn2.files[0];
    if (!f) return;
    fileInfo2.textContent = f.name + "  ·  " + Math.round(f.size / 1024) + " KB";
    handleFile(f, "gh");
  });
  pop.appendChild(body);
  const footer = el("div", "popup-footer");
  const cancelBtn = el("button", "btn", "取消");
  const insertBtn = el("button", "btn", "插入");
  cancelBtn.addEventListener("click", () => ov.remove());
  insertBtn.addEventListener("click", () => {
    let url = "";
    if (currentTab === "url") url = urlIn.value.trim();
    else if (currentTab === "file") url = currentDataUrl;
    else if (currentTab === "gh") url = currentRelPath;
    if (!url) {
      if (currentTab === "gh" && !ghReady) confirmPopup("请先配置 GitHub Token");
      else if (currentTab === "gh") confirmPopup("请先选择图片等待上传完成");
      else confirmPopup("请先输入 URL 或选择图片");
      return;
    }
    const markdown = "![](" + url + ")\n";
    const start = target.selectionStart, end = target.selectionEnd;
    const val = target.value;
    target.value = val.slice(0, start) + markdown + val.slice(end);
    target.focus();
    const pos = start + markdown.length;
    try { target.setSelectionRange(pos, pos); } catch (e) {}
    ov.remove();
  });
  footer.appendChild(cancelBtn); footer.appendChild(insertBtn);
  pop.appendChild(footer);
  ov.appendChild(pop);
  document.body.appendChild(ov);
  if (preloadFile) {
    const targetTab = ghReady ? "gh" : "file";
    switchTab(targetTab);
    if (targetTab === "gh") {
      fileInfo2.textContent = preloadFile.name + "  ·  " + Math.round(preloadFile.size / 1024) + " KB";
      handleFile(preloadFile, "gh");
    } else {
      fileInfo1.textContent = preloadFile.name + "  ·  " + Math.round(preloadFile.size / 1024) + " KB";
      handleFile(preloadFile, "file");
    }
  }
  setTimeout(() => { if (currentTab === "url") urlIn.focus(); }, 60);
}

function attachPasteImage(target) {
  target.addEventListener("paste", async (e) => {
    const items = (e.clipboardData || window.clipboardData) && (e.clipboardData || window.clipboardData).items;
    if (!items) return;
    let imgItem = null;
    for (let i = 0; i < items.length; i++) {
      if (items[i].type && items[i].type.indexOf("image") === 0) { imgItem = items[i]; break; }
    }
    if (!imgItem) return;
    e.preventDefault();
    const file = imgItem.getAsFile();
    if (!file) return;
    const ghCfg = loadGhConfig();
    const ghReady = !!(ghCfg.owner && ghCfg.repo && ghCfg.token);
    try {
      const result = await compressImage(file, 1000, 0.85);
      let markdown = "";
      if (ghReady) {
        try { const rel = await ghUploadImage(ghCfg, result.dataUrl); markdown = "![](" + rel + ")\n"; }
        catch (err) { markdown = "![](" + result.dataUrl + ")\n"; }
      } else markdown = "![](" + result.dataUrl + ")\n";
      const start = target.selectionStart, end = target.selectionEnd;
      const val = target.value;
      target.value = val.slice(0, start) + markdown + val.slice(end);
      target.focus();
      const pos = start + markdown.length;
      try { target.setSelectionRange(pos, pos); } catch (err) {}
    } catch (err) {}
  });
}
function attachDropImage(target) {
  target.addEventListener("dragover", (e) => {
    if (!e.dataTransfer || !e.dataTransfer.types) return;
    let hasFile = false;
    for (let i = 0; i < e.dataTransfer.types.length; i++) if (e.dataTransfer.types[i] === "Files") { hasFile = true; break; }
    if (!hasFile) return;
    e.preventDefault();
    try { e.dataTransfer.dropEffect = "copy"; } catch (err) {}
    target.classList.add("drag-over");
  });
  target.addEventListener("dragleave", () => target.classList.remove("drag-over"));
  target.addEventListener("drop", (e) => {
    target.classList.remove("drag-over");
    if (!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
    let img = null;
    for (let i = 0; i < e.dataTransfer.files.length; i++) {
      if (/^image\//.test(e.dataTransfer.files[i].type)) { img = e.dataTransfer.files[i]; break; }
    }
    if (!img) return;
    e.preventDefault();
    openImagePicker(target, img);
  });
}

function findDrugMatches(drugName) {
  const q = String(drugName || "").trim();
  if (!q) return [];
  const results = [];
  for (let i = 0; i < store.data.length; i++) {
    const it = store.data[i];
    let found = false;
    for (let k = 0; k < ALL_FIELDS.length; k++) {
      const val = String(it[ALL_FIELDS[k]] || "");
      if (val.indexOf(q) !== -1) { found = true; break; }
    }
    if (!found) {
      if (String(it.title || "").indexOf(q) !== -1) found = true;
      else if (String(it.chapter || "").indexOf(q) !== -1) found = true;
    }
    if (found) results.push(it);
  }
  return results;
}

function makeFieldRow(name, content, keyword, rawHtml, overlayRef) {
  const row = el("div", "field-row");
  const header = el("div", "field-header");
  const toggle = el("button", "field-toggle", "显示");
  const labelEl = el("div", "field-label", name);
  header.appendChild(toggle); header.appendChild(labelEl);
  row.appendChild(header);
  const bodyEl = el("div", "field-content");
  if (rawHtml) bodyEl.innerHTML = rawHtml;
  else bodyEl.innerHTML = renderRich(content, keyword);
  bodyEl.style.display = "none";
  row.appendChild(bodyEl);
  bodyEl.addEventListener("click", (e) => {
    const img = e.target.closest(".rich-img");
    if (img) { e.stopPropagation(); openImgPreview(img.src, img.alt); return; }
    const drug = e.target.closest(".rich-drug");
    if (drug) { e.stopPropagation(); openDrugPanel(drug.getAttribute("data-drug"), overlayRef); return; }
    const link = e.target.closest(".rich-link");
    if (!link) return;
    e.stopPropagation();
    const targetName = link.getAttribute("data-target");
    const targetItem = store.data.find(d => d.title === targetName);
    if (targetItem) {
      if (overlayRef && overlayRef.parentNode) overlayRef.remove();
      showDetail(targetItem);
    } else confirmPopup("未找到病例：「" + targetName + "」");
  });
  let visible = false;
  function apply(v) {
    visible = !!v;
    toggle.textContent = visible ? "隐藏" : "显示";
    bodyEl.style.display = visible ? "block" : "none";
  }
  toggle.addEventListener("click", () => apply(!visible));
  row._setVisible = apply;
  return row;
}
function itemToPlainText(item) {
  const lines = [item.title || ""];
  let meta = "科目：" + (item.subject || "");
  if (item.chapter) meta += "  章节：" + item.chapter;
  if (item.frequency) meta += "  " + item.frequency;
  lines.push(meta);
  lines.push("ID：" + (item.id || "") + "  状态：" + (item.status || "未看") + "  收藏：" + (item.starred ? "是" : "否"));
  if (item.tags && item.tags.length) lines.push("标签：" + item.tags.join("、"));
  lines.push("");
  const fields = getFieldsForSubject(item.subject);
  for (let i = 0; i < fields.length; i++) {
    const key = fields[i][0], name = fields[i][1];
    const val = String(item[key] == null ? "" : item[key]).trim();
    if (val) { lines.push("【" + name + "】"); lines.push(val); lines.push(""); }
  }
  const tl = collectTimelineEntries(item);
  if (tl.length) {
    lines.push("【病程时间轴】");
    for (let i = 0; i < tl.length; i++) lines.push("  " + tl[i].node + "（" + tl[i].field + "）：" + tl[i].text);
    lines.push("");
  }
  return lines.join("\n");
}
